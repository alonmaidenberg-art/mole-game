<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#193552;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#112b46;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0e2338}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#112840;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">☄️</div><h2>אסטרואידים</h2><div class="lb">סובבו את החללית וירו באסטרואידים. הם מתפצלים לקטנים!</div><div style="opacity:.75;font-size:12.5px;margin-top:8px"><b>◀ ▶</b> סיבוב · <b>▲</b> תאוצה · <b>רווח</b> ירי<br>בטלפון: גררו את האצבע (החללית עוקבת, יורה לבד)</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script src="../lib/real2d.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='asteroids'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let hits=[],on=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function B(x,y,w,h,col,txt,fn,fs=22,tc='#fff'){ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill();if(txt!=null){ctx.fillStyle=tc;ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+w/2,y+h/2+1)}if(fn)hits.push({x,y,w,h,fn})}
function T(t,x,y,fs=22,c='#fff',al='center'){ctx.fillStyle=c;ctx.font='bold '+fs+'px system-ui';ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);break}}});
function run(upd,drw,bg){let last=performance.now(),acc=0;const _bg=bg||'#111';let _grd=null;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(on)upd()}hits=[];if(window.R2){if(!_grd){_grd=ctx.createLinearGradient(0,0,0,H);_grd.addColorStop(0,R2.lighten(_bg,.17));_grd.addColorStop(.55,_bg);_grd.addColorStop(1,R2.darken(_bg,.27))}ctx.fillStyle=_grd}else ctx.fillStyle=_bg;ctx.fillRect(0,0,W,H);if(on||window.__show)drw();if(window.R2&&!window.__flatBg)R2.vignette(ctx,W,H,.2)}requestAnimationFrame(l)}
function wire(start){$('#go').onclick=()=>{$('#menu').classList.remove('show');start();on=true};$('#again').onclick=()=>{$('#end').classList.remove('show');start();on=true};$('#menu2').onclick=()=>{on=false;$('#end').classList.remove('show');$('#menu').classList.add('show')}}
function over(title,score,msg,coins,dia,delay=600){on=false;window.__show=true;saveBest(score);setTimeout(()=>endGame(title,score,msg,coins,dia),delay)}

let sh,as,bl,parts,score,lives,lvl,fcd,tp=null,inv;
cv.addEventListener('pointerdown',e=>{tp=cpos(e)});cv.addEventListener('pointermove',e=>{if(tp)tp=cpos(e)});addEventListener('pointerup',()=>tp=null);
function rock(x,y,s){const a=rnd(0,7),v=rnd(.6,1.8)/ (s/20+.5);const pts=[];for(let i=0;i<10;i++)pts.push(rnd(.75,1.1));return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s,r:0,vr:rnd(-.03,.03),pts}}
function wave(){for(let i=0;i<3+lvl;i++){let x,y;do{x=rnd(0,W);y=rnd(0,H)}while(Math.hypot(x-sh.x,y-sh.y)<150);as.push(rock(x,y,44))}}
function start(){sh={x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0};as=[];bl=[];parts=[];score=0;lives=3;lvl=1;fcd=0;inv=120;wave()}
function boom(x,y,n=10){for(let i=0;i<n;i++){const a=rnd(0,7),s=rnd(1,4);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0})}}
function upd(){const k=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);let thr=keys.ArrowUp||keys.KeyW;let fire=keys.Space;
  if(tp){const da=Math.atan2(tp.y-sh.y,tp.x-sh.x)-sh.a;let d=Math.atan2(Math.sin(da),Math.cos(da));sh.a+=clamp(d,-.12,.12);thr=Math.hypot(tp.x-sh.x,tp.y-sh.y)>40;fire=true}else sh.a+=k*.07;
  if(thr){sh.vx+=Math.cos(sh.a)*.12;sh.vy+=Math.sin(sh.a)*.12}sh.vx*=.99;sh.vy*=.99;sh.x=(sh.x+sh.vx+W)%W;sh.y=(sh.y+sh.vy+H)%H;
  if(inv>0)inv--;if(--fcd<=0&&fire){bl.push({x:sh.x+Math.cos(sh.a)*16,y:sh.y+Math.sin(sh.a)*16,vx:Math.cos(sh.a)*8+sh.vx,vy:Math.sin(sh.a)*8+sh.vy,t:0});fcd=14;tone(700,.04,'square',.04)}
  for(const b of bl){b.x=(b.x+b.vx+W)%W;b.y=(b.y+b.vy+H)%H;b.t++}bl=bl.filter(b=>b.t<70);
  for(const a of as){a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;a.r+=a.vr}
  for(const b of bl)for(const a of as)if(!a.dead&&Math.hypot(b.x-a.x,b.y-a.y)<a.s){a.dead=1;b.t=99;score+=a.s>30?20:a.s>16?50:100;boom(a.x,a.y);tone(150,.1,'sawtooth',.06);if(a.s>14){as.push(rock(a.x,a.y,a.s*.55),rock(a.x,a.y,a.s*.55))}}
  as=as.filter(a=>!a.dead);
  if(inv<=0)for(const a of as)if(Math.hypot(sh.x-a.x,sh.y-a.y)<a.s+8){lives--;boom(sh.x,sh.y,25);tone(100,.4,'sawtooth');if(lives<=0){over('החללית התפוצצה',score,'שלב '+lvl,Math.floor(score/30),lvl>=5?1:0);return}sh.x=W/2;sh.y=H/2;sh.vx=sh.vy=0;inv=150;break}
  if(!as.length){lvl++;wave();score+=100}
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.t++}parts=parts.filter(q=>q.t<40)}
function drw(){
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  for(const a of as){
    ctx.beginPath();
    for(let i=0;i<10;i++){const an=a.r+i/10*Math.PI*2,r=a.s*a.pts[i];
      i?ctx.lineTo(a.x+Math.cos(an)*r,a.y+Math.sin(an)*r):ctx.moveTo(a.x+Math.cos(an)*r,a.y+Math.sin(an)*r)}
    ctx.closePath();
    const rg=ctx.createRadialGradient(a.x-a.s*.3,a.y-a.s*.3,a.s*.1,a.x,a.y,a.s*1.1);
    rg.addColorStop(0,'rgba(150,170,200,.4)');rg.addColorStop(1,'rgba(40,50,75,.3)');
    ctx.fillStyle=rg;ctx.fill();
    ctx.shadowBlur=12;ctx.shadowColor='#9fd8ff';ctx.strokeStyle='#dff0ff';ctx.lineWidth=2.1;ctx.stroke()}
  ctx.restore();
  if(inv%10<6){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(sh.a);
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-12,10);ctx.lineTo(-6,0);ctx.lineTo(-12,-10);ctx.closePath();
    const sg=ctx.createLinearGradient(-12,0,16,0);
    sg.addColorStop(0,'rgba(20,80,80,.65)');sg.addColorStop(1,'rgba(120,255,230,.45)');
    ctx.fillStyle=sg;ctx.fill();
    ctx.shadowBlur=14;ctx.shadowColor='#5ff7d6';ctx.strokeStyle='#8ffde9';ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
  ctx.save();ctx.shadowBlur=10;ctx.shadowColor='#ffd05a';ctx.fillStyle='#fff0bd';
  for(const b of bl){ctx.beginPath();ctx.arc(b.x,b.y,2.6,0,7);ctx.fill()}ctx.restore();
  ctx.save();ctx.shadowBlur=8;ctx.shadowColor='#ff9f2e';
  for(const q of parts){ctx.globalAlpha=1-q.t/40;ctx.fillStyle='#ffc46b';ctx.fillRect(q.x,q.y,3,3)}ctx.restore();
  ctx.globalAlpha=1;T('⭐ '+score+'   שלב '+lvl+'   '+'❤️'.repeat(lives),W/2,22,20)}
wire(start);run(upd,drw,'#05051a');window.__s={step:upd,start:()=>{start();on=true},get on(){return on},get score(){return score},get as(){return as}};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
