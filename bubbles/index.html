<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1a1038;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#5b36d6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#1a1038;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#150a30;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2c1b6a,#1a1038);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0d0826}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#120a2c;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🫧</div><h2>פופ בועות</h2><div class="lb">חברו 3 בועות באותו צבע כדי לפוצץ. אל תתנו להן להגיע למטה!</div><div style="opacity:.75;font-size:12.5px;margin-top:8px">כוונו עם העכבר/האצבע, ולחצו/שחררו כדי לירות</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='bubbles'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

const R=17,COLS=15,TOP=14,GX=(W-COLS*R*2)/2,CL=['#ff5a6e','#ffd05a','#5ff7d6','#7a9bff','#c58bff'],DY=R*1.732,LINE=372;
let grid,par,state='menu',score,shots,cur,nxt,fly,ang,parts,msgT,pend,level;
const ok=(r,c)=>r>=0&&c>=0&&c<COLS-((r+par)%2)&&r<15;
const pos=(r,c)=>({x:GX+R+c*R*2+((r+par)%2?R:0),y:TOP+R+r*DY});
function nb(r,c){const p=(r+par)%2;return(p?[[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]]:[[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]]).filter(([a,b])=>ok(a,b))}
const rc=()=>Math.floor(Math.random()*Math.min(5,3+Math.floor(score/300)+1));
function usedColors(){const s=new Set();for(const row of grid)for(const v of row)if(v!==null&&v!==undefined)s.add(v);return[...s]}
function randCol(){const u=usedColors();return u.length?u[Math.floor(Math.random()*u.length)]:rc()}
function reset(){grid=[];par=0;for(let r=0;r<15;r++){grid.push(new Array(COLS).fill(null))}for(let r=0;r<6;r++)for(let c=0;c<COLS-(r%2);c++)grid[r][c]=Math.floor(Math.random()*4+(r>3?1:0));
  score=0;shots=0;fly=null;ang=-Math.PI/2;parts=[];cur=randCol();nxt=randCol();state='aim';msgT=0}
function aimAt(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;let a=Math.atan2(y-420,x-W/2);a=clamp(a,-Math.PI+.15,-.15);ang=a;return a}
cv.addEventListener('pointermove',e=>{if(state==='aim')aimAt(e)});cv.addEventListener('pointerdown',e=>{if(state==='aim')aimAt(e)});cv.addEventListener('pointerup',e=>{if(state==='aim'){aimAt(e);fire()}});
addEventListener('keydown',e=>{if(state!=='aim')return;if(e.code==='ArrowLeft')ang=Math.max(-Math.PI+.15,ang-.06);if(e.code==='ArrowRight')ang=Math.min(-.15,ang+.06);if(e.code==='Space')fire()});
function fire(){if(state!=='aim')return;fly={x:W/2,y:420,vx:Math.cos(ang)*13,vy:Math.sin(ang)*13,c:cur};state='fly';cur=nxt;nxt=randCol();tone(500,.05)}
function snap(){let best=null,bd=1e9;for(let r=0;r<15;r++)for(let c=0;c<COLS;c++){if(!ok(r,c)||grid[r][c]!==null)continue;if(r>0&&!nb(r,c).some(([a,b])=>grid[a][b]!==null))continue;const p=pos(r,c),d=Math.hypot(p.x-fly.x,p.y-fly.y);if(d<bd){bd=d;best=[r,c]}}
  const [r,c]=best;grid[r][c]=fly.c;land(r,c)}
function land(r,c){const col=grid[r][c],seen=new Set([r+','+c]),st=[[r,c]];while(st.length){const [a,b]=st.pop();for(const [x,y] of nb(a,b)){const k=x+','+y;if(!seen.has(k)&&grid[x][y]===col){seen.add(k);st.push([x,y])}}}
  if(seen.size>=3){for(const k of seen){const [a,b]=k.split(',').map(Number);pop(a,b);grid[a][b]=null}score+=seen.size*10;tone(700+seen.size*30,.1);
    const conn=new Set(),q=[];for(let c=0;c<COLS;c++)if(ok(0,c)&&grid[0][c]!==null){conn.add('0,'+c);q.push([0,c])}while(q.length){const [a,b]=q.pop();for(const [x,y] of nb(a,b)){const k=x+','+y;if(grid[x][y]!==null&&!conn.has(k)){conn.add(k);q.push([x,y])}}}
    let dropped=0;for(let a=0;a<15;a++)for(let b=0;b<COLS;b++)if(ok(a,b)&&grid[a][b]!==null&&!conn.has(a+','+b)){pop(a,b,true);grid[a][b]=null;dropped++}score+=dropped*20}
  else{shots++;if(shots%6===0)addRow()}
  fly=null;state='aim';if(!usedColors().length){score+=200;msgT=100;for(let r=0;r<4;r++)addRow();}
  for(let a=0;a<15;a++)for(let b=0;b<COLS;b++)if(ok(a,b)&&grid[a][b]!==null&&pos(a,b).y+R>LINE){lose();return}}
function addRow(){grid.pop();par^=1;const row=new Array(COLS).fill(null);for(let c=0;c<COLS-((par)%2);c++)row[c]=Math.floor(Math.random()*5);grid.unshift(row);tone(150,.1,'square',.06)}
function pop(r,c,fall){const p=pos(r,c);for(let i=0;i<(fall?3:6);i++)parts.push({x:p.x,y:p.y,vx:rnd(-3,3),vy:fall?rnd(1,4):rnd(-4,1),t:0,life:30,col:CL[grid[r][c]]})}
function lose(){state='dead';tone(120,.5,'sawtooth',.1);saveBest(score);setTimeout(()=>endGame('הבועות הגיעו למטה',score,'',Math.floor(score/25),score>=1500?1:0),600)}
function step(){if(state==='menu'||state==='dead')return;if(fly){for(let i=0;i<3;i++){fly.x+=fly.vx/3;fly.y+=fly.vy/3;if(fly.x<GX+R){fly.x=GX+R;fly.vx*=-1}if(fly.x>GX+COLS*R*2-R){fly.x=GX+COLS*R*2-R;fly.vx*=-1}
    if(fly.y<=TOP+R){snap();break}let hit=false;for(let r=0;r<15&&!hit;r++)for(let c=0;c<COLS;c++){if(!ok(r,c)||grid[r][c]===null)continue;const p=pos(r,c);if(Math.hypot(p.x-fly.x,p.y-fly.y)<R*1.85){hit=true;break}}if(hit){snap();break}}}
  for(const q of parts){q.t++;q.x+=q.vx;q.y+=q.vy;q.vy+=.3}parts=parts.filter(q=>q.t<q.life);if(msgT>0)msgT--}
function bub(x,y,c,rr=R){const g=ctx.createRadialGradient(x-rr*.35,y-rr*.35,1,x,y,rr);g.addColorStop(0,'#fff');g.addColorStop(.3,CL[c]);g.addColorStop(1,CL[c]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr-1,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke()}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1a6a');g.addColorStop(1,'#0f1a4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(GX,0,COLS*R*2,H);ctx.strokeStyle='#ff5a6e';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(GX,LINE);ctx.lineTo(GX+COLS*R*2,LINE);ctx.stroke();ctx.setLineDash([]);
  for(let r=0;r<15;r++)for(let c=0;c<COLS;c++){if(!ok(r,c)||grid[r][c]===null)continue;const p=pos(r,c);bub(p.x,p.y,grid[r][c])}
  if(state==='aim'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.setLineDash([5,8]);ctx.lineWidth=2;ctx.beginPath();let x=W/2,y=420,vx=Math.cos(ang),vy=Math.sin(ang);ctx.moveTo(x,y);for(let i=0;i<60;i++){x+=vx*8;y+=vy*8;if(x<GX+R||x>GX+COLS*R*2-R)vx*=-1;ctx.lineTo(x,y);if(y<TOP)break}ctx.stroke();ctx.setLineDash([])}
  if(fly)bub(fly.x,fly.y,fly.c);else if(cur!==undefined)bub(W/2,420,cur);bub(W/2-70,428,nxt,12);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('הבא',W/2-70,412);
  for(const q of parts){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,4,0,7);ctx.fill()}ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='left';ctx.fillText('⭐ '+score,16,34);ctx.textAlign='right';ctx.fillText('שיא '+best,W-16,34);if(msgT>0){ctx.textAlign='center';ctx.fillStyle='#ffd05a';ctx.font='bold 40px system-ui';ctx.fillText('נקי! +200',W/2,220)}}
let last=performance.now(),acc=0;function loop(n){requestAnimationFrame(loop);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;step()}if(grid&&state!=='menu')draw();else{ctx.fillStyle='#2a1a6a';ctx.fillRect(0,0,W,H)}}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show')};
window.__s={reset,step,fire,get state(){return state},get score(){return score},set ang(v){ang=v}};requestAnimationFrame(loop);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
