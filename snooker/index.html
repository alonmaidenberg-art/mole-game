<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1a1038;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#5b36d6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#1a1038;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#150a30;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2c1b6a,#1a1038);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0d0826}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#120a2c;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🎱</div><h2>סנוקר</h2><div class="lb">הכניסו אדום, אחר כך צבעוני, וצברו נקודות. מי שמקבל יותר ניצח</div><div class="chips" id="md"><button class="chip on" data-v="cpu">נגד מחשב</button><button class="chip" data-v="2p">שני שחקנים</button></div><div class="chips" style="margin-top:8px" id="lv"><button class="chip" data-v="1">קל</button><button class="chip on" data-v="2">רגיל</button><button class="chip" data-v="3">קשה</button></div><div style="opacity:.75;font-size:12.5px;margin-top:8px;line-height:1.6">לכוון ולירות: לחצו על הכדור הלבן, <b>גררו אחורה</b> ושחררו. ככל שמושכים יותר, הירייה חזקה יותר<br>פסילה (לבן נכנס / פגיעה שגויה) = 4 נקודות ליריב</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='snooker'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let mode='cpu',lvl=2;for(const id of['md','lv'])[...$('#'+id).children].forEach(b=>b.onclick=()=>{[...$('#'+id).children].forEach(k=>k.classList.toggle('on',k===b));if(id==='md')mode=b.dataset.v;else lvl=+b.dataset.v});
const X0=70,X1=730,Y0=70,Y1=380,BR=9,PR=19,PK=[[X0-6,Y0-6],[W/2,Y0-12],[X1+6,Y0-6],[X0-6,Y1+6],[W/2,Y1+12],[X1+6,Y1+6]];
const COL={yellow:['#f2d21b',2,190,Y0+(Y1-Y0)/2-52],green:['#1b9a4a',3,190,Y0+(Y1-Y0)/2+52],brown:['#8a5a2a',4,190,(Y0+Y1)/2],blue:['#2a5fd6',5,W/2,(Y0+Y1)/2],pink:['#ff7aa8',6,540,(Y0+Y1)/2],black:['#151515',7,690,(Y0+Y1)/2]};
const SEQ=['yellow','green','brown','blue','pink','black'];
let balls,cue,state='menu',cur,sc,need,phase,seqI,firstHit,potted,cuePot,drag,msg='',msgT=0,aiT=0,over=false;
function spot(b){const c=COL[b.t];b.x=c[2];b.y=c[3];b.vx=b.vy=0;b.in=false;let tries=0;while(balls.some(o=>o!==b&&!o.in&&Math.hypot(o.x-b.x,o.y-b.y)<BR*2)&&tries++<50)b.x+=BR*2.1}
function reset(){balls=[];for(const t of SEQ){const c=COL[t];balls.push({t,x:c[2],y:c[3],vx:0,vy:0,in:false,col:c[0],pts:c[1]})}
  for(let i=0;i<5;i++)for(let j=0;j<=i;j++)balls.push({t:'red',x:566+i*BR*1.75,y:(Y0+Y1)/2+(j-i/2)*BR*2.05,vx:0,vy:0,in:false,col:'#d42a2a',pts:1});
  cue={t:'cue',x:150,y:(Y0+Y1)/2+0,vx:0,vy:0,in:false,col:'#fff',pts:0};balls.push(cue);cur=0;sc=[0,0];need='red';phase='reds';seqI=0;state='aim';over=false;msg='';drag=null;aiT=0;announce(P()+' מתחיל')}
const P=()=>mode==='2p'?'שחקן '+(cur+1):(cur===0?'אתה':'המחשב');
function announce(m){msg=m;msgT=120}
function moving(){return balls.some(b=>!b.in&&(Math.abs(b.vx)>.04||Math.abs(b.vy)>.04))}
function shoot(a,p){cue.vx=Math.cos(a)*p;cue.vy=Math.sin(a)*p;state='roll';firstHit=null;potted=[];cuePot=false;tone(300,.06,'square',.08)}
function cp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{if(state!=='aim'||(mode==='cpu'&&cur===1))return;const p=cp(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<45)drag={x:p.x,y:p.y};});
cv.addEventListener('pointermove',e=>{if(drag)drag=Object.assign(drag,{x:cp(e).x,y:cp(e).y})});
addEventListener('pointerup',()=>{if(!drag)return;const dx=cue.x-drag.x,dy=cue.y-drag.y,d=Math.hypot(dx,dy);drag=null;if(d>10)shoot(Math.atan2(dy,dx),Math.min(26,d*.16))});
function phys(){for(let s=0;s<5;s++){for(const b of balls){if(b.in)continue;b.x+=b.vx/5;b.y+=b.vy/5;
    for(const p of PK)if(Math.hypot(b.x-p[0],b.y-p[1])<PR){b.in=true;b.vx=b.vy=0;sink(b);break}if(b.in)continue;
    const mouthX=p=>false;if(b.x<X0+BR){if(!(b.y<Y0+PR-4||b.y>Y1-PR+4)){b.x=X0+BR;b.vx=Math.abs(b.vx)*.8}}if(b.x>X1-BR){if(!(b.y<Y0+PR-4||b.y>Y1-PR+4)){b.x=X1-BR;b.vx=-Math.abs(b.vx)*.8}}
    if(b.y<Y0+BR){if(!(Math.abs(b.x-W/2)<PR-4||b.x<X0+PR-4||b.x>X1-PR+4)){b.y=Y0+BR;b.vy=Math.abs(b.vy)*.8}}if(b.y>Y1-BR){if(!(Math.abs(b.x-W/2)<PR-4||b.x<X0+PR-4||b.x>X1-PR+4)){b.y=Y1-BR;b.vy=-Math.abs(b.vy)*.8}}}
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.in||b.in)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<BR*2&&d>.001){const nx=dx/d,ny=dy/d,ov=BR*2-d;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rv>0){a.vx-=rv*nx;a.vy-=rv*ny;b.vx+=rv*nx;b.vy+=rv*ny;if(rv>1.5)tone(500+rv*20,.03,'sine',.05);if(firstHit===null&&(a===cue||b===cue)){firstHit=(a===cue?b:a).t}}}}}
  for(const b of balls){b.vx*=.989;b.vy*=.989;if(Math.hypot(b.vx,b.vy)<.04){b.vx=b.vy=0}}}
function sink(b){tone(200,.15,'sine',.08);if(b===cue)cuePot=true;else potted.push(b)}
function legalFirst(t){if(phase==='reds')return need==='red'?t==='red':t!=='red';return t===SEQ[seqI]}
function settle(){const reds=balls.filter(b=>b.t==='red'&&!b.in).length;let foul=false;
  if(cuePot||firstHit===null||!legalFirst(firstHit))foul=true;
  if(!foul){if(phase==='reds'){if(need==='red'){if(potted.some(b=>b.t!=='red'))foul=true}else{if(potted.some(b=>b.t==='red')||potted.length>1||potted.some(b=>b.t!==firstHit))foul=true}}else{if(potted.some(b=>b.t!==SEQ[seqI]))foul=true}}
  const opp=1-cur;
  if(foul){sc[opp]+=4;announce('פסילה! 4 נקודות ל'+(mode==='2p'?'שחקן '+(opp+1):(opp===0?'אתה':'המחשב')));for(const b of potted)if(b.t!=='red'&&phase==='reds')spot(b);else if(b.t!=='red'&&phase==='seq'){spot(b)}
    if(cuePot||true){cue.in=false;cue.x=150;cue.y=(Y0+Y1)/2;cue.vx=cue.vy=0;let t=0;while(balls.some(o=>o!==cue&&!o.in&&Math.hypot(o.x-cue.x,o.y-cue.y)<BR*2)&&t++<40)cue.y+=BR*2.2}
    cur=opp;need=phase==='reds'?(balls.filter(b=>b.t==='red'&&!b.in).length?'red':'color'):'color'}
  else if(potted.length){let pts=0;for(const b of potted)pts+=b.pts;sc[cur]+=pts;announce(P()+' +'+pts);tone(800,.15);
    if(phase==='reds'){if(need==='red'){need=reds>0?'color':'color';if(reds===0)phase='free'}else{for(const b of potted)spot(b);need='red';if(reds===0){phase='seq';seqI=0}}
      if(phase==='free'){/* last red potted: one free colour */phase='reds';need='color'}}
    else{for(const b of potted){seqI++;}if(seqI>=SEQ.length){finish();return}}
    if(phase==='reds'&&reds===0&&need==='red'){phase='seq';seqI=0}}
  else{cur=1-cur;if(phase==='reds'&&need==='color')need='red';if(phase==='reds'&&need==='red'&&!balls.some(b=>b.t==='red'&&!b.in)){phase='seq';seqI=0}announce('התור עובר ל'+P())}
  if(phase==='reds'&&need==='red'&&!balls.some(b=>b.t==='red'&&!b.in)){phase='seq';seqI=0}
  if(phase==='seq'&&seqI>=SEQ.length){finish();return}
  state='aim';aiT=50}
function finish(){over=true;state='over';const w=sc[0]>sc[1]?0:sc[1]>sc[0]?1:-1;saveBest(sc[0]);setTimeout(()=>endGame(mode==='2p'?(w<0?'תיקו':w===0?'שחקן 1 ניצח!':'שחקן 2 ניצח!'):(w===0?'ניצחת! 🏆':w<0?'תיקו':'המחשב ניצח'),sc[0]+' : '+sc[1],'',mode==='cpu'?(w===0?20+lvl*10:6)+Math.floor(sc[0]/4):0,mode==='cpu'&&w===0&&lvl===3?1:0),800)}
function clear(x1,y1,x2,y2,ign){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;for(const b of balls){if(b.in||ign.includes(b))continue;const t=((b.x-x1)*dx+(b.y-y1)*dy)/(l*l);if(t<0||t>1)continue;const px=x1+dx*t,py=y1+dy*t;if(Math.hypot(b.x-px,b.y-py)<BR*2-1)return false}return true}
function ai(){const targets=balls.filter(b=>!b.in&&b!==cue&&(phase==='reds'?(need==='red'?b.t==='red':b.t!=='red'):b.t===SEQ[seqI]));let best=null,bs=1e9;
  for(const t of targets)for(const p of PK){const dx=p[0]-t.x,dy=p[1]-t.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,gx=t.x-ux*BR*2,gy=t.y-uy*BR*2;if(gx<X0||gx>X1||gy<Y0||gy>Y1)continue;
    if(!clear(t.x,t.y,p[0],p[1],[t])||!clear(cue.x,cue.y,gx,gy,[t]))continue;const cx=gx-cue.x,cy=gy-cue.y,cd=Math.hypot(cx,cy);const cosA=(cx*ux+cy*uy)/cd;if(cosA<.25)continue;const sco=cd+d*.8-cosA*80;if(sco<bs){bs=sco;best={a:Math.atan2(cy,cx),d:cd+d}}}
  const err=[0,.09,.045,.015][lvl];if(best){shoot(best.a+rnd(-err,err),clamp(5+best.d*.022+rnd(-1,1)*lvl*.1,5,20))}
  else{const t=targets.length?targets[Math.floor(Math.random()*targets.length)]:balls.find(b=>!b.in&&b!==cue);shoot(Math.atan2(t.y-cue.y,t.x-cue.x)+rnd(-.05,.05),7)}}
function step(){if(state==='menu'||state==='over')return;if(state==='roll'){phys();if(!moving())settle()}else if(state==='aim'&&mode==='cpu'&&cur===1){if(--aiT<=0)ai()}if(msgT>0)msgT--}
function draw(){ctx.fillStyle='#2a1608';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4a2a10';ctx.beginPath();ctx.roundRect?ctx.roundRect(X0-34,Y0-34,X1-X0+68,Y1-Y0+68,22):ctx.rect(X0-34,Y0-34,X1-X0+68,Y1-Y0+68);ctx.fill();
  ctx.fillStyle='#14703a';ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);const g=ctx.createRadialGradient(W/2,(Y0+Y1)/2,40,W/2,(Y0+Y1)/2,420);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(0,0,0,.2)');ctx.fillStyle=g;ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(190,Y0);ctx.lineTo(190,Y1);ctx.stroke();ctx.beginPath();ctx.arc(190,(Y0+Y1)/2,52,Math.PI/2,Math.PI*1.5);ctx.stroke();
  for(const p of PK){ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p[0],p[1],PR,0,7);ctx.fill()}
  for(const b of balls){if(b.in)continue;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(b.x+2,b.y+3,BR,0,7);ctx.fill();const gr=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BR);gr.addColorStop(0,'#fff');gr.addColorStop(.25,b.col);gr.addColorStop(1,b.col);ctx.fillStyle=b.t==='cue'?'#f4f4f4':gr;ctx.beginPath();ctx.arc(b.x,b.y,BR,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(b.x-3,b.y-3,2.2,0,7);ctx.fill()}
  if(drag&&state==='aim'){const dx=cue.x-drag.x,dy=cue.y-drag.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(cue.x+Math.cos(a)*400,cue.y+Math.sin(a)*400);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#c8914a';ctx.lineWidth=6;ctx.lineCap='round';const back=Math.min(d,160)+BR+4;ctx.beginPath();ctx.moveTo(cue.x-Math.cos(a)*back,cue.y-Math.sin(a)*back);ctx.lineTo(cue.x-Math.cos(a)*(back+160),cue.y-Math.sin(a)*(back+160));ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2-100,H-26,200,10);ctx.fillStyle=d>150?'#ff5a5a':'#ffd05a';ctx.fillRect(W/2-100,H-26,Math.min(200,d*1.3),10)}
  ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='left';ctx.fillText((mode==='2p'?'שחקן 1':'אתה')+': '+sc[0],16,28);ctx.textAlign='right';ctx.fillText((mode==='2p'?'שחקן 2':'מחשב')+': '+sc[1],W-16,28);ctx.textAlign='center';ctx.font='16px system-ui';ctx.fillStyle=cur===0?'#ffd05a':'#9fe8ff';ctx.fillText('תור: '+P()+' · '+(phase==='seq'?'הכניסו '+({yellow:'צהוב',green:'ירוק',brown:'חום',blue:'כחול',pink:'ורוד',black:'שחור'})[SEQ[seqI]||'black']:need==='red'?'הכניסו אדום':'הכניסו צבעוני'),W/2,24);
