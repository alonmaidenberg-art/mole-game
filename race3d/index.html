const N=260,TW=15;const C=[];for(let i=0;i<N;i++){const t=i/N*Math.PI*2,r=70+20*Math.sin(2*t)+11*Math.cos(3*t);C.push({x:r*Math.cos(t),z:r*Math.sin(t)})}
for(let i=0;i<N;i++){const a=C[i],b=C[(i+1)%N];let dx=b.x-a.x,dz=b.z-a.z;const l=Math.hypot(dx,dz);a.dx=dx/l;a.dz=dz/l;a.nx=-a.dz;a.nz=a.dx}
{const pos=[],idx=[],uv=[];let run=0;
 for(let i=0;i<N;i++){const a=C[i],b=C[(i+1)%N];
   pos.push(a.x+a.nx*TW*-1,.02,a.z+a.nz*TW*-1, a.x+a.nx*TW,.02,a.z+a.nz*TW);
   uv.push(0,run/7, 5,run/7);
   run+=Math.hypot(b.x-a.x,b.z-a.z)}
 for(let i=0;i<N;i++){const j=(i+1)%N;idx.push(i*2,j*2,i*2+1,i*2+1,j*2,j*2+1)}

 g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(idx);g.computeVertexNormals();
 const ac=R3.asphalt(3);
 const road=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:R3.tex(ac,1,1),roughnessMap:R3.greyTex(ac),roughness:.95,metalness:0,envMapIntensity:.22,side:THREE.DoubleSide}));
 road.receiveShadow=true;scene.add(road);
 for(const s of[-1,1]){const p2=[],i2=[],c2=[];
  for(let i=0;i<N;i++){const a=C[i];
   p2.push(a.x+a.nx*(TW)*s,.05,a.z+a.nz*(TW)*s, a.x+a.nx*(TW+1.6)*s,.05,a.z+a.nz*(TW+1.6)*s);
   const k=(Math.floor(i/3)%2)?[.85,.09,.09]:[.93,.93,.95];c2.push(...k,...k)}
  for(let i=0;i<N;i++){const j=(i+1)%N;i2.push(i*2,j*2,i*2+1,i*2+1,j*2,j*2+1)}
  const g2=new THREE.BufferGeometry();
  g2.setAttribute('position',new THREE.Float32BufferAttribute(p2,3));
  g2.setAttribute('color',new THREE.Float32BufferAttribute(c2,3));
  g2.setIndex(i2);g2.computeVertexNormals();
  const kerb=new THREE.Mesh(g2,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.55,metalness:0,envMapIntensity:.4,side:THREE.DoubleSide}));
  kerb.receiveShadow=true;scene.add(kerb)}}


const gc=R3.grass(11);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({map:R3.tex(gc,150,150),roughnessMap:R3.greyTex(gc),roughness:.95,metalness:0,envMapIntensity:.3}));
gr.rotation.x=-Math.PI/2;gr.position.y=-.02;gr.receiveShadow=true;scene.add(gr);
{const dashMat=new THREE.MeshStandardMaterial({color:0xf2f2ee,roughness:.6,metalness:0,envMapIntensity:.3});
 for(let i=0;i<N;i+=4){const a=C[i],m=new THREE.Mesh(new THREE.BoxGeometry(.4,.02,2),dashMat);m.position.set(a.x,.055,a.z);m.rotation.y=Math.atan2(a.dx,a.dz);scene.add(m)}}
function nearest(x,z,from){let b=0,bd=1e9;if(from==null){for(let i=0;i<N;i++){const d=(C[i].x-x)**2+(C[i].z-z)**2;if(d<bd){bd=d;b=i}}}else for(let k=-12;k<=12;k++){const i=(from+k+N)%N,d=(C[i].x-x)**2+(C[i].z-z)**2;if(d<bd){bd=d;b=i}}return{i:b,d:Math.sqrt(bd)}}
{const barkC=R3.wood(23,['#6b4a2e','#5c3f26','#7a553a','#60422a']);
 const bark=new THREE.MeshStandardMaterial({map:R3.tex(barkC,2,2),roughness:.92,metalness:0,envMapIntensity:.25});
 const leafMats=[0x2f7d35,0x357f3c,0x27702f,0x3c8a40].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:0,envMapIntensity:.3,flatShading:true}));
 const trunkG=new THREE.CylinderGeometry(.34,.56,3.2,10),coneG=new THREE.ConeGeometry(1,1,9);
 for(let k=0;k<110;k++){const a=Math.random()*Math.PI*2,r=rnd(30,160);const x=r*Math.cos(a),z=r*Math.sin(a);
  if(nearest(x,z).d<TW+6)continue;
  const t=new THREE.Group();
  const tr=new THREE.Mesh(trunkG,bark);tr.position.y=1.6;tr.castShadow=true;t.add(tr);
  const lm=leafMats[(Math.random()*leafMats.length)|0];
  for(let c2=0;c2<3;c2++){const lf=new THREE.Mesh(coneG,lm);
   const w=2.9-c2*.62,h=3.1-c2*.5;lf.scale.set(w,h,w);lf.position.y=3.2+c2*1.35;
   lf.rotation.y=Math.random()*3;lf.castShadow=true;t.add(lf)}
  t.position.set(x,0,z);const s=rnd(.8,1.5);t.scale.set(s,s,s);scene.add(t)}}
const CARG=(function(){
  // body: a real car silhouette, extruded across the width
  const sh=new THREE.Shape(),P=[[-2,.30],[-2,.74],[-1.78,.90],[-1.0,.97],[-.55,1.0],[.5,1.0],[1.2,.95],[1.78,.88],[1.98,.70],[2,.42],[2,.30]];
  sh.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)sh.lineTo(P[i][0],P[i][1]);sh.lineTo(P[0][0],P[0][1]);

  body.translate(0,0,-.95);body.rotateY(-Math.PI/2);
  // greenhouse: windscreen, side glass, rear screen
  const gh=new THREE.Shape(),Q=[[-1.52,.99],[-1.12,1.44],[.08,1.46],[.76,1.0]];
  gh.moveTo(Q[0][0],Q[0][1]);for(let i=1;i<Q.length;i++)gh.lineTo(Q[i][0],Q[i][1]);gh.lineTo(Q[0][0],Q[0][1]);
  const glass=new THREE.ExtrudeGeometry(gh,{depth:1.74,bevelEnabled:false,steps:1});
  glass.translate(0,0,-.87);glass.rotateY(-Math.PI/2);
  return{body:body,glass:glass,
    tyre:new THREE.CylinderGeometry(.46,.46,.36,26),
    rim:new THREE.CylinderGeometry(.27,.27,.38,16),
    hub:new THREE.CylinderGeometry(.09,.09,.4,10),

    stay:new THREE.BoxGeometry(.13,.3,.13),

const GLASSM=R3.glass({color:0x101a26,envMapIntensity:1.7}),TYREM=R3.rubber(),RIMM=R3.chrome({roughness:.18}),
      HUBM=new THREE.MeshStandardMaterial({color:0x2a2d33,roughness:.5,metalness:.8,envMapIntensity:.9}),
      HEADM=R3.emissive(0xfff6d8,1.5),TAILM=R3.emissive(0xff1d12,2.6),

function mkCar(c){
  const g=new THREE.Group(),paint=R3.paint(c);
  const b=new THREE.Mesh(CARG.body,paint);b.castShadow=true;b.receiveShadow=true;g.add(b);
  const gl=new THREE.Mesh(CARG.glass,GLASSM);gl.castShadow=true;g.add(gl);
  const rf=new THREE.Mesh(CARG.roof,paint);rf.position.set(0,1.47,-.5);rf.castShadow=true;g.add(rf);
  const sp=new THREE.Mesh(CARG.spoil,paint);sp.position.set(0,1.26,-1.92);sp.castShadow=true;g.add(sp);
  for(const sx of[-.74,.74]){const st=new THREE.Mesh(CARG.stay,paint);st.position.set(sx,1.1,-1.9);g.add(st)}
  const vn=new THREE.Mesh(CARG.vent,VENTM);vn.position.set(0,.40,-1.93);g.add(vn);
  for(const sx of[-.62,.62]){
    const hl=new THREE.Mesh(CARG.lamp,HEADM);hl.position.set(sx,.78,1.97);g.add(hl);
    const tl=new THREE.Mesh(CARG.lamp,TAILM);tl.position.set(sx,.82,-2.0);g.add(tl)}
  for(const x of[-1,1])for(const z of[-1.3,1.3]){
    const w=new THREE.Group();
    const ty=new THREE.Mesh(CARG.tyre,TYREM);ty.rotation.z=Math.PI/2;ty.castShadow=true;
    const rm=new THREE.Mesh(CARG.rim,RIMM);rm.rotation.z=Math.PI/2;
    const hb=new THREE.Mesh(CARG.hub,HUBM);hb.rotation.z=Math.PI/2;
    w.add(ty,rm,hb);w.position.set(x*1.05,.46,z);g.add(w)}

let state='menu',cars,laps=4,frame,cdn,boost,fin,me,keys2={l:0,r:0,g:0,b:0,n:0};
function reset(){for(const c of cars||[])scene.remove(c.g);cars=[];const names=['אתה','דני','רוני','גל'];const oc=CC.filter((_,i)=>i!==sel);
  for(let k=0;k<4;k++){const i=(N-3-k*3)%N,a=C[i],lat=(k%2?1:-1)*4;const c={g:mkCar(k===0?CC[sel]:oc[k-1]),x:a.x+a.nx*lat,z:a.z+a.nz*lat,a:Math.atan2(a.dx,a.dz),v:0,idx:i,lap:0,half:false,prog:0,ai:k>0,sp:[0,.95,1.05,1.15][lvl]*(.93+k*.03),name:names[k],fin:0,off:rnd(-5,5),bt:0};cars.push(c)}
  me=cars[0];frame=0;cdn=240;boost=100;fin=0;state='play'}
function stepCar(c){const L=c.ai;let steer=0,acc=0,br=0;
  if(!L){steer=(keys2.r||keys.ArrowRight||keys.KeyD?1:0)-(keys2.l||keys.ArrowLeft||keys.KeyA?1:0);acc=keys2.g||keys.ArrowUp||keys.KeyW?1:0;br=keys2.b||keys.ArrowDown||keys.KeyS?1:0;if(c.fin)acc=0}
  else{const t=C[(c.idx+7)%N];const tx=t.x+t.nx*c.off,tz=t.z+t.nz*c.off;let da=Math.atan2(tx-c.x,tz-c.z)-c.a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;steer=clamp(-da*2.5,-1,1);acc=1;if(Math.abs(da)>.5&&c.v>.5)br=.5}
  if(cdn>0){acc=0;steer=0}
  const nr=nearest(c.x,c.z,c.idx);const off=nr.d>TW;let vmax=(c.ai?.55*c.sp:.56)*(off?.45:1);if(!c.ai&&c.bt>0)vmax=.85;
  if(acc)c.v+=.011;if(br)c.v-=.025;if(!acc&&!br)c.v*=.99;if(c.v>vmax)c.v+= (vmax-c.v)*.08;c.v=Math.max(0,c.v);

  c.x+=Math.sin(c.a)*c.v;c.z+=Math.cos(c.a)*c.v;
  for(const o of cars)if(o!==c){const dx=c.x-o.x,dz=c.z-o.z,d=Math.hypot(dx,dz);if(d<2.6&&d>.01){c.x+=dx/d*.15;c.z+=dz/d*.15;c.v*=.985}}
  const ni=nr.i;if(c.idx>N*.85&&ni<N*.15){if(c.half){c.lap++;c.half=false;if(c.lap>=laps&&!c.fin){c.fin=++fin;if(!c.ai)finish(c)}}}if(ni>N*.4&&ni<N*.6)c.half=true;c.idx=ni;c.prog=c.lap*N+(ni>N*.9&&c.lap===0&&!c.half?ni-N:ni);
  c.g.position.set(c.x,0,c.z);c.g.rotation.y=c.a;c.g.rotation.z=-steer*c.v*.06}
function finish(c){saveBest(0);const pos=c.fin;setTimeout(()=>{state='over';endGame(pos===1?'ניצחת! 🥇':pos===2?'מקום שני 🥈':pos===3?'מקום שלישי 🥉':'מקום '+pos,'מקום '+pos,'',[0,40,28,18,8][pos]*lvl/2|0,pos===1&&lvl===3?1:0)},1200)}
for(const [id,k] of[['#bL','l'],['#bR','r'],['#bG','g'],['#bB','b'],['#bN','n']]){const b=$(id);if(matchMedia('(pointer:coarse)').matches)b.style.display='block';const on=e=>{e.preventDefault();keys2[k]=1;b.classList.add('on')},off=()=>{keys2[k]=0;b.classList.remove('on')};b.addEventListener('pointerdown',on);for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,off)}
function step(){frame++;if(cdn>0){cdn--}
  me.bt=Math.max(0,me.bt-1);if((keys.Space||keys2.n)&&boost>2&&!me.fin&&cdn<=0){me.bt=3;boost-=1.1}else if(boost<100)boost+=.12;
  for(const c of cars)stepCar(c);
  const a=me.a;cam.position.set(me.x-Math.sin(a)*9,4.2+me.v*1.2,me.z-Math.cos(a)*9);cam.lookAt(me.x+Math.sin(a)*8,1.2,me.z+Math.cos(a)*8);cam.fov=60+me.v*25;cam.updateProjectionMatrix();
  const rank=[...cars].sort((p,q)=>q.prog-p.prog).indexOf(me)+1;$('#hud').innerHTML=(cdn>0?'<div style="font-size:90px;margin-top:80px">'+Math.ceil(cdn/60)+'</div>':'<div style="font-size:22px">מקום '+rank+'/4 · הקפה '+Math.min(laps,me.lap+1)+'/'+laps+' · '+Math.round(me.v*300)+' קמ״ש</div><div style="width:160px;height:8px;background:#0006;margin:6px auto;border-radius:4px"><div style="width:'+boost+'%;height:100%;background:#ffb02e;border-radius:4px"></div></div>')}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show');$('#hud').innerHTML=''};
window.__s={reset,step,get state(){return state},get cars(){return cars},get me(){return me}};
cam.position.set(0,90,10);cam.lookAt(0,0,0);runLoop(step,()=>state==='play');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
