<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#101522;color:#fff;overflow:hidden;
  font-family:Rubik,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none;user-select:none}
#cv{display:block;width:100%;height:100%;touch-action:none}
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:30;padding:16px;background:rgba(8,11,20,.9)}
.ov.show{display:grid}
.ovc{background:#1b2338;border:4px solid #080b14;border-radius:22px;padding:18px;max-width:450px;width:100%;
  box-shadow:0 12px 0 #080b14;max-height:90vh;overflow:auto;text-align:center}
.ovc h2{margin:0 0 6px;font:900 26px Rubik,system-ui}
.ovc p{margin:7px 0;font-size:14.5px;line-height:1.55;opacity:.92}
.btn{border:3px solid #080b14;border-radius:15px;background:#5ff7d6;color:#101522;
  font:900 15px Rubik,system-ui;padding:11px 16px;cursor:pointer;box-shadow:0 5px 0 #080b14;margin:5px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #080b14}
.btn.d{background:#8a93a8;color:#101522}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cols button{border:3px solid #080b14;border-radius:16px;padding:14px 4px;cursor:pointer;
  font:900 13px Rubik,system-ui;color:#101522;box-shadow:0 4px 0 #080b14}
.cols button.on{outline:4px solid #fff;outline-offset:2px}
#pad{position:fixed;inset:0;z-index:20;pointer-events:none}
#stick{position:absolute;inset-inline-start:18px;bottom:max(18px,env(safe-area-inset-bottom));
  width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:auto}
#nub{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
.tip{position:fixed;inset-inline:0;top:56px;text-align:center;z-index:18;pointer-events:none;
  font:900 16px Rubik,system-ui;text-shadow:0 2px 5px rgba(0,0,0,.9);opacity:0;transition:opacity .25s}
.tip.show{opacity:1}

<body>
<canvas id="cv"></canvas>
<div id="pad"><div id="stick"><div id="nub"></div></div></div>
<div class="tip" id="tip"></div>

<div class="ov show" id="menu"><div class="ovc">
  <div style="font-size:52px">🎨</div>
  <h2>כיבוש השטח</h2>
  <p>צאו מהשטח שלכם — ומאחוריכם נמתח קו. סגרו לולאה וחזרו הביתה, וכל מה שהקפתם נצבע בצבע שלכם.</p>
  <p><b>אבל</b> כל עוד אתם בחוץ הקו שלכם פגיע: מי שדורך עליו — הורג אתכם. וגם אתם לא יכולים לדרוך על הקו של עצמכם.</p>
  <div class="cols" id="pick"></div>
  <p style="font-size:13px;opacity:.75" id="ctrl"></p>
  <button class="btn" id="go">▶ שחק</button>
  <div style="opacity:.8;margin-top:8px;font-size:14px">השיא שלכם: <b id="best">0</b>% מהמפה</div>
</div></div>

<div class="ov" id="endM"><div class="ovc">
  <div style="font-size:52px" id="endE">🏁</div><h2 id="endT"></h2>
  <div id="endList" style="text-align:start;margin:10px 0"></div>
  <button class="btn" id="again">↻ עוד פעם</button>
</div></div>

<script src="../hub.js"></script>
<script>
'use strict';
/* © 2026 Alon Maidenberg. Territory: claim ground by looping around it.
   Written from scratch; the idea of claiming area is a genre, the code is mine. */

const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const $=s=>document.getElementById(s);
const GW=58,GH=58,CS=18;              /* grid cells and their size in world px */
const WW=GW*CS,WH=GH*CS;
const MATCH=150;                      /* seconds */
const COLS=[
 {nm:'תכלת', c:'#35e0ff',c2:'#0d7f9a',t:'#0a3744'},
 {nm:'ורוד', c:'#ff5fa2',c2:'#a41f5c',t:'#450f27'},
 {nm:'ליים', c:'#9bff6a',c2:'#4c9b27',t:'#1d3d12'},
 {nm:'כתום', c:'#ffb545',c2:'#a86a10',t:'#45290a'}];
const idx=(x,y)=>y*GW+x;
const inB=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

let own,trail,acts,P,state,clock,me,parts,says,best=0,flood,queue;
try{best=+localStorage.getItem('territory_best')||0}catch(e){}

function mkActor(id,human,gx,gy){
  return{id,human,gx,gy,dir:0,nd:0,t:0,sp:7.4,alive:true,dead:0,
    trail:[],out:false,score:0,think:0,goal:null,legs:0,go:!human}}
function seed(a){
  for(let y=a.gy-3;y<=a.gy+3;y++)for(let x=a.gx-3;x<=a.gx+3;x++)
    if(inB(x,y))own[idx(x,y)]=a.id}
function startGame(pick){
  me=pick;
  own=new Uint8Array(GW*GH);trail=new Uint8Array(GW*GH);
  flood=new Uint8Array(GW*GH);queue=new Int32Array(GW*GH);
  parts=[];says=[];clock=0;
  const spots=[[12,12],[GW-13,12],[12,GH-13],[GW-13,GH-13]];
  acts=[];
  for(let i=0;i<4;i++){const a=mkActor(i+1,i===pick,spots[i][0],spots[i][1]);
    a.sp=i===pick?7.4:6.6+Math.random()*0.9;acts.push(a);seed(a)}
  P=acts[pick];
  state='play';
  document.getElementById('menu').classList.remove('show');
  document.getElementById('endM').classList.remove('show');
  say('צאו החוצה, הקיפו שטח, וחזרו הביתה',3)}

/* ---------- claiming ----------
   Everything the loop encloses becomes yours: flood from the edges over
   whatever is not yours, and anything the flood never reached is inside. */
function claim(a){
  for(const c of a.trail){own[c]=a.id;trail[c]=0}
  a.trail.length=0;a.out=false;
  flood.fill(0);
  let head=0,tail=0;
  const push=(x,y)=>{if(!inB(x,y))return;const i=idx(x,y);
    if(flood[i]||own[i]===a.id)return;flood[i]=1;queue[tail++]=i};
  for(let x=0;x<GW;x++){push(x,0);push(x,GH-1)}
  for(let y=0;y<GH;y++){push(0,y);push(GW-1,y)}
  while(head<tail){const i=queue[head++],x=i%GW,y=(i/GW)|0;
    push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1)}
  let got=0;
  for(let i=0;i<own.length;i++)
    if(!flood[i]&&own[i]!==a.id){
      /* taking ground from somebody else wipes their trail there too */
      if(trail[i]){const v=acts.find(z=>z.id===trail[i]);if(v)kill(v,a)}
      own[i]=a.id;got++}
  if(got){
    a.score=0;
    if(a===P){
      say('+'+got+' משבצות',1.4);
      for(let k=0;k<10;k++)parts.push({x:(a.gx+.5)*CS,y:(a.gy+.5)*CS,
        vx:(Math.random()-.5)*280,vy:(Math.random()-.5)*280,a:.8,c:COLS[a.id-1].c})}
    if(window.AG&&a===P)AG.add(Math.min(40,Math.floor(got/12)),0)}}

function kill(a,by){
  if(!a.alive)return;
  for(const c of a.trail)trail[c]=0;
  a.trail.length=0;a.out=false;a.alive=false;a.dead=1.6;
  for(let k=0;k<18;k++)parts.push({x:(a.gx+.5)*CS,y:(a.gy+.5)*CS,
    vx:(Math.random()-.5)*340,vy:(Math.random()-.5)*340,a:.9,c:COLS[a.id-1].c});
  /* losing costs ground, so dying actually matters */
  let n=0;const cells=[];
  for(let i=0;i<own.length;i++)if(own[i]===a.id)cells.push(i);
  for(let i=cells.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;
    const t=cells[i];cells[i]=cells[j];cells[j]=t}
  for(let i=0;i<cells.length*.25;i++){own[cells[i]]=0;n++}
  if(a===P)say('נדרסתם! איבדתם '+n+' משבצות',2.2);
  else if(by===P)say('הפלתם את ה'+COLS[a.id-1].nm,1.8)}
function respawn(a){
  for(let tries=0;tries<200;tries++){
    const x=4+((Math.random()*(GW-8))|0),y=4+((Math.random()*(GH-8))|0);
    let clear=true;
    for(let yy=y-2;yy<=y+2&&clear;yy++)for(let xx=x-2;xx<=x+2;xx++)
      if(!inB(xx,yy)||trail[idx(xx,yy)]){clear=false;break}
    if(!clear)continue;
    a.gx=x;a.gy=y;break}
  a.alive=true;a.t=0;a.out=false;a.dir=a.nd=0;a.go=!a.human;seed(a)}

/* ---------- stepping ---------- */
const DX=[1,0,-1,0],DY=[0,1,0,-1];
function arrive(a){
  const i=idx(a.gx,a.gy);
  /* a trail under your feet: whoever drew it goes down */
  if(trail[i]){
    const v=acts.find(z=>z.id===trail[i]);
    if(v){kill(v,a);if(v===a)return}}
  if(own[i]===a.id){ if(a.out)claim(a) }
  else{ a.out=true;trail[i]=a.id;a.trail.push(i) }}
function stepActor(a,dt){
  if(!a.alive){a.dead-=dt;if(a.dead<=0)respawn(a);return}
  if(!a.go)return;                      /* the human waits for a first direction */
  a.t+=a.sp*dt;
  while(a.t>=1){
    a.t-=1;
    /* turning only happens on a cell boundary, and never straight back */
    if((a.nd+2)%4!==a.dir||!a.out)a.dir=a.nd;
    const nx=a.gx+DX[a.dir],ny=a.gy+DY[a.dir];
    if(!inB(nx,ny)){
      if(a.out){kill(a,null);return}        /* run off the map while out and you are gone */
      a.t=0;break}
    a.gx=nx;a.gy=ny;
    arrive(a);
    if(!a.alive)return}}

/* ---------- bots ---------- */
function nearestOwn(a){
  let bd=1e9,b=null;
  for(let y=0;y<GH;y+=2)for(let x=0;x<GW;x+=2){
    if(own[idx(x,y)]!==a.id)continue;
    const d=Math.abs(x-a.gx)+Math.abs(y-a.gy);
    if(d<bd){bd=d;b={x,y}}}
  return b}
function botThink(a,dt){
  a.think-=dt;if(a.think>0)return;
  a.think=.16;
  const home=own[idx(a.gx,a.gy)]===a.id;
  /* heading home: walk back to the nearest cell we own */
  if(a.out&&a.legs<=0){
    const h=nearestOwn(a);
    if(h){const dx=h.x-a.gx,dy=h.y-a.gy;
      a.nd=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3)}
    return}
  if(home&&!a.out){
    /* set out on a rectangle of a few legs */
    a.legs=3+((Math.random()*3)|0);
    a.nd=(Math.random()*4)|0}
  else if(a.legs>0&&Math.random()<.22){a.legs--;a.nd=(a.nd+(Math.random()<.5?1:3))%4}
  /* do not walk into a wall or onto our own trail */
  for(let k=0;k<4;k++){
    const nx=a.gx+DX[a.nd],ny=a.gy+DY[a.nd];
    if(inB(nx,ny)&&trail[idx(nx,ny)]!==a.id)break;
    a.nd=(a.nd+1)%4}
  if(a.out)a.legs-=dt*1.6}

/* ---------- input ---------- */
const key={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  const k=e.key.toLowerCase();key[k]=1;
  if(k==='arrowright'||k==='d')P&&(P.nd=0,P.go=1);
  if(k==='arrowdown'||k==='s')P&&(P.nd=1,P.go=1);
  if(k==='arrowleft'||k==='a')P&&(P.nd=2,P.go=1);
  if(k==='arrowup'||k==='w')P&&(P.nd=3,P.go=1)});
addEventListener('keyup',e=>key[e.key.toLowerCase()]=0);
let stick={ax:0,ay:0,id:null};
(function(){const el=$('stick'),nub=$('nub');
  function set(e){const r=el.getBoundingClientRect(),dx=e.clientX-r.left-68,dy=e.clientY-r.top-68;
    const d=Math.hypot(dx,dy),m=Math.min(1,d/48);
    if(d>8){stick.ax=dx/d*m;stick.ay=dy/d*m;
      if(P){P.nd=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);P.go=1}}
    nub.style.left=(43+stick.ax*48)+'px';nub.style.top=(43+stick.ay*48)+'px'}
  el.addEventListener('pointerdown',e=>{e.preventDefault();stick.id=e.pointerId;el.setPointerCapture(e.pointerId);set(e)});
  el.addEventListener('pointermove',e=>{if(stick.id===e.pointerId)set(e)});
  const end=e=>{if(stick.id!==e.pointerId)return;stick.id=null;stick.ax=stick.ay=0;
    nub.style.left='43px';nub.style.top='43px'};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)})();
/* swipe anywhere also steers */
let sw=null;
cv.addEventListener('pointerdown',e=>sw={x:e.clientX,y:e.clientY});
cv.addEventListener('pointermove',e=>{if(!sw||!P)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)<22)return;
  P.nd=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);P.go=1;
  sw={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>sw=null);

/* ---------- loop ---------- */
function say(s,t){says.push({s,t:t||2})}
function counts(){
  const n=[0,0,0,0,0];
  for(let i=0;i<own.length;i++)n[own[i]]++;
  return n}
function step(dt){
  if(state!=='play')return;
  clock+=dt;
  for(const a of acts){if(!a.human)botThink(a,dt);stepActor(a,dt)}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.a-=dt*1.6;
    if(q.a<=0)parts.splice(i,1)}
  for(let i=says.length-1;i>=0;i--){says[i].t-=dt;if(says[i].t<=0)says.splice(i,1)}
  if(clock>=MATCH)finish()}
function finish(){
  if(state==='over')return;
  state='over';
  const n=counts(),tot=GW*GH;
  const rows=acts.map(a=>({a,pc:n[a.id]/tot*100})).sort((x,y)=>y.pc-x.pc);
  const mine=Math.round(n[P.id]/tot*100);
  const won=rows[0].a===P;
  $('endE').textContent=won?'🏆':'🏁';
  $('endT').textContent=won?'ניצחתם!':'נגמר הזמן';
  const L=$('endList');L.textContent='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);'+
      'border-radius:12px;padding:8px 11px;margin:5px 0;font:900 15px Rubik,system-ui';
    const sw2=document.createElement('span');
    sw2.style.cssText='width:18px;height:18px;border-radius:5px;background:'+COLS[r.a.id-1].c;
    const nm=document.createElement('span');nm.style.flex='1';
    nm.textContent=(i+1)+'. '+COLS[r.a.id-1].nm+(r.a===P?' (אתם)':'');
    const pc=document.createElement('span');pc.textContent='⁦'+r.pc.toFixed(1)+'%⁩';
    d.append(sw2,nm,pc);L.append(d)});
  if(mine>best){best=mine;try{localStorage.setItem('territory_best',String(best))}catch(e){}}
  $('endM').classList.add('show');
  if(window.AG)AG.add(25+mine*3,won?1:0)}

/* ---------- drawing ---------- */
let camx=0,camy=0;
function draw(){
  const w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(2,devicePixelRatio||1);
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle='#101522';cx.fillRect(0,0,w,h);
  if(!P)return;
  const zoom=clamp(Math.min(w,h)/(CS*26),.5,1.5);
  const px=(P.gx+.5+DX[P.dir]*P.t)*CS,py=(P.gy+.5+DY[P.dir]*P.t)*CS;
  camx+=(px-camx)*.16;camy+=(py-camy)*.16;
  cx.save();cx.translate(w/2,h/2);cx.scale(zoom,zoom);cx.translate(-camx,-camy);
  const x0=clamp(Math.floor((camx-w/2/zoom)/CS)-1,0,GW-1),
        x1=clamp(Math.ceil((camx+w/2/zoom)/CS)+1,0,GW-1),
        y0=clamp(Math.floor((camy-h/2/zoom)/CS)-1,0,GH-1),
        y1=clamp(Math.ceil((camy+h/2/zoom)/CS)+1,0,GH-1);
  cx.fillStyle='#161d2e';cx.fillRect(0,0,WW,WH);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=idx(x,y),o=own[i],t=trail[i];
    if(o){cx.fillStyle=COLS[o-1].t;cx.fillRect(x*CS,y*CS,CS,CS);
      cx.fillStyle=COLS[o-1].c2;cx.fillRect(x*CS,y*CS,CS-1,CS-1)}
    if(t){cx.fillStyle=COLS[t-1].c;cx.fillRect(x*CS+3,y*CS+3,CS-6,CS-6)}}
  /* grid */
  cx.strokeStyle='rgba(255,255,255,.04)';cx.lineWidth=1;
  for(let x=x0;x<=x1+1;x++){cx.beginPath();cx.moveTo(x*CS,y0*CS);cx.lineTo(x*CS,(y1+1)*CS);cx.stroke()}
  for(let y=y0;y<=y1+1;y++){cx.beginPath();cx.moveTo(x0*CS,y*CS);cx.lineTo((x1+1)*CS,y*CS);cx.stroke()}
  cx.strokeStyle='#39456b';cx.lineWidth=5;cx.strokeRect(0,0,WW,WH);
  /* players */
  for(const a of acts){
    if(!a.alive)continue;
    const ax=(a.gx+.5+DX[a.dir]*a.t)*CS,ay=(a.gy+.5+DY[a.dir]*a.t)*CS;
    cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(ax,ay+CS*.4,CS*.42,CS*.2,0,0,6.3);cx.fill();
    cx.fillStyle=COLS[a.id-1].c;
    cx.beginPath();cx.arc(ax,ay,CS*.44,0,6.3);cx.fill();
    cx.fillStyle='#0d1322';
    cx.beginPath();cx.arc(ax+DX[a.dir]*CS*.16,ay+DY[a.dir]*CS*.16,CS*.15,0,6.3);cx.fill();
    if(a===P){cx.strokeStyle='#fff';cx.lineWidth=2.5;
      cx.beginPath();cx.arc(ax,ay,CS*.62,0,6.3);cx.stroke()}}
  for(const q of parts){cx.globalAlpha=Math.max(0,q.a);cx.fillStyle=q.c;
    cx.fillRect(q.x-3,q.y-3,6,6)}
  cx.globalAlpha=1;
  cx.restore();
  hud(w,h,zoom)}
function hud(w,h){
  cx.direction='ltr';cx.textBaseline='middle';
  const n=counts(),tot=GW*GH;
  /* the share bar, below the row of buttons the hub floats at the top */
  const bw=Math.min(430,w-24),bx=(w-bw)/2,by=56;
  cx.fillStyle='rgba(8,11,20,.6)';
  cx.beginPath();cx.roundRect?cx.roundRect(bx-4,by-4,bw+8,30,9):cx.rect(bx-4,by-4,bw+8,30);cx.fill();
  let at=bx;
  for(let i=1;i<=4;i++){const seg=bw*(n[i]/tot);
    cx.fillStyle=COLS[i-1].c;cx.fillRect(at,by,Math.max(0,seg),22);at+=seg}
  cx.fillStyle='rgba(255,255,255,.12)';cx.fillRect(at,by,Math.max(0,bx+bw-at),22);
  cx.font='900 13px Rubik,system-ui';cx.textAlign='center';cx.fillStyle='#fff';
  cx.fillText((n[P.id]/tot*100).toFixed(1)+'%',bx+bw/2,by+11);
  /* clock */
  const left=Math.max(0,MATCH-clock);
  cx.font='900 22px Rubik,system-ui';cx.textAlign='center';
  cx.fillStyle=left<20?'#ff5fa2':'#fff';
  cx.fillText(Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'),w/2,30);
  /* out-of-territory warning */
  if(P.alive&&!P.go){
    cx.font='900 20px Rubik,system-ui';cx.textAlign='center';cx.fillStyle='#fff';
    cx.globalAlpha=.6+Math.sin(clock*4)*.35;
    cx.fillText('בחרו כיוון כדי להתחיל',w/2,h-70);cx.globalAlpha=1}
  if(P.alive&&P.out){
    cx.strokeStyle=COLS[P.id-1].c;cx.lineWidth=4;cx.globalAlpha=.35+Math.sin(clock*7)*.25;
    cx.strokeRect(3,3,w-6,h-6);cx.globalAlpha=1}
  /* messages */
  cx.font='900 17px Rubik,system-ui';
  says.forEach((m,i)=>{cx.globalAlpha=Math.min(1,m.t);
    const tw=cx.measureText(m.s).width+24;
    cx.fillStyle='rgba(8,11,20,.68)';cx.fillRect(w/2-tw/2,96+i*34,tw,28);
    cx.fillStyle='#fff';cx.fillText(m.s,w/2,110+i*34);cx.globalAlpha=1})}

function resize(){const d=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);
  cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  acc+=dt;let g=0;
  while(acc>=1/60&&g++<5){step(1/60);acc-=1/60}
  draw()}

(function(){
  let pick=0;const box=$('pick');
  COLS.forEach((c,i)=>{const b=document.createElement('button');
    b.style.background=c.c;b.textContent=c.nm;
    if(i===0)b.className='on';
    b.onclick=()=>{pick=i;[...box.children].forEach((e,j)=>e.className=j===i?'on':'')};
    box.append(b)});
  $('ctrl').textContent=matchMedia('(pointer:coarse)').matches
    ?'ג׳ויסטיק או החלקה על המסך'
    :'חיצים או WASD · אפשר גם לגרור עם העכבר';
  $('best').textContent=best;
  $('go').onclick=()=>{startGame(pick);resize()};
  $('again').onclick=()=>{document.getElementById('endM').classList.remove('show');
    document.getElementById('menu').classList.add('show');$('best').textContent=best};
  resize();requestAnimationFrame(frame)})();
</script>
</body>
