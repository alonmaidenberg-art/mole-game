<meta name="description" content="מתחילים ממכונת משחק אחת ובונים רשת ארקייד: משחקים כדי להשיג מטבעות, מוכרים ללקוחות, וקונים מכונות, עובדים והרחבות.">
<meta name="theme-color" content="#efe0bd">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#efe0bd;color:#3a2d1e;font-family:system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#topc{position:absolute;top:max(8px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;gap:6px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid #3a2d1e;border-radius:999px;padding:5px 14px;font-weight:900;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(58,45,30,.25)}
#clock.urgent{color:#e0483f}
#inv{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.cell{background:#fff;border:3px solid #3a2d1e;border-radius:16px;padding:5px 13px;font-weight:900;font-size:18px;text-align:center;min-width:66px;box-shadow:0 3px 0 rgba(58,45,30,.25)}
.cell small{display:block;font-size:9.5px;opacity:.6;font-weight:800}
.cell.off{opacity:.35}
#banner{position:fixed;top:13%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #3a2d1e;border-radius:18px;padding:9px 20px;font-weight:900;font-size:clamp(14px,4vw,20px);z-index:10;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 0 rgba(58,45,30,.22)}
.ov{position:fixed;inset:0;background:rgba(58,45,30,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:14px;overflow-y:auto}
.ov.show{display:flex}
.ovc{width:100%;max-width:430px;background:#fffaf0;border:4px solid #3a2d1e;border-radius:28px;padding:22px;text-align:center;margin:auto;box-shadow:0 8px 0 rgba(58,45,30,.25)}
.ovc h2{margin:0 0 6px;font-size:27px;color:#3a2d1e}
.lb{opacity:.82;font-size:14px;margin-bottom:8px;line-height:1.6}
.btn{display:block;width:100%;border:3px solid #3a2d1e;border-radius:18px;padding:13px;margin-top:9px;font:inherit;font-size:19px;font-weight:900;color:#3a2d1e;cursor:pointer;background:#ffd45e;box-shadow:0 5px 0 #3a2d1e}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3a2d1e}
.btn.go{background:#7be36b}
.btn.alt{background:#fff;font-size:15px;padding:10px}
#mg{position:fixed;inset:0;background:rgba(24,18,12,.95);display:none;align-items:center;justify-content:center;z-index:22;flex-direction:column;gap:8px}
#mg.show{display:flex}
#mgTop{display:flex;gap:12px;align-items:center;font-weight:900;font-size:16px;color:#fff}
#mgCombo{color:#ffd45e}
#mgcv{border-radius:20px;border:4px solid #fff;background:#120d18;touch-action:none;max-width:94vw;max-height:62vh}
#mgHint{font-size:12.5px;color:rgba(255,255,255,.72);text-align:center;padding:0 12px}
#joy{position:fixed;bottom:max(20px,calc(env(safe-area-inset-bottom) + 20px));left:16px;width:108px;height:108px;border-radius:50%;border:4px solid rgba(58,45,30,.3);background:rgba(255,255,255,.45);display:none;touch-action:none;z-index:8}
#jk{position:absolute;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #3a2d1e;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#act{position:fixed;bottom:max(26px,calc(env(safe-area-inset-bottom) + 26px));right:18px;width:80px;height:80px;border-radius:50%;border:4px solid #3a2d1e;background:#ffd45e;display:none;align-items:center;justify-content:center;font-size:32px;touch-action:none;z-index:8;box-shadow:0 5px 0 #3a2d1e}
body.touch #joy{display:block}
body.touch #act{display:flex}
#fps{position:fixed;bottom:2px;left:4px;font-size:10px;opacity:.25;z-index:9;pointer-events:none}
</style>

<canvas id="cv"></canvas>
<div id="banner"></div>
<div id="hud">
  <div id="topc">
    <div class="pill" id="money">💵 0</div>

  </div>

    <div class="cell" id="i1">0<small>🪙 רגיל</small></div>
    <div class="cell off" id="i2">0<small>💠 אולטרה</small></div>

  </div>
</div>
<div id="joy"><div id="jk"></div></div>
<div id="act">✋</div>
<div id="fps"></div>

<div id="mg"><div id="mgTop"><span id="mgName"></span><span id="mgTime"></span><span id="mgScore"></span><span id="mgCombo"></span></div>
  <canvas id="mgcv" width="640" height="420"></canvas>
  <div id="mgHint"></div>
</div>

<div class="ov show" id="menu"><div class="ovc">
  <div style="font-size:50px">🕹️</div>
  <h2>אימפריית הארקייד</h2>
  <div class="lb">מתחילים עם <b>מכונת משחק אחת</b>. משחקים בעצמכם כדי להשיג מטבעות, מוכרים ללקוחות — ולאט לאט בונים אימפריה.</div>
  <div class="lb" style="font-size:12.5px;opacity:.68">כדי לקנות משהו עומדים בתוך <b>המשבצת המקווקוות</b> והכסף נשפך פנימה עד שזה נבנה.</div>
  <button class="btn go" id="startBtn">▶ פתיחת החנות</button>
  <button class="btn alt" id="resetBtn">התחלה מחדש</button>
  <div style="margin-top:10px;opacity:.72;font-size:14px">הון: <b id="mMoney">0</b> 💵 · יום <b id="mDay">1</b> · <b id="mRank"></b></div>

<div class="ov" id="dayEnd"><div class="ovc">
  <div style="font-size:42px">🌙</div>

  <button class="btn alt" id="deMenu">תפריט</button>
</div></div>

<script src="../avatar.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nf=n=>Math.round(n).toLocaleString('he');

/* ───── audio ───── */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,f2){const a=ac();if(!a)return;try{
  const o=a.createOscillator(),g=a.createGain();o.type=ty||'triangle';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),a.currentTime+d);
  g.gain.setValueAtTime(v||.055,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}catch(e){}}
function chord(fs,d){fs.forEach((f,i)=>setTimeout(()=>tone(f,d,'sine',.05),i*70))}

/* ───── canvas / camera ───── */
const cv=$('#cv'),X=cv.getContext('2d');
let VW=0,VH=0,DPR=1,ZOOM=46;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  VW=innerWidth;VH=innerHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  fitZoom();
}
function fitZoom(){
  const S=SIZES[SAVE.size];
  ZOOM=clamp(Math.min(VW/(S.w+4.5),VH/(S.h+7.5)),16,50);
}
addEventListener('resize',resize);
const cam={x:0,y:0};
const sx=w=>(w-cam.x)*ZOOM+VW/2;
const sy=w=>(w-cam.y)*ZOOM+VH/2;

/* rounded drawing helpers — nothing in this game is a hard square */
function rr(x,y,w,h,r){X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r);else X.rect(x,y,w,h)}
function shadowEllipse(px,py,rx,ry,a){
  X.save();X.globalAlpha=a===undefined?.17:a;X.fillStyle='#3a2d1e';
  X.beginPath();X.ellipse(px,py,rx,ry,0,0,TAU);X.fill();X.restore();
}
function label(px,py,txt,bg,fg,fs){
  fs=fs||15;
  X.save();
  X.font='900 '+fs+'px system-ui';
  const w=X.measureText(txt).width+22,h=fs+16;
  X.fillStyle='rgba(58,45,30,.22)';rr(px-w/2,py-h/2+3,w,h,h/2);X.fill();
  X.fillStyle=bg||'#fff';rr(px-w/2,py-h/2,w,h,h/2);X.fill();
  X.lineWidth=3;X.strokeStyle='#3a2d1e';X.stroke();
  X.fillStyle=fg||'#3a2d1e';X.textAlign='center';X.textBaseline='middle';
  X.fillText(txt,px,py+1);
  X.restore();
}

/* ═══════ catalogue ═══════ */
/* src:'play' = מרוויחים במכונות · src:'buy' = קונים מלאי במשטח הפריקה */
const COIN=[
 {ic:'🪙',nm:'מטבע',  price:9,   src:'play'},
 {ic:'💠',nm:'אולטרה',price:30,  src:'play'},
 {ic:'🥽',nm:'VR',    price:95,  src:'play'},
 {ic:'💿',nm:'דיסק',  price:130, src:'buy',buy:58, cap:14,need:'discs'},
 {ic:'🎮',nm:'שלט',   price:280, src:'buy',buy:135,cap:10,need:'pads'},
 {ic:'🎁',nm:'קונסולה',price:980,src:'buy',buy:540,cap:5, need:'console'}
];
const MACHINES=[
 {id:0,ic:'🌊',nm:'גלים פרו',   cost:0,    tier:0,col:'#4fc3f7'},
 {id:1,ic:'🎯',nm:'מטווח',      cost:420,  tier:0,col:'#7be36b'},
 {id:2,ic:'🧱',nm:'שובר לבנים', cost:1500, tier:1,col:'#ff8a3d'},
 {id:3,ic:'🏁',nm:'מסלול מהיר', cost:4200, tier:1,col:'#ff6b8b'},
 {id:4,ic:'🥽',nm:'תא VR',      cost:11000,tier:2,col:'#a67bff'}
];
const STAFF=[
 {id:'cashier',ic:'🧑‍💼',nm:'קופאי',     cost:l=>2200+l*2600,max:3},
 {id:'gamer',  ic:'🎮',nm:'שחקן שכיר',cost:l=>3400+l*3900,max:3},
 {id:'cleaner',ic:'🧹',nm:'איש אחזקה',cost:l=>1700+l*2000,max:2}
];
const SIZES=[
 {nm:'דוכן קטן',   w:15,h:13,slots:2,cost:0},
 {nm:'חנות',       w:20,h:16,slots:3,cost:5200},
 {nm:'אולם ארקייד',w:25,h:19,slots:4,cost:16000},
 {nm:'מגה־ארקייד', w:30,h:22,slots:5,cost:42000}
];
/* כל שדרוג מציב חפץ אמיתי בחנות */
const UPG=[
 {id:'seats',  ic:'🛋️',nm:'ספסל המתנה', ds:'לקוחות בתור יושבים ומחכים בסבלנות', max:4,cost:l=>340+l*380},
 {id:'till',   ic:'💳',nm:'קופה חכמה',   ds:'עמדת תשלום על הדלפק · +22% למכירה', max:3,cost:l=>420+l*520},
 {id:'neon',   ic:'📣',nm:'שלט ניאון',   ds:'נתלה מעל הדלת · עוד לקוחות',        max:3,cost:l=>460+l*560},
 {id:'plant',  ic:'🪴',nm:'עציץ',        ds:'מרענן את החנות · פחות נטישות',      max:4,cost:l=>240+l*260},
 {id:'discs',  ic:'💿',nm:'מדף דיסקים',  ds:'פותח מכירת 💿 — קונים מלאי במשטח',  max:1,cost:()=>3800, min:1},
 {id:'pads',   ic:'🎮',nm:'מדף שלטים',   ds:'פותח מכירת 🎮',                      max:1,cost:()=>9500, min:2},
 {id:'console',ic:'🎁',nm:'ויטרינת קונסולות',ds:'פותח מכירת 🎁 — הפריט היקר ביותר',max:1,cost:()=>26000,min:2}
];
const UPGBY=id=>UPG.find(u=>u.id===id);

/* ───── save ───── */
const SKEY='arcade_tycoon_v3';
let SAVE={money:0,day:1,up:{},own:[0],staff:{},size:0,best:0};
function loadSave(){try{const o=JSON.parse(store.get(SKEY,'')||'{}');
  SAVE.money=+o.money||0;SAVE.day=+o.day||1;SAVE.up=o.up||{};
  SAVE.own=Array.isArray(o.own)&&o.own.length?o.own:[0];
  SAVE.staff=o.staff||{};SAVE.size=+o.size||0;SAVE.best=+o.best||0}catch(e){}}
function saveNow(){try{store.set(SKEY,JSON.stringify(SAVE))}catch(e){}}
const up=id=>SAVE.up[id]|0;
const stf=id=>SAVE.staff[id]|0;
const owns=id=>SAVE.own.indexOf(id)>-1;
function maxTier(){let t=0;for(const id of SAVE.own)t=Math.max(t,MACHINES[id].tier);return t}
loadSave();

/* ───── runtime ───── */
let inv=[0,0,0,0,0,0],money=0,rep=100,dayT=0,DAYLEN=180,dayEarn=0,served=0,lost=0;
let state='menu';
function payFor(k,n){return Math.round(COIN[k].price*n*(1+up('till')*.22))}
function goodOpen(k){
  const g=COIN[k];
  if(g.src==='buy')return up(g.need)>0;
  return MACHINES.some(m=>m.tier===k&&owns(m.id))||k<=maxTier();
}
function setInv(){
  const box=$('#inv');box.innerHTML='';
  for(let k=0;k<COIN.length;k++){
    if(!goodOpen(k))continue;
    const d=document.createElement('div');d.className='cell';
    d.innerHTML=inv[k]+'<small>'+COIN[k].ic+' '+COIN[k].nm+'</small>';
    box.appendChild(d);
  }
}
function setMoney(){$('#money').textContent='💵 '+nf(money)}
function setRep(){$('#rep').textContent='⭐ '+Math.round(rep)+'%'}
function banner(t,d){const b=$('#banner');b.textContent=t;b.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(()=>b.style.opacity=0,(d||2)*1000)}

/* ═══════ shop layout ═══════ */
let SH={x0:-7,x1:7,y0:-6,y1:6},DOORX=0,CNT={y:0,x0:0,x1:0};
let machines=[],plots=[],corner=[],floats=[],benches=[],plants=[],shelves=[],neon=0;
function layout(){
  const S=SIZES[SAVE.size];
  fitZoom();
  SH={x0:-S.w/2,x1:S.w/2,y0:-S.h/2,y1:S.h/2};
  DOORX=0;
  CNT={y:SH.y0+S.h*.52,x0:SH.x0+1.4,x1:SH.x1-1.4};
  machines=[];plots=[];corner=[];
  const slots=S.slots,span=(SH.x1-1.9)-(SH.x0+1.9);
  const flat=SAVE.own.filter(i=>i!==4);
  for(let i=0;i<slots;i++){
    const px=SH.x0+1.9+(slots===1?span/2:span*i/(slots-1)),py=SH.y0+1.5;
    if(i<flat.length)machines.push({id:flat[i],x:px,y:py});
    else{
      const next=MACHINES.find(m=>m.id!==4&&!owns(m.id)&&!plots.some(p=>p.ref===m.id));
      if(next)plots.push({x:px,y:py,w:2.2,h:2.0,kind:'machine',ref:next.id,cost:next.cost,fill:0,ic:next.ic,nm:next.nm});
    }
  }
  if(owns(4))machines.push({id:4,x:SH.x1-2.3,y:SH.y0+4.1,vr:true});
  else if(SAVE.size>=1)plots.push({x:SH.x1-2.3,y:SH.y0+4.1,w:2.5,h:2.3,kind:'machine',ref:4,cost:MACHINES[4].cost,fill:0,ic:'🥽',nm:'תא VR'});
  const nC=1+SAVE.size;
  for(let i=0;i<nC;i++){
    const px=SH.x0+1.7+i*1.8;
    if(px>SH.x1-1.5)break;
    corner.push({x:px,y:SH.y1-2.1,t:Math.random()*9});
  }
  /* ── furniture you actually bought ── */
  benches=[];plants=[];shelves=[];neon=up('neon');
  for(let i=0;i<up('seats');i++){
    const side=i%2?1:-1,row=(i/2)|0;
    benches.push({x:DOORX+side*(2.6+row*1.5),y:CNT.y+2.6+row*1.9});
  }
  for(let i=0;i<up('plant');i++){
    const sp=[[SH.x0+1.0,SH.y1-1.0],[SH.x1-1.0,SH.y1-1.0],[SH.x0+1.0,SH.y0+1.0],[SH.x1-1.0,SH.y0+1.0]][i%4];
    plants.push({x:sp[0],y:sp[1]});
  }
  /* shelves for bought-in stock, each with its own delivery pad */
  const buyable=COIN.map((g,k)=>({g,k})).filter(o=>o.g.src==='buy'&&up(o.g.need));
  buyable.forEach((o,i)=>{
    const sx2=DOORX+(i-(buyable.length-1)/2)*4.0, sy2=SH.y0+4.5;
    shelves.push({k:o.k,x:sx2,y:sy2});
    plots.push({x:sx2,y:sy2+1.9,w:1.6,h:1.35,kind:'stock',ref:o.k,
      cost:o.g.buy,fill:0,ic:o.g.ic,nm:'מלאי '+o.g.nm});
  });
  /* one hire and one upgrade offered at a time — the floor stays readable */
  const nextStaff=STAFF.map(s=>({s,lv:stf(s.id)})).filter(o=>o.lv<o.s.max)
    .sort((a,b)=>a.s.cost(a.lv)-b.s.cost(b.lv))[0];
  if(nextStaff)plots.push({x:SH.x0+1.7,y:CNT.y-2.4,w:2.0,h:1.8,kind:'staff',ref:nextStaff.s.id,
    cost:nextStaff.s.cost(nextStaff.lv),fill:0,ic:nextStaff.s.ic,nm:nextStaff.s.nm});
  const openUp=UPG.map(u=>({u,lv:up(u.id)}))
    .filter(o=>o.lv<o.u.max&&SAVE.size>=(o.u.min||0))
    .sort((a,b)=>a.u.cost(a.lv)-b.u.cost(b.lv));
  openUp.slice(0,2).forEach((o,i)=>{
    plots.push({x:SH.x1-1.7,y:CNT.y-2.4-i*2.9,w:1.9,h:1.7,kind:'upg',ref:o.u.id,
      cost:o.u.cost(o.lv),fill:0,ic:o.u.ic,nm:o.u.nm,ds:o.u.ds});
  });
  if(SAVE.size+1<SIZES.length){
    const N=SIZES[SAVE.size+1];
    plots.push({x:0,y:SH.y0-2.0,w:3.6,h:2.3,kind:'expand',ref:SAVE.size+1,cost:N.cost,fill:0,ic:'🏗️',nm:'הרחבה'});
  }
}

/* ───── characters (site avatar system — smooth, rounded, your own character) ───── */
const AV=window.AGAv;
function myCode(){return (AV&&AV.mine&&AV.mine())||'00000000'}
function randCode(){
  if(!AV)return '00000000';
  const o={};AV.CATS.forEach(c=>{o[c.id]=(Math.random()*c.o.length)|0});
  o.bg=0;o.hold=0;
  return AV.enc(o);
}
function drawChar(code,px,py,size,t){
  shadowEllipse(px,py+size*.44,size*.32,size*.12);
  if(!AV){X.fillStyle='#ff6b8b';X.beginPath();X.arc(px,py,size*.34,0,TAU);X.fill();return}
  AV.draw(X,code,px,py,size,{bg:false,t:t||0});
}

/* ───── player ───── */
const P={x:0,y:2,vx:0,vy:0,t:0,code:'00000000'};
const SPD=4.7;
function movePlayer(dt){
  let fx=(key.KeyD||key.ArrowRight?1:0)-(key.KeyA||key.ArrowLeft?1:0);
  let fy=(key.KeyS||key.ArrowDown?1:0)-(key.KeyW||key.ArrowUp?1:0);
  if(touchDev){fx+=joyX;fy+=joyY}
  const l=Math.hypot(fx,fy);if(l>1){fx/=l;fy/=l}
  P.vx+=(fx*SPD-P.vx)*Math.min(1,dt*14);
  P.vy+=(fy*SPD-P.vy)*Math.min(1,dt*14);
  let nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
  const m=.55;
  nx=clamp(nx,SH.x0+m,SH.x1-m);
  /* a gap at the top wall leads out to the expansion plot */
  if(Math.abs(nx)<2.0)ny=clamp(ny,SH.y0-3.1,SH.y1-m);
  else ny=clamp(ny,SH.y0+m,SH.y1-m);
  /* the counter blocks, except at the left-hand gap */
  /* the counter blocks, but there is a way round at each end */
  const openL=nx<CNT.x0+1.9, openR=nx>CNT.x1-1.2;
  if(!openL&&!openR){
    if(P.y<CNT.y&&ny>CNT.y-.45)ny=CNT.y-.45;
    if(P.y>CNT.y&&ny<CNT.y+.45)ny=CNT.y+.45;
  }
  for(const mc of machines){
    if(Math.abs(nx-mc.x)<1.05&&Math.abs(ny-mc.y)<.9){
      if(Math.abs(P.x-mc.x)>=1.05)nx=P.x;else ny=P.y;
    }
  }
  for(const sv of shelves){
    if(Math.abs(nx-sv.x)<1.15&&Math.abs(ny-sv.y)<.75){
      if(Math.abs(P.x-sv.x)>=1.15)nx=P.x;else ny=P.y;
    }
  }
  P.x=nx;P.y=ny;
  P.t+=dt*(1+Math.hypot(P.vx,P.vy)*.5);
}

/* ───── build plots: stand inside and the money pours in ───── */
function stepPlots(dt){
  for(let i=plots.length-1;i>=0;i--){
    const p=plots[i];
    const inside=Math.abs(P.x-p.x)<p.w/2+.3&&Math.abs(P.y-p.y)<p.h/2+.3;
    p.near=inside;
    if(p.kind==='stock'){
      const g=COIN[p.ref];
      if(inside&&money>=g.buy&&inv[p.ref]<g.cap){
        p.fill+=dt*g.buy*1.6;
        if(p.fill>=g.buy){
          p.fill=0;money-=g.buy;inv[p.ref]++;setMoney();setInv();
          floats.push({x:p.x,y:p.y-.5,vy:-1.6,life:.9,txt:g.ic+' +1'});
          tone(620,.06,'sine',.04);
        }
      }else if(!inside)p.fill=0;
      continue;
    }
    if(inside&&money>0&&p.fill<p.cost){
      const rate=Math.max(p.cost/2.8,240);
      const step=Math.min(rate*dt,p.cost-p.fill,money);
      if(step>0){
        p.fill+=step;money-=step;setMoney();
        if(Math.random()<dt*14)floats.push({x:p.x+(Math.random()-.5)*p.w,y:p.y,vy:-1.6,life:.7,txt:'💵'});
        if(Math.random()<dt*10)tone(500+Math.random()*300,.04,'sine',.028);
      }
      if(p.fill>=p.cost-.5){finishPlot(p);plots.splice(i,1)}
    }else if(!inside&&p.fill>0){
      money+=p.fill;p.fill=0;setMoney();      /* walking away refunds, nothing is lost */
    }
  }
}
function finishPlot(p){
  chord([680,900,1180,1500],.22);
  if(p.kind==='machine'){SAVE.own.push(p.ref);banner(p.ic+' '+p.nm+' נבנתה!',2.4)}
  else if(p.kind==='staff'){SAVE.staff[p.ref]=stf(p.ref)+1;banner(p.ic+' '+p.nm+' הצטרף לצוות!',2.4)}
  else if(p.kind==='upg'){SAVE.up[p.ref]=up(p.ref)+1;banner(p.ic+' '+p.nm+' שודרג!',2.2)}
  else if(p.kind==='expand'){SAVE.size=p.ref;banner('🏗️ החנות הורחבה!',2.6)}
  SAVE.money=money;saveNow();
  layout();buildStaff();setInv();
}

/* ───── customers ───── */
let people=[],spawnCd=2.4;
function queueSpot(i){return{x:DOORX,y:CNT.y+1.25+i*1.75}}
function pickWant(){
  /* only ask for goods the shop can actually supply; cheap things stay commonest */
  const pool=[];
  for(let k=0;k<COIN.length;k++){
    if(!goodOpen(k))continue;
    const wgt=[10,6,4,4,3,2][k]||2;
    for(let i=0;i<wgt;i++)pool.push(k);
  }
  const k=pool.length?pool[(Math.random()*pool.length)|0]:0;
  const g=COIN[k];
  const want=g.src==='buy'?(k>=5?1:1+((Math.random()*2)|0))
           :(k===2?1:k===1?(1+((Math.random()*2)|0)):(1+((Math.random()*3)|0)));
  return{k,want};
}
function spawnCustomer(){
  const w=pickWant();
  people.push({code:randCode(),x:DOORX+(Math.random()*1.6-.8),y:SH.y1+1.4,
    k:w.k,want:w.want,st:'queue',seat:null,pat:1,patMax:14+up('seats')*7+up('plant')*3+stf('cleaner')*6,
    t:Math.random()*9,slot:0,play:0,corner:0});
}
function stepPeople(dt){
  if(state!=='play'&&state!=='mini')return;
  spawnCd-=dt*(1+up('neon')*.3+SAVE.size*.22);
  if(spawnCd<=0&&people.length<3+SAVE.size*2){spawnCd=3.4+Math.random()*2.8;spawnCustomer()}
  let qi=0;
  /* forward order so the person who arrived first stands at the front */
  for(let i=0;i<people.length;i++){
    const c=people[i];c.t+=dt;
    let tx,ty;
    if(c.st==='queue'){
      c.slot=qi;qi++;
      /* whoever is not at the front takes a free bench if the shop has one */
      let seat=null;
      if(c.slot>0&&benches.length){
        const bi=(c.slot-1)%benches.length;
        if(!people.some(o=>o!==c&&o.seat===bi))seat=bi;
      }
      c.seat=seat;
      if(seat!==null){tx=benches[seat].x;ty=benches[seat].y-.5}
      else{const s2=queueSpot(c.slot);tx=s2.x;ty=s2.y}
      const atSpot=Math.hypot(c.x-tx,c.y-ty)<.55;
      if(atSpot&&c.slot===0){
        c.pat-=dt/c.patMax;
        if(c.pat<=0){c.st='leave';rep=Math.max(0,rep-(stf('cleaner')||up('plant')?2:4));lost++;setRep();
          banner('😠 לקוח עזב בלי לקנות',1.4);tone(180,.25,'square',.06)}
      }else if(atSpot&&seat!==null)c.pat=Math.min(1,c.pat+dt*.06);   /* נח על הספסל */
    }else if(c.st==='play'){
      const m=corner[c.corner]||corner[0];
      tx=m.x;ty=m.y+1.0;
      if(Math.hypot(c.x-tx,c.y-ty)<.5){
        c.play-=dt;
        if(c.play<=0){
          const tip=Math.round((12+Math.random()*18)*(1+SAVE.size*.3)*(1+up('till')*.22));
          money+=tip;dayEarn+=tip;setMoney();
          floats.push({x:c.x,y:c.y-1,vy:-1.6,life:1.1,txt:'+'+tip+' 💵',col:'#2f9e4a'});
          tone(880,.07,'sine',.05);setTimeout(()=>tone(1180,.09,'sine',.045),70);
          c.st='leave';
        }
      }
    }else{tx=DOORX;ty=SH.y1+2.8}
    const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
    if(d>.07){const s=Math.min(2.6*dt,d);c.x+=dx/d*s;c.y+=dy/d*s}
  }
  people=people.filter(c=>!(c.st==='leave'&&c.y>SH.y1+2.6));
  stepStaff(dt);
}
function headCustomer(){
  const q=queueSpot(0);
  for(const c of people)if(c.st==='queue'&&c.slot===0&&Math.hypot(c.x-q.x,c.y-q.y)<.9)return c;
  return null;
}
function serve(c,byStaff){
  if(inv[c.k]<c.want){
    if(!byStaff){banner('אין מספיק '+COIN[c.k].ic+' — לכו לשחק!',1.8);tone(170,.2,'square',.06)}
    return false;
  }
  inv[c.k]-=c.want;setInv();
  const pay=payFor(c.k,c.want);
  money+=pay;dayEarn+=pay;served++;setMoney();
  rep=Math.min(100,rep+1.4);setRep();
  floats.push({x:c.x,y:c.y-1.1,vy:-1.7,life:1.2,txt:'+'+pay+' 💵',col:'#2f9e4a'});
  chord([780,980,1240],.14);
  const free=corner.map((m,i)=>i).filter(i=>!people.some(p=>p.st==='play'&&p.corner===i));
  if(free.length&&Math.random()<.55){c.st='play';c.corner=free[(Math.random()*free.length)|0];c.play=5+Math.random()*5}
  else c.st='leave';
  return true;
}
/* ───── staff ───── */
let staffNPC=[],staffT={cashier:0,gamer:0};
function buildStaff(){
  staffNPC=[];
  const add=(kind,x,y)=>staffNPC.push({kind,code:randCode(),x,y,bx:x,by:y,t:Math.random()*9});
  for(let i=0;i<stf('cashier');i++)add('cashier',DOORX-1.4+i*1.3,CNT.y-1.2);
  for(let i=0;i<stf('gamer');i++){const m=machines[i%Math.max(1,machines.length)];add('gamer',m?m.x:0,m?m.y+1.4:0)}
  for(let i=0;i<stf('cleaner');i++)add('cleaner',SH.x0+3.5+i*2,SH.y1-4.5);
}
function stepStaff(dt){
  for(const s of staffNPC){
    s.t+=dt;
    if(s.kind==='cleaner'){s.x=s.bx+Math.sin(s.t*.42)*2.2;s.y=s.by+Math.cos(s.t*.31)*1.6}
  }
  if(stf('cashier')){
    staffT.cashier-=dt;
    if(staffT.cashier<=0){staffT.cashier=Math.max(3.2,8-stf('cashier')*1.6);
      const c=headCustomer();if(c)serve(c,true)}
  }
  if(stf('gamer')){
    staffT.gamer-=dt;
    if(staffT.gamer<=0){staffT.gamer=Math.max(5,11-stf('gamer')*2);
      const k=(maxTier()>=1&&Math.random()<.22)?1:0,n=k===1?1:2+((Math.random()*3)|0);
      inv[k]+=n;setInv();
      banner('🎮 השחקן השכיר הביא '+COIN[k].ic+'×'+n,1.2);tone(700,.06,'sine',.04)}
  }
}

/* ═══════ rendering ═══════ */
function draw(){
  X.setTransform(DPR,0,0,DPR,0,0);
  X.fillStyle='#efe0bd';X.fillRect(0,0,VW,VH);
  /* soft sand blobs outside */
  X.save();X.globalAlpha=.45;X.fillStyle='#e5d2a4';
  for(let i=0;i<9;i++){
    const bx=sx(-17+((i*37)%34)),by=sy(-14+((i*23)%30));
    X.beginPath();X.ellipse(bx,by,ZOOM*2.4,ZOOM*1.4,0,0,TAU);X.fill();
  }
  X.restore();
  const fx=sx(SH.x0),fy=sy(SH.y0),fw=(SH.x1-SH.x0)*ZOOM,fh=(SH.y1-SH.y0)*ZOOM;
  X.save();
  X.fillStyle='rgba(58,45,30,.2)';rr(fx,fy+11,fw,fh,30);X.fill();
  X.fillStyle='#fff3da';rr(fx,fy,fw,fh,28);X.fill();
  X.save();rr(fx,fy,fw,fh,28);X.clip();
  X.globalAlpha=.55;X.fillStyle='#f7e9cc';
  for(let gy=Math.floor(SH.y0);gy<SH.y1;gy++)for(let gx=Math.floor(SH.x0);gx<SH.x1;gx++)
    if((gx+gy)&1){rr(sx(gx)+3,sy(gy)+3,ZOOM-6,ZOOM-6,11);X.fill()}
  X.globalAlpha=1;
  X.fillStyle='#ffd9e2';rr(sx(DOORX-1.7),sy(SH.y1-2.4),3.4*ZOOM,2.4*ZOOM,20);X.fill();
  const cx0=sx(CNT.x0+1.9),cw=(CNT.x1-1.2-(CNT.x0+1.9))*ZOOM,cy0=sy(CNT.y-.42),ch=.84*ZOOM;
  X.fillStyle='rgba(58,45,30,.18)';rr(cx0,cy0+8,cw,ch,16);X.fill();
  X.fillStyle='#d98b4a';rr(cx0,cy0,cw,ch,16);X.fill();
  X.fillStyle='#f3b878';rr(cx0,cy0,cw,ch*.4,16);X.fill();
  X.restore();
  X.lineWidth=7;X.strokeStyle='#3a2d1e';rr(fx,fy,fw,fh,28);X.stroke();
  /* doorway + the gap to the expansion plot */
  X.lineWidth=10;X.strokeStyle='#fff3da';
  X.beginPath();X.moveTo(sx(DOORX-1.6),fy+fh);X.lineTo(sx(DOORX+1.6),fy+fh);X.stroke();
  if(plots.some(p=>p.kind==='expand')){X.beginPath();X.moveTo(sx(-1.9),fy);X.lineTo(sx(1.9),fy);X.stroke()}
  X.restore();

  for(const b of benches)drawBench(b.x,b.y);
  for(const pl of plants)drawPlant(pl.x,pl.y);
  for(const sv of shelves)drawShelf(sv.x,sv.y,sv.k);
  if(neon)drawNeon();
  for(const p of plots)drawPlot(p);
  for(const m of corner)drawCabinet(m.x,m.y,'#9b7bd4','🕹️',.85);
  for(const m of machines)drawCabinet(m.x,m.y,MACHINES[m.id].col,MACHINES[m.id].ic,m.vr?1.2:1);

  const all=[];
  for(const c of people)all.push({y:c.y,f:()=>drawCustomer(c)});
  for(const s of staffNPC)all.push({y:s.y,f:()=>{
    drawChar(s.code,sx(s.x),sy(s.y),ZOOM*1.2,s.t);
    label(sx(s.x),sy(s.y)-ZOOM*.95,STAFF.find(q=>q.id===s.kind).ic,'#fff8e2',null,12)}});
  all.push({y:P.y,f:()=>{
    drawChar(P.code,sx(P.x),sy(P.y),ZOOM*1.34,P.t);
    label(sx(P.x),sy(P.y)-ZOOM*1.05,'אתם','#ffd45e',null,12)}});
  all.sort((a,b)=>a.y-b.y).forEach(o=>o.f());

  for(const f of floats){
    X.save();X.globalAlpha=clamp(f.life,0,1);
    label(sx(f.x),sy(f.y),f.txt,'#fff',f.col||'#3a2d1e',14);
    X.restore();
  }
  if(nearAct)label(VW/2,VH-(touchDev?168:118),nearAct.txt+'   '+(touchDev?'✋':'F'),'#ffd45e',null,16);
}
function drawPlot(p){
  const px=sx(p.x),py=sy(p.y),w=p.w*ZOOM,h=p.h*ZOOM,prog=p.fill/p.cost;
  if(p.kind==='stock'){
    X.save();
    shadowEllipse(px,py+h*.42,w*.42,h*.13,.16);
    X.fillStyle='#c98a4b';rr(px-w/2,py-h/2,w,h,12);X.fill();
    X.lineWidth=4;X.strokeStyle='#3a2d1e';X.stroke();
    X.fillStyle='rgba(255,255,255,.3)';rr(px-w/2+5,py-h/2+5,w-10,h*.3,7);X.fill();
    X.fillStyle='#3a2d1e';X.font='900 '+Math.round(w*.34)+'px system-ui';
    X.textAlign='center';X.textBaseline='middle';X.fillText('📦',px,py+h*.06);
    if(p.fill>0){X.fillStyle='rgba(123,227,107,.5)';rr(px-w/2,py+h/2-h*(p.fill/COIN[p.ref].buy),w,h*(p.fill/COIN[p.ref].buy),10);X.fill()}
    X.restore();
    return;
  }
  X.save();
  X.fillStyle='rgba(255,255,255,.3)';rr(px-w/2,py-h/2,w,h,18);X.fill();
  X.setLineDash([12,9]);X.lineWidth=4;X.strokeStyle='rgba(58,45,30,.4)';
  rr(px-w/2,py-h/2,w,h,18);X.stroke();
  X.setLineDash([]);
  if(prog>0){X.fillStyle='rgba(123,227,107,.42)';rr(px-w/2,py+h/2-h*prog,w,h*prog,16);X.fill()}
  /* corner brackets */
  X.lineWidth=6;X.strokeStyle=p.near?'#2f9e4a':'#7be36b';X.lineCap='round';
  const c=Math.min(w,h)*.28;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([ax,ay])=>{
    const bx=px+ax*w/2,by=py+ay*h/2;
    X.beginPath();X.moveTo(bx-ax*c,by);X.lineTo(bx,by);X.lineTo(bx,by-ay*c);X.stroke();
  });
  X.restore();
  if(p.kind==='stock'){
    const g=COIN[p.ref],full=inv[p.ref]>=g.cap;
    label(px,py-h/2-20,full?(g.ic+' מלא'):(g.ic+' '+nf(g.buy)+' 💵'),full?'#cfe9cf':'#fff',null,14);
    label(px,py+h/2+17,inv[p.ref]+'/'+g.cap,'#fff',null,12);
    return;
  }
  const below=p.kind==='expand';
  label(px,py+(below?h/2+20:-h/2-20),p.ic+' '+nf(p.cost-p.fill)+' 💵','#fff',null,15);
  if(prog>0&&prog<1)label(px,py+(below?-h/2-18:h/2+18),Math.round(prog*100)+'%','#7be36b',null,13);
}
function drawBench(x,y){

  X.lineWidth=3.5;X.strokeStyle='#3a2d1e';X.stroke();
  X.fillStyle='#a8703f';rr(px-w/2,py-h*.72,w,h*.56,h*.3);X.fill();
  X.lineWidth=3.5;X.strokeStyle='#3a2d1e';X.stroke();
  X.restore();
}
function drawPlant(x,y){
  const px=sx(x),py=sy(y),r=.42*ZOOM;
  shadowEllipse(px,py+r*.9,r*.8,r*.3,.16);

function drawCabinet(x,y,col,ic,sc){
  sc=sc||1;
  const px=sx(x),py=sy(y),w=1.6*ZOOM*sc,h=2.35*ZOOM*sc;
  const top=py-h*.58, bot=py+h*.42;
  shadowEllipse(px,bot+h*.04,w*.52,h*.1,.2);
  X.save();
  /* cabinet body with a sloped marquee */
  X.fillStyle='#3a2d1e';rr(px-w/2,top,w,h,Math.min(16,w*.2));X.fill();
  X.fillStyle=col;rr(px-w/2+4,top+4,w-8,h-8,Math.min(13,w*.17));X.fill();
  /* marquee */
  X.fillStyle='rgba(255,255,255,.4)';rr(px-w*.4,top+w*.07,w*.8,h*.12,7);X.fill();
  /* screen */
  X.fillStyle='#241a30';rr(px-w*.36,top+h*.2,w*.72,h*.3,8);X.fill();
  X.fillStyle='rgba(255,255,255,.17)';rr(px-w*.32,top+h*.23,w*.64,h*.09,5);X.fill();
  /* control panel */
  X.fillStyle='rgba(0,0,0,.22)';rr(px-w*.42,top+h*.55,w*.84,h*.17,7);X.fill();
  X.fillStyle='#3a2d1e';X.beginPath();X.arc(px-w*.2,top+h*.635,w*.075,0,TAU);X.fill();
  X.fillStyle='#ff6b8b';X.beginPath();X.arc(px+w*.07,top+h*.635,w*.06,0,TAU);X.fill();
  X.fillStyle='#4fc3f7';X.beginPath();X.arc(px+w*.25,top+h*.635,w*.06,0,TAU);X.fill();
  /* base */
  X.fillStyle='rgba(0,0,0,.18)';rr(px-w*.46,bot-h*.14,w*.92,h*.14,6);X.fill();
  X.font='900 '+Math.round(w*.4)+'px system-ui';X.textAlign='center';X.textBaseline='middle';
  X.fillText(ic,px,top+h*.35);
  X.restore();
}
function drawCustomer(c){
  const px=sx(c.x),py=sy(c.y);
  drawChar(c.code,px,py,ZOOM*1.18,c.t);
  if(c.st==='leave')return;
  /* speech bubble sits up and to the side so it never covers the next in line */
  const bx=px+ZOOM*.60,by=py-ZOOM*1.12;
  if(c.st==='play'){label(bx,by,'🕹️','#fff',null,14);return}
  label(bx,by,COIN[c.k].ic+' '+c.want,'#fff',null,14);
  /* patience bar, tucked just under the bubble and above the head */
  const w=34,h=6,yy=by+17;
  X.save();
  X.fillStyle='rgba(58,45,30,.2)';rr(bx-w/2,yy,w,h,h/2);X.fill();
  X.fillStyle=c.pat<.35?'#e0483f':'#7be36b';rr(bx-w/2,yy,w*clamp(c.pat,0,1),h,h/2);X.fill();
  X.restore();
}

/* ═══════ mini-games ═══════ */
const MGCV=$('#mgcv'),MX=MGCV.getContext('2d');
let MG=null;
const GDEF={
 0:{nm:'גלים פרו',  ic:'🌊',hint:'הזיזו למעלה ולמטה — עברו בין העמודים',len:26},
 1:{nm:'מטווח',     ic:'🎯',hint:'פגעו בירוקים ברצף. אדום מוריד ניקוד', len:24},
 2:{nm:'שובר לבנים',ic:'🧱',hint:'הזיזו את המחבט — נפצו את הקיר',       len:28},
 3:{nm:'מסלול מהיר',ic:'🏁',hint:'חמקו מהתנועה. אספו את ה-⚡',          len:26},
 4:{nm:'VR',        ic:'🥽',hint:'טסים במנהרה — עברו בתוך הטבעות',      len:30}
};
function mgRR(x,y,w,h,r){MX.beginPath();if(MX.roundRect)MX.roundRect(x,y,w,h,r);else MX.rect(x,y,w,h)}
function openMG(id){
  state='mini';
  const G=GDEF[id];
  MG={id,t:G.len,score:0,combo:0,o:[],sp:0,py:210,pad:320,bx:320,by:300,bvx:200,bvy:-230,
      rows:[],carx:320,boost:0,vx:0,vy:0,roll:0};
  if(id===2)mgBricks();
  $('#mgName').textContent=G.ic+' '+G.nm;
  $('#mgHint').textContent=G.hint;
  $('#mg').classList.add('show');
  tone(660,.08,'sine',.05);
}
function mgBricks(){MG.rows=[];
  for(let r=0;r<5;r++)for(let i=0;i<10;i++)
    MG.rows.push({x:24+i*60,y:40+r*24,w:52,h:17,c:['#ff4fa3','#ffd05a','#5ce08a','#5ce0ff','#b98cff'][r]})}
function closeMG(){
  const mult=1+up('skill')*.25,m=MACHINES[MG.id];
  let coins=0,ultra=0,vr=0;
  if(m.tier>=2)vr=Math.max(1,Math.round(MG.score/9*mult));
  else{
    coins=Math.max(1,Math.round(MG.score*.45*mult));
    if(m.tier>=1)ultra=Math.max(1,Math.round(MG.score/26*mult));
    else if(MG.score>=40)ultra=1;
  }
  inv[0]+=coins;inv[1]+=ultra;inv[2]+=vr;setInv();
  $('#mg').classList.remove('show');state='play';
  banner(vr?('🥽 +'+vr):('🪙 +'+coins+(ultra?'   💠 +'+ultra:'')),2.2);
  chord([700,900,1150],.2);MG=null;
}
let mgPtr={x:320,y:210};
MGCV.addEventListener('pointerdown',e=>{mgAt(e);if(MG&&MG.id===1)mgShoot()});
MGCV.addEventListener('pointermove',e=>mgAt(e));
function mgAt(e){const r=MGCV.getBoundingClientRect();mgPtr.x=(e.clientX-r.left)/r.width*640;mgPtr.y=(e.clientY-r.top)/r.height*420}
function mgShoot(){
  for(let i=MG.o.length-1;i>=0;i--){
    const o=MG.o[i];
    if(Math.abs(o.x-mgPtr.x)<o.r+8&&Math.abs(o.y-mgPtr.y)<o.r+8){
      MG.o.splice(i,1);
      if(o.good){MG.combo++;MG.score+=2*Math.min(5,1+Math.floor(MG.combo/3));tone(700+Math.min(5,MG.combo)*90,.06,'sine',.05)}
      else{MG.combo=0;MG.score=Math.max(0,MG.score-3);tone(170,.14,'square',.05)}
      return;
    }
  }
  MG.combo=0;tone(200,.05,'square',.03);
}
function stepMG(dt){
  if(!MG)return;
  MG.t-=dt;
  $('#mgTime').textContent='⏱ '+Math.ceil(Math.max(0,MG.t));
  $('#mgScore').textContent='★ '+MG.score;
  $('#mgCombo').textContent=MG.id===1&&MG.combo>2?('🔥 ×'+Math.min(5,1+Math.floor(MG.combo/3))):'';
  MX.fillStyle='#120d18';MX.fillRect(0,0,640,420);
  MX.strokeStyle='rgba(255,255,255,.06)';MX.lineWidth=1;
  for(let x=0;x<640;x+=40){MX.beginPath();MX.moveTo(x,0);MX.lineTo(x,420);MX.stroke()}
  for(let y=0;y<420;y+=40){MX.beginPath();MX.moveTo(0,y);MX.lineTo(640,y);MX.stroke()}
  const ramp=1+(GDEF[MG.id].len-MG.t)/GDEF[MG.id].len*.9;

  if(MG.id===0){
    MG.py+=((mgPtr.y-MG.py))*Math.min(1,dt*10);MG.py=clamp(MG.py,14,406);
    MG.sp-=dt;
    if(MG.sp<=0){MG.sp=.9/ramp;MG.o.push({x:660,gy:60+Math.random()*300,gap:Math.max(74,104-ramp*14),scored:false})}
    for(let i=MG.o.length-1;i>=0;i--){
      const o=MG.o[i];o.x-=210*ramp*dt;
      if(o.x<-40){MG.o.splice(i,1);continue}
      MX.fillStyle='#3a2b6e';
      mgRR(o.x,-12,26,o.gy-o.gap/2+12,12);MX.fill();
      mgRR(o.x,o.gy+o.gap/2,26,432-(o.gy+o.gap/2),12);MX.fill();
      MX.fillStyle='#ff4fa3';
      mgRR(o.x-2,o.gy-o.gap/2-9,30,9,4);MX.fill();
      mgRR(o.x-2,o.gy+o.gap/2,30,9,4);MX.fill();
      if(!o.scored&&o.x<64){o.scored=true;
        if(Math.abs(MG.py-o.gy)<o.gap/2-8){MG.score+=3;tone(900,.05,'sine',.05)}
        else{MG.score=Math.max(0,MG.score-2);tone(170,.18,'square',.06)}}
    }
    MX.beginPath();MX.arc(76,MG.py,13,0,TAU);MX.fillStyle='#5ce0ff';MX.fill();
  }
  else if(MG.id===1){
    MG.sp-=dt;
    if(MG.sp<=0){MG.sp=.46/ramp;
      const lane=(Math.random()*4)|0,dir=Math.random()<.5?1:-1;
      MG.o.push({x:dir>0?-30:670,y:70+lane*88,r:21,v:(110+Math.random()*120)*ramp*dir,good:Math.random()>.24})}
    for(let l=0;l<4;l++){MX.fillStyle='rgba(255,255,255,.04)';mgRR(0,46+l*88,640,48,10);MX.fill()}
    for(let i=MG.o.length-1;i>=0;i--){
      const o=MG.o[i];o.x+=o.v*dt;
      if(o.x<-50||o.x>690){MG.o.splice(i,1);if(o.good)MG.combo=0;continue}
      MX.beginPath();MX.arc(o.x,o.y,o.r,0,TAU);MX.fillStyle=o.good?'#5ce08a':'#e05c6a';MX.fill();
      MX.beginPath();MX.arc(o.x,o.y,o.r*.55,0,TAU);MX.fillStyle='rgba(255,255,255,.82)';MX.fill();
      MX.beginPath();MX.arc(o.x,o.y,o.r*.22,0,TAU);MX.fillStyle=o.good?'#2a7a4a':'#7a2a33';MX.fill();
    }
    MX.strokeStyle='#ffd45e';MX.lineWidth=3;MX.lineCap='round';
    MX.beginPath();MX.arc(mgPtr.x,mgPtr.y,14,0,TAU);MX.stroke();
    MX.beginPath();
    MX.moveTo(mgPtr.x-21,mgPtr.y);MX.lineTo(mgPtr.x-7,mgPtr.y);
    MX.moveTo(mgPtr.x+7,mgPtr.y);MX.lineTo(mgPtr.x+21,mgPtr.y);
    MX.moveTo(mgPtr.x,mgPtr.y-21);MX.lineTo(mgPtr.x,mgPtr.y-7);
    MX.moveTo(mgPtr.x,mgPtr.y+7);MX.lineTo(mgPtr.x,mgPtr.y+21);MX.stroke();
  }
  else if(MG.id===2){
    MG.pad+=((mgPtr.x-MG.pad))*Math.min(1,dt*12);MG.pad=clamp(MG.pad,52,588);
    MG.bx+=MG.bvx*ramp*dt;MG.by+=MG.bvy*ramp*dt;
    if(MG.bx<10||MG.bx>630){MG.bvx*=-1;MG.bx=clamp(MG.bx,10,630);tone(520,.04,'square',.03)}
    if(MG.by<10){MG.bvy*=-1;MG.by=10;tone(560,.04,'square',.03)}
    if(MG.by>398){MG.by=300;MG.bx=MG.pad;MG.bvy=-230;MG.bvx=(Math.random()*2-1)*180;
      MG.score=Math.max(0,MG.score-3);tone(150,.2,'square',.06)}
    if(MG.by>372&&MG.by<392&&Math.abs(MG.bx-MG.pad)<54&&MG.bvy>0){
      MG.bvy=-Math.abs(MG.bvy);MG.bvx=(MG.bx-MG.pad)*4.4;tone(760,.05,'sine',.05)}
    for(let i=MG.rows.length-1;i>=0;i--){
      const b=MG.rows[i];
      if(MG.bx>b.x-6&&MG.bx<b.x+b.w+6&&MG.by>b.y-6&&MG.by<b.y+b.h+6){
        MG.rows.splice(i,1);MG.bvy*=-1;MG.score+=3;tone(820+Math.random()*200,.05,'sine',.05);break}
    }
    if(!MG.rows.length)mgBricks();
    for(const b of MG.rows){MX.fillStyle=b.c;mgRR(b.x,b.y,b.w,b.h,7);MX.fill()}
    MX.fillStyle='#b98cff';mgRR(MG.pad-52,378,104,14,7);MX.fill();
    MX.beginPath();MX.arc(MG.bx,MG.by,9,0,TAU);MX.fillStyle='#ffd45e';MX.fill();
  }
  else if(MG.id===3){
    MG.carx+=((mgPtr.x-MG.carx))*Math.min(1,dt*9);MG.carx=clamp(MG.carx,80,560);
    MG.sp-=dt;
    if(MG.sp<=0){MG.sp=.42/ramp;
      MG.o.push({x:80+((Math.random()*5)|0)*120,y:-50,v:(240+Math.random()*130)*ramp,pw:Math.random()<.16})}
    for(let l=0;l<5;l++){MX.fillStyle='rgba(255,255,255,.04)';mgRR(22+l*120,0,96,420,14);MX.fill()}
    for(let i=MG.o.length-1;i>=0;i--){
      const o=MG.o[i];o.y+=o.v*dt;
      if(o.y>470){MG.o.splice(i,1);if(!o.pw)MG.score+=1;continue}
      if(o.pw){MX.fillStyle='#ffd45e';MX.beginPath();MX.arc(o.x,o.y,15,0,TAU);MX.fill();
        MX.fillStyle='#120d18';MX.font='900 20px system-ui';MX.textAlign='center';MX.fillText('⚡',o.x,o.y+7)}
      else{MX.fillStyle='#e05c6a';mgRR(o.x-26,o.y-40,52,80,14);MX.fill();
        MX.fillStyle='#2a1420';mgRR(o.x-19,o.y-24,38,26,8);MX.fill()}
      if(Math.abs(o.x-MG.carx)<44&&Math.abs(o.y-350)<58){
        MG.o.splice(i,1);
        if(o.pw){MG.score+=6;tone(1000,.08,'sine',.055)}
        else{MG.score=Math.max(0,MG.score-5);tone(130,.25,'sawtooth',.07);MG.boost=.35}}
    }
    const sh=MG.boost>0?(Math.random()-.5)*8:0;MG.boost=Math.max(0,MG.boost-dt);
    MX.fillStyle='#5ce0ff';mgRR(MG.carx-24+sh,310,48,80,14);MX.fill();
    MX.fillStyle='#1b2a40';mgRR(MG.carx-18+sh,326,36,26,8);MX.fill();
  }
  else{  /* VR: a perspective tunnel — the "more 3D" experience */
    MG.vx+=((mgPtr.x-320)/320*1.7-MG.vx)*Math.min(1,dt*6);
    MG.vy+=((mgPtr.y-210)/210*1.2-MG.vy)*Math.min(1,dt*6);
    MG.roll+=dt*.35;
    MG.sp-=dt;
    if(MG.sp<=0){MG.sp=.78/ramp;MG.o.push({z:1,ox:(Math.random()*2-1)*1.4,oy:(Math.random()*2-1)*.95,hit:false})}
    for(let i=0;i<13;i++){
      const z=((i/13)+(MG.roll%(1/13)))%1,s=1/(z*3.4+.18);
      MX.strokeStyle='rgba(166,123,255,'+(.04+(1-z)*.15).toFixed(3)+')';MX.lineWidth=2;
      MX.beginPath();MX.ellipse(320-MG.vx*58*s,210-MG.vy*58*s,152*s,106*s,0,0,TAU);MX.stroke();
    }
    MG.o.sort((a,b)=>b.z-a.z);
    for(let i=MG.o.length-1;i>=0;i--){
      const o=MG.o[i];o.z-=dt*.4*ramp;
      if(o.z<=.05){MG.o.splice(i,1);continue}
      const s=1/(o.z*3.4+.18);
      const rx=(o.ox-MG.vx)*58*s,ry=(o.oy-MG.vy)*58*s;
      MX.lineWidth=Math.max(2,10*s);
      MX.strokeStyle=o.hit?'#5ce08a':'#58e0ff';
      MX.beginPath();MX.ellipse(320+rx,210+ry,72*s,72*s,0,0,TAU);MX.stroke();
      if(!o.hit&&o.z<.17){
        o.hit=true;
        if(Math.hypot(rx,ry)<72*s*.8){MG.score+=4;tone(1050,.07,'sine',.05)}
        else{MG.score=Math.max(0,MG.score-2);tone(150,.2,'square',.06)}
      }
    }
    MX.fillStyle='#fff';MX.beginPath();MX.arc(320,210,6,0,TAU);MX.fill();
    MX.strokeStyle='rgba(255,255,255,.5)';MX.lineWidth=2;
    MX.beginPath();MX.arc(320,210,18,0,TAU);MX.stroke();
  }
  if(MG.t<=0)closeMG();
}

/* ───── interaction ───── */
let nearAct=null;
function stepProx(){
  nearAct=null;
  if(state!=='play')return;
  const c=headCustomer();
  if(c&&Math.hypot(P.x-c.x,P.y-c.y)<3.4){
    nearAct={t:'serve',c,txt:'מכירה '+COIN[c.k].ic+'×'+c.want+' · '+payFor(c.k,c.want)+' 💵'+(inv[c.k]<c.want?'  (חסר!)':'')};
    return;
  }
  for(const m of machines){
    if(Math.hypot(P.x-m.x,P.y-(m.y+1.0))<1.6){nearAct={t:'mach',id:m.id,txt:GDEF[m.id].ic+' '+GDEF[m.id].nm};return}
  }
}
function act(){
  if(state!=='play'||!nearAct)return;
  if(nearAct.t==='serve')serve(nearAct.c);else openMG(nearAct.id);
}

/* ───── day loop ───── */
function startDay(){
  P.code=myCode();
  money=SAVE.money;setMoney();
  inv=[0,0,0];setInv();rep=100;setRep();
  dayT=0;dayEarn=0;served=0;lost=0;spawnCd=2.4;
  staffT={cashier:4,gamer:6};
  people=[];floats=[];
  layout();buildStaff();
  P.x=0;P.y=CNT.y-1.8;P.vx=P.vy=0;
  cam.x=P.x;cam.y=P.y;
  state='play';
  banner('🕹️ החנות פתוחה — יום '+SAVE.day,2.2);
  if(SAVE.day===1&&SAVE.own.length===1){
    setTimeout(()=>banner('🌊 לכו למכונה ושחקו — ככה משיגים מלאי',3.4),2500);
    setTimeout(()=>banner('💵 עמדו בתוך משבצת מקווקוות כדי לקנות',3.6),6300);
  }
}
function endDay(){
  state='end';
  SAVE.money=money;SAVE.best=Math.max(SAVE.best,dayEarn);saveNow();
  $('#deT').textContent='סוף יום '+SAVE.day;
  $('#deEarn').textContent='+'+nf(dayEarn)+' 💵';
  $('#deM').textContent='שירתם '+served+' לקוחות'+(lost?' · '+lost+' עזבו':'')+
    ' · '+SIZES[SAVE.size].nm+' · '+SAVE.own.length+' מכונות · בקופה '+nf(money)+' 💵';
  $('#dayEnd').classList.add('show');
  chord([660,880,1100],.3);
}
function tickClock(dt){
  if(state!=='play'&&state!=='mini')return;
  dayT+=dt;
  const left=Math.max(0,DAYLEN-dayT);
  $('#clock').textContent='🕒 יום '+SAVE.day+' · '+Math.ceil(left);
  $('#clock').classList.toggle('urgent',left<=25);
  if(left<=0){if(state==='mini'){$('#mg').classList.remove('show');MG=null}endDay()}
}

/* ───── input ───── */
const key={};
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(e.code==='KeyF'||e.code==='Space'){act();return}
  if(e.code==='Escape'&&state==='mini'){closeMG();return}
  key[e.code]=1;
});
addEventListener('keyup',e=>{key[e.code]=0});
addEventListener('blur',()=>{for(const k in key)key[k]=0});
const touchDev=matchMedia('(pointer:coarse)').matches;
if(touchDev)document.body.classList.add('touch');
let joyX=0,joyY=0,joyId=null,joyO=null;
(function(){
  const joy=$('#joy'),k=$('#jk');
  joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joyO={x:e.clientX,y:e.clientY};joy.setPointerCapture(e.pointerId)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId!==joyId||!joyO)return;
    const dx=e.clientX-joyO.x,dy=e.clientY-joyO.y,r=Math.min(36,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    joyX=Math.cos(a)*r/36;joyY=Math.sin(a)*r/36;
    k.style.left=(50+joyX*34)+'%';k.style.top=(50+joyY*34)+'%'});
  const rst=()=>{joyX=joyY=0;joyId=null;joyO=null;k.style.left=k.style.top='50%'};
  joy.addEventListener('pointerup',rst);joy.addEventListener('pointercancel',rst);
  $('#act').addEventListener('pointerdown',e=>{e.preventDefault();act()});
  cv.addEventListener('pointerdown',()=>{ac();if(state==='play')act()});
})();

/* ───── main loop ───── */
let last=performance.now(),fpsT=0,fpsN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  if(state==='mini'){stepMG(dt);stepPeople(dt);tickClock(dt);fpsN++;return}
  if(state==='play'){
    movePlayer(dt);stepPlots(dt);stepPeople(dt);stepProx();tickClock(dt);
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i];f.y+=f.vy*dt;f.life-=dt;
      if(f.life<=0)floats.splice(i,1);
    }
    cam.x+=(P.x-cam.x)*Math.min(1,dt*6);
    cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
  }
  draw();
  fpsN++;fpsT+=dt;if(fpsT>.5){$('#fps').textContent=Math.round(fpsN/fpsT)+' fps';fpsN=0;fpsT=0}
}

/* ───── menu ───── */
function refreshMenu(){
  $('#mMoney').textContent=nf(SAVE.money);
  $('#mDay').textContent=SAVE.day;
  $('#mRank').textContent=SIZES[SAVE.size].nm;
}
$('#startBtn').onclick=()=>{ac();$('#menu').classList.remove('show');startDay()};
$('#resetBtn').onclick=()=>{if(confirm('להתחיל הכל מחדש?')){SAVE={money:0,day:1,up:{},own:[0],staff:{},size:0,best:0};saveNow();refreshMenu();layout()}};
$('#nextDay').onclick=()=>{$('#dayEnd').classList.remove('show');SAVE.day++;saveNow();refreshMenu();startDay()};
$('#deMenu').onclick=()=>{$('#dayEnd').classList.remove('show');state='menu';refreshMenu();$('#menu').classList.add('show')};
addEventListener('ag-avatar',()=>{P.code=myCode()});

resize();layout();refreshMenu();P.code=myCode();P.y=CNT.y-1.8;
requestAnimationFrame(frame);
</script>
