<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta name="robots" content="noai, noimageai">
<meta name="author" content="Alon Maidenberg - אלון מידנברג">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מגנטיקה – אלון מידנברג</title>
<meta name="description" content="שלטו במגנט ומשכו את הכדור למטרה!">
<meta name="theme-color" content="#0a0a1a">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;overflow:hidden;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;width:100% !important;height:100% !important;max-width:100vw;max-height:100vh;object-fit:contain}
#ui{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:none;z-index:10}
#ui span{color:#fff;font:bold 18px/1 Arial;text-shadow:0 0 8px #0af}
#hint{position:fixed;bottom:18px;width:100%;text-align:center;color:#ffffff88;font:14px Arial;pointer-events:none}
</style>
</head>
<body>
<script src="../hub.js"></script>
<div id="ui">
  <span id="lvlTxt">רמה 1</span>
  <span id="scTxt">0</span>
</div>
<canvas id="cv"></canvas>
<div id="hint">לחצו/געו למשוך את הכדור למטרה ⭕</div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=800,H=450;
function resize(){cv.width=W;cv.height=H;const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',resize);resize();

// --- game state ---
let lvl=1,sc=0,lives=3,phase='play'; // phase: play|win|lose|dead
let ball,magnet,target,walls,portals,msgT=0,msg='';
let mx=-999,my=-999,mdown=false;
let animT=0;

const G=0.06; // very light gravity — space-like
const MAG_FORCE=1.1;
const FRICTION=0.978;

function $i(id){return document.getElementById(id)}

// --- levels ---
function makeLevel(n){
  animT=0;
  const cx=W/2,cy=H/2;
  ball={x:80,y:80,vx:0,vy:0,r:14,trail:[]};
  target={x:W-80,y:H-80,r:28,pulse:0};
  walls=[];
  portals=[];

  if(n>=2){// wall in middle
    walls.push({x:cx-8,y:120,w:16,h:210});
  }
  if(n>=3){// two walls
    walls.push({x:cx-8,y:120,w:16,h:210});
    walls.push({x:200,y:cy-8,w:160,h:16});
  }
  if(n>=4){// portal
    walls=[];
    walls.push({x:cx-8,y:80,w:16,h:290});
    portals=[
      {x:120,y:H-70,r:20,pair:1,col:'#f0f'},
      {x:W-120,y:70,r:20,pair:1,col:'#f0f'}
    ];
  }
  if(n>=5){
    walls=[];
    walls.push({x:cx-8,y:80,w:16,h:290});
    walls.push({x:200,y:cy-8,w:400,h:16});
    portals=[
      {x:80,y:H-70,r:20,pair:1,col:'#f0f'},
      {x:W-80,y:70,r:20,pair:1,col:'#f0f'}
    ];
    ball={x:cx+100,y:cy+100,vx:0,vy:0,r:14,trail:[]};
  }
  if(n>=6){
    walls=[];
    // maze-like
    walls.push({x:150,y:60,w:16,h:200});
    walls.push({x:300,y:190,w:16,h:200});
    walls.push({x:450,y:60,w:16,h:200});
    walls.push({x:600,y:190,w:16,h:200});
    ball={x:60,y:cy,vx:0,vy:0,r:14,trail:[]};
    target={x:W-60,y:cy,r:28,pulse:0};
    portals=[];
  }

  phase='play';
  $i('lvlTxt').textContent='רמה '+n;
}

// --- physics ---
function upd(){
  if(phase!=='play'){msgT--;return}
  animT++;
  const b=ball;

  // gravity
  b.vy+=G;

  // magnet force
  if(mdown){
    const dx=mx-b.x,dy=my-b.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const force=MAG_FORCE*Math.min(1,120/dist);
    b.vx+=dx/dist*force;
    b.vy+=dy/dist*force;
  }

  // friction
  b.vx*=FRICTION;
  b.vy*=FRICTION;

  // cap speed
  const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(spd>18){b.vx=b.vx/spd*18;b.vy=b.vy/spd*18}

  // move
  b.x+=b.vx;b.y+=b.vy;

  // trail
  b.trail.push({x:b.x,y:b.y});
  if(b.trail.length>18)b.trail.shift();

  // wall collisions
  for(const w of walls){
    if(b.x+b.r>w.x&&b.x-b.r<w.x+w.w&&b.y+b.r>w.y&&b.y-b.r<w.y+w.h){
      // push out
      const ox=Math.min(b.x+b.r-w.x,w.x+w.w-(b.x-b.r));
      const oy=Math.min(b.y+b.r-w.y,w.y+w.h-(b.y-b.r));
      if(ox<oy){b.x+=b.x<w.x+w.w/2?-ox:ox;b.vx*=-.5}
      else{b.y+=b.y<w.y+w.h/2?-oy:oy;b.vy*=-.5}
    }
  }

  // portals
  for(const p of portals){
    const dx=b.x-p.x,dy=b.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<p.r+b.r&&!b.porting){
      const other=portals.find(q=>q.pair===p.pair&&q!==p);
      if(other){b.x=other.x;b.y=other.y;b.porting=true;setTimeout(()=>b.porting=false,300)}
    }
  }

  // boundary bounce
  if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.7}
  if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.7}
  if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)*.7}
  if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.6}
  if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)*.6}

  // target
  target.pulse=(target.pulse+0.07)%Math.PI;
  const tdx=b.x-target.x,tdy=b.y-target.y;
  if(Math.sqrt(tdx*tdx+tdy*tdy)<target.r+b.r-6){
    phase='win';msg='כניסה! 🎯';msgT=90;
    sc+=Math.max(10,100-lvl*5);
    $i('scTxt').textContent=sc;
    if(window.AG)AG.add(Math.max(5,20-lvl),0);
  }
}

// --- draw ---
function drw(){
  // bg
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0a1a');bg.addColorStop(1,'#0d1a2a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // grid
  ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // walls
  for(const w of walls){
    const g=ctx.createLinearGradient(w.x,w.y,w.x+w.w,w.y+w.h);
    g.addColorStop(0,'#334');g.addColorStop(1,'#223');
    ctx.fillStyle=g;ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeStyle='#55f8';ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h);
  }

  // portals
  for(const p of portals){
    ctx.save();ctx.shadowBlur=20;ctx.shadowColor=p.col;
    ctx.strokeStyle=p.col;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    // inner swirl
    ctx.globalAlpha=0.4+Math.sin(animT*.1)*.2;
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // target
  const tr=target.r+Math.sin(target.pulse)*4;
  ctx.save();
  ctx.shadowBlur=30;ctx.shadowColor='#0f8';
  ctx.strokeStyle='#0f8';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(target.x,target.y,tr,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#0f88';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(target.x,target.y,tr*0.6,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#0f822';ctx.beginPath();ctx.arc(target.x,target.y,tr*0.3,0,Math.PI*2);ctx.fill();
  // arrow pointing to target
  if(phase==='play'){
    const dx=target.x-ball.x,dy=target.y-ball.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>80){
      const ax=ball.x+dx/d*50,ay=ball.y+dy/d*50;
      ctx.globalAlpha=0.3+Math.sin(animT*.08)*.15;
      ctx.strokeStyle='#0f8';ctx.lineWidth=2;
      ctx.setLineDash([6,6]);ctx.beginPath();
      ctx.moveTo(ball.x+dx/d*22,ball.y+dy/d*22);ctx.lineTo(ax,ay);ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  ctx.restore();

  // ball trail
  const b=ball;
  for(let i=0;i<b.trail.length;i++){
    const t=b.trail[i],a=i/b.trail.length;
    ctx.globalAlpha=a*.35;
    ctx.fillStyle='#4af';
    ctx.beginPath();ctx.arc(t.x,t.y,b.r*(0.3+a*.5),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  ctx.save();
  ctx.shadowBlur=24;ctx.shadowColor='#4af';
  const bg2=ctx.createRadialGradient(b.x-4,b.y-4,2,b.x,b.y,b.r);
  bg2.addColorStop(0,'#aef');bg2.addColorStop(0.5,'#4af');bg2.addColorStop(1,'#026');
  ctx.fillStyle=bg2;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // magnet cursor
  if(mdown){
    ctx.save();
    ctx.shadowBlur=30;ctx.shadowColor='#f80';
    ctx.strokeStyle='#f80';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(mx,my,22,0,Math.PI*2);ctx.stroke();
    // force line
    const dx=b.x-mx,dy=b.y-my,d=Math.sqrt(dx*dx+dy*dy)||1;
    ctx.globalAlpha=Math.min(0.6,80/d);
    ctx.strokeStyle='#f804';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    // U-shape magnet icon
    ctx.save();ctx.font='20px Arial';ctx.textAlign='center';ctx.fillStyle='#f80';
    ctx.fillText('🧲',mx,my-28);ctx.restore();
  }

  // lives
  for(let i=0;i<lives;i++){
    ctx.font='18px Arial';ctx.fillText('❤️',16+i*26,H-14);
  }

  // messages
  if(msgT>0){
    ctx.save();
    ctx.globalAlpha=Math.min(1,msgT/20);
    ctx.font='bold 42px Arial';ctx.textAlign='center';
    ctx.shadowBlur=20;ctx.shadowColor=phase==='win'?'#0f8':'#f44';
    ctx.fillStyle=phase==='win'?'#0f8':'#f88';
    ctx.fillText(msg,W/2,H/2-20);
    ctx.restore();
  }

  // hint fade
  if(animT<180){
    document.getElementById('hint').style.opacity=Math.max(0,1-animT/150);
  }
}

// --- input ---
function getPos(e){
  const r=cv.getBoundingClientRect();
  const s=W/r.width;
  if(e.touches){return{x:(e.touches[0].clientX-r.left)*s,y:(e.touches[0].clientY-r.top)*s}}
  return{x:(e.clientX-r.left)*s,y:(e.clientY-r.top)*s}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();mdown=true;const p=getPos(e);mx=p.x;my=p.y});
cv.addEventListener('pointermove',e=>{if(!mdown)return;const p=getPos(e);mx=p.x;my=p.y});
cv.addEventListener('pointerup',e=>{mdown=false});
cv.addEventListener('pointercancel',e=>{mdown=false});

// --- loop ---
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-last<14)return;last=ts;
  upd();drw();
  // transitions
  if(phase==='win'&&msgT===0){lvl++;makeLevel(lvl)}
  if(phase==='dead'&&msgT===0){makeLevel(lvl)}
  if(phase==='lose'&&msgT<0){
    // game over screen
    ctx.save();ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
    ctx.font='bold 48px Arial';ctx.textAlign='center';ctx.fillStyle='#f44';
    ctx.shadowBlur=20;ctx.shadowColor='#f44';
    ctx.fillText('משחק נגמר',W/2,H/2-40);
    ctx.font='28px Arial';ctx.fillStyle='#fff';ctx.shadowBlur=0;
    ctx.fillText('ניקוד: '+sc,W/2,H/2+10);
    ctx.font='22px Arial';ctx.fillStyle='#aaa';
    ctx.fillText('לחצו להתחיל מחדש',W/2,H/2+55);
    ctx.restore();
    cv.onclick=()=>{cv.onclick=null;sc=0;lvl=1;lives=3;$i('scTxt').textContent=0;makeLevel(1)};
  }
}

makeLevel(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
