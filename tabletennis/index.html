<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🏓</div><h2>פינג-פונג</h2><div class="lb" id="howto">🖱️ המחבט דבוק לעכבר – פשוט מזיזים אותו אל הכדור, בלי ללחוץ.<br>מזיזים מהר = מכה חזקה 💥<br>הראשון ל-7 מנצח.</div><button class="btn" id="go">▶ שחק</button><button class="btn alt" id="friendBtn" style="margin-top:8px">👥 שחק עם חבר</button><div id="friendHint" style="display:none;text-align:right;font-size:14px;line-height:1.6;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;margin-top:8px"></div><button class="btn alt" id="shopBtn" style="margin-top:8px">🛍️ מחבטים</button><button class="btn alt" id="settBtn" style="margin-top:8px;display:none">⚙️ הגדרות</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>

  </div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const EN=window.AG_LANG==='en',tt=(he,en)=>EN?en:he;
// The canvas fills the WHOLE window. The 800x450 game sits centred in it and the space
// around it is part of the game too, so the paddle can go anywhere on the screen.
const VB={x0:0,y0:0,x1:W,y1:H}; // visible area in game units
function resize(){const iw=innerWidth,ih=innerHeight,s=Math.min(iw/W,ih/H),d=Math.min(devicePixelRatio||1,2),ox=(iw-W*s)/2,oy=(ih-H*s)/2;
  cv.style.width=iw+'px';cv.style.height=ih+'px';cv.width=Math.round(iw*d);cv.height=Math.round(ih*d);ctx.setTransform(s*d,0,0,s*d,ox*d,oy*d);
  VB.x0=-ox/s;VB.y0=-oy/s;VB.x1=W+ox/s;VB.y1=H+oy/s}
addEventListener('resize',resize);resize();
function cpos(e){const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);return{x:(e.clientX-r.left-(r.width-W*s)/2)/s,y:(e.clientY-r.top-(r.height-H*s)/2)/s}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='tabletennis'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;

// settings & trolls
let ballSpeedMult=1.0; // player's ball speed multiplier (from settings)
let cpuSpeedMult=1.0;  // CPU speed multiplier (troll target — not the player)
let diffMult=1.0;      // difficulty: scales CPU base speed permanently
let trollTimer=0;      // frames left for troll effect on cpu

// settings panel — always visible
$('#settBtn').style.display='';
$('#settBtn').onclick=()=>$('#settM').classList.add('show');
$('#settClose').onclick=()=>$('#settM').classList.remove('show');
document.querySelectorAll('#settM .chip[data-sp]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#settM .chip[data-sp]').forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    ballSpeedMult=parseFloat(b.dataset.sp);
  }
});
document.querySelectorAll('#settM .chip[data-diff]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#settM .chip[data-diff]').forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    diffMult=parseFloat(b.dataset.diff);
  }
});
$('#trFast').onclick=()=>{
  cpuSpeedMult=2.2;trollTimer=420;
  $('#trollMsg').textContent='😈 היריב קיבל טורבו! הוא יהיה מהיר מדי לעצמו…';
  setTimeout(()=>{if(trollTimer<=0)$('#trollMsg').textContent=''},500);
};
$('#trSlow').onclick=()=>{
  cpuSpeedMult=0.3;trollTimer=420;
  $('#trollMsg').textContent='😂 היריב קופא! הוא זז לאט…';
  setTimeout(()=>{if(trollTimer<=0)$('#trollMsg').textContent=''},500);
};

function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let hits=[],on=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function B(x,y,w,h,col,txt,fn,fs=22,tc='#fff'){if(window.R2){ctx.save();R2.shadow(ctx,Math.max(5,h*.22),'rgba(0,0,0,.33)',0,Math.max(2,h*.09));const _g=ctx.createLinearGradient(x,y,x,y+h);_g.addColorStop(0,R2.lighten(col,.28));_g.addColorStop(.52,col);_g.addColorStop(1,R2.darken(col,.26));ctx.fillStyle=_g;rr(x,y,w,h,12);ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=.38;ctx.strokeStyle=R2.lighten(col,.65);ctx.lineWidth=1.5;rr(x+1,y+1,w-2,Math.max(4,h*.52),11);ctx.stroke();ctx.restore()}else{ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill()}if(txt!=null){ctx.fillStyle=tc;ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+w/2,y+h/2+1)}if(fn)hits.push({x,y,w,h,fn})}
function T(t,x,y,fs=22,c='#fff',al='center'){ctx.fillStyle=c;ctx.font='bold '+fs+'px system-ui';ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);break}}});
function run(upd,drw,bg){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(on)upd()}hits=[];ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=bg||'#111';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();if(on||window.__show)drw()}requestAnimationFrame(l)}
function wire(start){$('#go').onclick=()=>{$('#menu').classList.remove('show');start();on=true};$('#again').onclick=()=>{$('#end').classList.remove('show');start();on=true};$('#menu2').onclick=()=>{on=false;$('#end').classList.remove('show');$('#menu').classList.add('show')}}
function over(title,score,msg,coins,dia,delay=600){on=false;window.__show=true;saveBest(score);setTimeout(()=>endGame(title,score,msg,coins,dia),delay)}

const G=.0022;
let px=0,pvx=0,cx=0,ps=0,as=0,lvl=0,sc=0,ball=null,L=-1,bnc=[0,0],phase='serve',pt=0,srv=0,swing=0,cswing=0,msg='',mt=0,trail=[],tpx=0,msgBig=false;
let smashCd=0,smashFlash=0;
let pdy=0,pdyv=0; // phone: paddle forward/back offset (negative = lunge forward)
const lerp=(a,b,t)=>a+(b-a)*t;
const gy=y=>128+250*y, hw=y=>(120+200*y)*.92, kk=y=>hw(y);
function P(x,y,h){return{x:W/2+x*hw(y),y:gy(y)-h*kk(y),s:kk(y)}}

/* ================= controls =================
   Computer ('mouse'): the paddle IS the mouse. Its centre is drawn exactly on the cursor,
   no clicking needed. A hit happens when the ball touches the paddle on screen, and the
   shot comes from how the mouse is moving at that moment (fast forward = smash).
   Phone ('touch'): drag + swipes, unchanged. */
let ctl=(window.matchMedia&&matchMedia('(pointer:fine)').matches)?'mouse':'touch';
$('#howto').innerHTML=ctl==='mouse'
  ?tt('🖱️ המחבט דבוק לעכבר – פשוט מזיזים אותו אל הכדור, בלי ללחוץ.<br>מזיזים מהר = מכה חזקה 💥<br>הראשון ל-7 מנצח.','🖱️ The paddle is stuck to your mouse – just move it onto the ball, no clicking.<br>Move fast = harder hit 💥<br>First to 7 wins.')
  :tt('📱 גררו את המחבט.<br>🔥 <b>סוויש קדימה</b> = הנחתה 💥<br>⬇️ <b>סוויש למטה</b> = סלייס ✂️<br>➡️ <b>סוויש הצידה</b> = זווית 📐<br>הראשון ל-7 מנצח.','📱 Drag the paddle.<br>🔥 <b>Swipe forward</b> = smash 💥<br>⬇️ <b>Swipe down</b> = slice ✂️<br>➡️ <b>Swipe sideways</b> = angle 📐<br>First to 7 wins.');
const PH=.2;    // paddle height above the table
const PSZ=.105; // paddle size (phone)
const PR=27;    // paddle size on computer: fixed, like a paddle stuck to the mouse
let psx=W/2,psy=350; // computer: paddle centre in canvas pixels (= the cursor)
// depth of a paddle whose centre is drawn at screen y (exact inverse of P(x,z,PH).y)
const zOf=sy=>(sy-(128-PH*.92*120))/(250-PH*.92*200);
let ptrail=[],burst=[],rings=[],hitsP=0;
const hist=[]; // recent cursor samples, for paddle speed
function pushHist(x,y,t){hist.push({x,y,t});if(hist.length>14)hist.shift()}
function paddleVel(){ // canvas px per 1/60 s
  if(hist.length<2)return{x:0,y:0};
  const a=hist[hist.length-1];
  if(performance.now()-a.t>70)return{x:0,y:0};
  let o=hist[hist.length-2];
  for(let i=hist.length-2;i>=0;i--){o=hist[i];if(a.t-o.t>=60)break}
  const dt=Math.max(4,a.t-o.t);
  return{x:(a.x-o.x)/dt*16.667,y:(a.y-o.y)/dt*16.667};
}
function pScreen(){ // player paddle centre on screen, radius, depth
  if(ctl==='mouse')return{x:psx,y:psy,r:PR,z:clamp(zOf(psy),.35,1.9)};
  const z=1.04+pdy,q=P(px,z,PH);return{x:q.x,y:q.y,r:q.s*PSZ,z}
}
function segDist(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l>0?clamp(-(ax*dx+ay*dy)/l,0,1):0;return Math.hypot(ax+dx*t,ay+dy*t)}

// computer: follow the mouse anywhere in the window, buttons never needed
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  ctl='mouse';
  const cp=cpos(e);psx=clamp(cp.x,VB.x0,VB.x1);psy=clamp(cp.y,VB.y0,VB.y1);
  pushHist(psx,psy,e.timeStamp||performance.now());
},{passive:true});

// phone: drag to move, swipe for special shots (same as before)
let _ly=null,_lx=null,_vy=0,_vx=0,_lid=null;
let swipeDir=null; // 'up'|'down'|'left'|'right'
let swipeStr=0,swipePending=false;
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse')return;
  const cp=cpos(e);
  tpx=clamp((cp.x-W/2)/hw(1),-1.15,1.15);
  if(e.pointerId!==_lid)return;
  const nx=e.clientX,ny=e.clientY;
  if(_lx!==null){const dx=nx-_lx,dy=ny-_ly;_vx=_vx*.4+dx*.6;_vy=_vy*.4+dy*.6}
  _lx=nx;_ly=ny;
  const screenFrac=clamp(cp.y/H,0,1);
  if(!swipeDir)pdy=lerp(pdy,clamp((screenFrac-.55)*1.1,-.38,.08),.18);
  const spd=Math.sqrt(_vx*_vx+_vy*_vy);
  if(spd>8){
    const ax=Math.abs(_vx),ay=Math.abs(_vy);
    if(ay>ax*.5&&_vy<-8){
      const str=Math.min((-_vy-8)/10,1);
      if(!swipeDir){swipeDir='up';swipeStr=str;swipePending=true;pdy=-0.30-str*.08;pdyv=0.03;swing=10;tone(920,.14,'square',.28);tone(580,.08,'square',.14);smashFlash=12}
    } else if(ay>ax*.7&&_vy>9){
      if(!swipeDir){swipeDir='down';swipeStr=Math.min((_vy-9)/10,1);swipePending=true}
    } else if(ax>ay*.7&&ax>9){
      const d=_vx>0?'right':'left';
      if(!swipeDir){swipeDir=d;swipeStr=Math.min((ax-9)/12,1);swipePending=true}
    }
  }
});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){ctl='mouse';const cp=cpos(e);psx=clamp(cp.x,VB.x0,VB.x1);psy=clamp(cp.y,VB.y0,VB.y1);pushHist(psx,psy,e.timeStamp||performance.now())}
  else{ctl='touch';tpx=clamp((cpos(e).x-W/2)/hw(1),-1.15,1.15);_lid=e.pointerId;_lx=null;_ly=null;_vx=0;_vy=0;swipeDir=null;swipeStr=0;swipePending=false}
  if(on&&phase==='serve'&&srv===0)serveP()});

function launch(by,fy,tx,ty,T,hit){
  const mult=hit===1?cpuSpeedMult:ballSpeedMult;
  let Tm=Math.max(6,Math.round(T/mult));
  const b=ball;
  // never into the net (net is .2 high): if the arc is too low there, fly a little longer
  if((b.y-.5)*(ty-.5)<0){
    for(let i=0;i<90;i++){
      const vh=(.5*G*Tm*Tm-b.h)/Tm,tn=Tm*(b.y-.5)/(b.y-ty),hn=b.h+vh*tn-.5*G*tn*tn;
      if(hn>=.23)break;Tm++;

  L=hit;bnc=[0,0];b.ok=true;if(NET&&hit===0)netSend({t:'b',x:b.x,y:b.y,h:b.h,vx:b.vx,vy:b.vy,vh:b.vh})}

  const pp=pScreen(),zb=clamp(pp.z,.62,1.9),side=psx>W/2?-1:1;
  ball.y=zb;ball.h=PH+.05+Math.sin(pt*.1)*.02;

  if(NET){if(ps>=7||as>=7){const won=ps>=7;over(won?tt('ניצחת את ','You beat ')+NET.name+' 🏆':NET.name+tt(' ניצח',' won'),ps+' : '+as,won?tt('כל הכבוד!','Well played!'):tt('עוד משחק?','Rematch?'),won?15:5,won?10:0,900)}srv=1-w;return}

// computer hit: shot comes from how the mouse moves at the moment of contact
function mouseShot(b,pp,bs){
  const v=paddleVel(),fwd=-v.y,aim=clamp(v.x/15,-1,1),pow=clamp((fwd-2.5)/13,0,1);
  const off=clamp((bs.x-pp.x)/(pp.r||1),-1.4,1.4); // where on the paddle it touched
  let tx=clamp(b.x*.35+aim*.6+off*.16+rnd(-.07,.07),-.86,.86),ty,T;
  if(pow>.6){ // smash
    ty=rnd(.07,.16);T=Math.round(25-pow*11);swing=22;
    msg=tt('הנחתה! 💥','SMASH! 💥');msgBig=true;mt=50;smashCd=3;smashFlash=12;
    tone(920,.14,'square',.28);tone(580,.08,'square',.14);
    for(let i=0;i<24;i++){const a=-Math.PI/2+rnd(-1.15,1.15),s=rnd(5,13);burst.push({x:bs.x,y:bs.y,vx:Math.cos(a)*s+aim*4,vy:Math.sin(a)*s,life:Math.round(rnd(12,22)),max:22})}
  }else if(pow>.18){ // drive
    ty=rnd(.12,.3);T=Math.round(38-pow*22);swing=16;tone(560+pow*300,.06,'square',.11);
  }else{ // block
    ty=rnd(.2,.36);T=44;swing=12;tone(520,.05,'square',.09);

  hitsP++;

function upd(){if(!isFinite(tpx))tpx=0;if(!isFinite(px))px=0;
  const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  const ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(ctl==='mouse'){
    if(kx||ky){psx=clamp(psx+kx*9,VB.x0,VB.x1);psy=clamp(psy+ky*7,VB.y0,VB.y1);pushHist(psx,psy,performance.now())}
    const z=clamp(zOf(psy),.35,1.9),npx=(psx-W/2)/hw(z);
    pvx=npx-px;px=npx;tpx=px;
  }else{
    if(kx)tpx=clamp(tpx+kx*.035,-1.15,1.15);

      if(ky<0){pdyv=Math.max(pdyv-.018,-.06)}else{pdyv=Math.min(pdyv+.014,.04)}

      pdy=lerp(pdy,0,.09);if(Math.abs(pdy)<.005)pdy=0;

  }
  const pp=pScreen(),pp0=ptrail.length?ptrail[ptrail.length-1]:pp;

  ptrail.push({x:pp.x,y:pp.y});if(ptrail.length>9)ptrail.shift();
  if(smashCd>0)smashCd--;

  if(trollTimer>0){trollTimer--;if(trollTimer===0){cpuSpeedMult=1.0;$('#trollMsg').textContent=''}}
  burst=burst.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;return --p.life>0});
  rings=rings.filter(r=>--r.life>0);
  if(swing>0)swing--;if(cswing>0)cswing--;if(mt>0)mt--;
  const csp=(.011+lvl*.0035)*diffMult;
  if(phase==='serve'){pt++;
    if(srv===1){if(NET){cx+=(ncx-cx)*.5;ball.x=cx;ball.y=.04;ball.h=.25+Math.sin(pt*.1)*.03}else{ball.x=cx;ball.y=.04;ball.h=.25+Math.sin(pt*.1)*.03;cx+=clamp(rnd(-.4,.4)-cx,-.01,.01);if(pt>70)serveC()}}
    else{placeServeBall();if(pt>400)serveP()}
    return}

  const b=ball;trail.push({x:b.x,y:b.y,h:b.h});if(trail.length>9)trail.shift();
  // cpu movement
  let tgt=0;if(b.vy<0||b.y<.5){const t=Math.max(0,(b.y-.02)/Math.max(.004,-b.vy));tgt=clamp(b.x+b.vx*t*.9,-1.1,1.1)}
  if(NET)cx+=(ncx-cx)*.5;else cx+=clamp(tgt-cx,-csp,csp);pt++;

  const auth=!NET||L===1;

  const py=b.y;b.x+=b.vx;b.y+=b.vy;b.h+=b.vh;b.vh-=G;
  // net
  if((py-.5)*(b.y-.5)<=0&&b.h<.2&&auth){b.vy*=-.2;b.vx*=.3;score(L===0?1:0,'הכדור פגע ברשת');return}

      // side: 1 = cpu half, 0 = player half
      const oppSide=L===0?1:0;
      if(side===oppSide){bnc[1]++;if(bnc[1]>=2&&auth){score(L,'שני קפיצות אצל היריב');return}}
      else if(auth){score(L===0?1:0,L===0?'הכדור נחת בצד שלך':'הכדור נחת בצד שלו');return}}
    else if(b.h<-.02&&auth){// off table
      if(bnc[1]>=1)score(L,'הכדור יצא');else score(1-L,'הכדור יצא');return}}

  if(ctl==='mouse'){

        ty=clamp(.2+rnd(0,.1)-Math.abs(pvx)*.4,.08,.4);

      const bq=P(b.x,b.y,b.h);rings.push({x:bq.x,y:bq.y,r0:pp.r*.6,life:14,max:14,big:isSmash});hitsP++;

/* background is painted once into its own canvas and blitted each frame */
const bgC=document.createElement('canvas'),bgX=bgC.getContext('2d');
function leafAt(g,x,y,s,rot,col,a){
  g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=a;g.fillStyle=col;
  g.beginPath();g.moveTo(0,-s);g.bezierCurveTo(s*.78,-s*.5,s*.6,s*.55,0,s);g.bezierCurveTo(-s*.6,s*.55,-s*.78,-s*.5,0,-s);g.closePath();g.fill();

  g.beginPath();g.moveTo(0,-s*.84);g.lineTo(0,s*.84);g.stroke();
  for(let i=1;i<=4;i++){const yy=-s*.6+i*s*.3,sg=i%2?1:-1;
    g.beginPath();g.moveTo(0,yy);g.quadraticCurveTo(sg*s*.3,yy+s*.06,sg*s*.46,yy+s*.26);g.stroke()}
  g.restore();

function paintBG(){
  const d=Math.min(devicePixelRatio||1,2),vw=innerWidth,vh=innerHeight;
  if(!vw||!vh)return;
  bgC.width=Math.round(vw*d);bgC.height=Math.round(vh*d);
  const g=bgX,th=TH();g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,vw,vh);
  const sky=g.createLinearGradient(0,0,0,vh);
  sky.addColorStop(0,th.sky[0]);sky.addColorStop(.55,th.sky[1]);sky.addColorStop(1,th.sky[2]);
  g.fillStyle=sky;g.fillRect(0,0,vw,vh);
  const R=mulberry32(1337),S=Math.max(vw,vh);
  if(th.deco==='leaves'){
    g.save();g.filter='blur(2px)';
    for(let i=0;i<30;i++)leafAt(g,R()*vw,vh*(.02+R()*.55),S*(.035+R()*.055),R()*6.28,'#0d5134',.22+R()*.12);
    g.restore();
    for(const[cx,cy,sx,sy]of[[0,0,1,1],[vw,0,-1,1],[0,vh,1,-1],[vw,vh,-1,-1]])
      for(let i=0;i<6;i++){const s=S*(.075+R()*.075);
        leafAt(g,cx+sx*R()*S*.22,cy+sy*R()*S*.2,s,(R()-.5)*2.6+(sx<0?.6:-.6),i%2?'#143a22':'#1d6236',.55+R()*.3)}
  }else if(th.deco==='hall'){
    g.globalAlpha=.07;g.fillStyle='#ffffff';
    for(let x=-30;x<vw+60;x+=Math.max(90,vw/9))g.fillRect(x,0,7,vh*.62);
    g.globalAlpha=.05;for(let i=0;i<5;i++)g.fillRect(0,vh*(.08+i*.06),vw,2);
    g.globalAlpha=1;
  }else if(th.deco==='sun'){
    const r=S*.17,cxp=vw*.5,cyp=vh*.3;
    const sg=g.createRadialGradient(cxp,cyp,r*.2,cxp,cyp,r*2.4);
    sg.addColorStop(0,'rgba(255,240,190,.95)');sg.addColorStop(.3,'rgba(255,190,120,.45)');sg.addColorStop(1,'rgba(255,150,100,0)');
    g.fillStyle=sg;g.beginPath();g.arc(cxp,cyp,r*2.4,0,7);g.fill();
    g.fillStyle='rgba(255,248,214,.95)';g.beginPath();g.arc(cxp,cyp,r,0,7);g.fill();
    g.globalAlpha=.16;g.fillStyle='#4a1f52';
    for(let i=0;i<5;i++){const y=vh*(.42+i*.055);g.beginPath();g.ellipse(vw*(.2+R()*.6),y,vw*(.18+R()*.2),vh*.016,0,0,7);g.fill()}
    g.globalAlpha=1;
  }else{ // grid
    g.strokeStyle='rgba(94,242,255,.3)';g.lineWidth=1.4;g.shadowColor='#5ef2ff';g.shadowBlur=9;

function drawPaddle(x,y,r,rot,face,grip,rim,skin){
  const rx=r*.86,ry=r*1.16;

  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(r*.14,r*.3,rx*.98,ry*.34,0,0,7);ctx.fill();

  gg.addColorStop(0,grip[1]);gg.addColorStop(.45,grip[0]);gg.addColorStop(1,grip[1]);
  ctx.fillStyle=gg;rr(-gw/2,ry*.62,gw,ry*.92,gw*.42);ctx.fill();

  ctx.fillStyle=rim;ctx.beginPath();ctx.ellipse(0,0,rx*1.1,ry*1.08,0,0,7);ctx.fill();

  if(skin&&skin.paint){
    ctx.save();ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.clip();
    skin.paint(ctx,rx,ry);ctx.restore();
  }else{
    const g=ctx.createRadialGradient(-rx*.34,-ry*.4,r*.06,0,0,ry*1.02);
    g.addColorStop(0,face[0]);g.addColorStop(1,face[1]);
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.fill();
  }

  ctx.globalAlpha=.4;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,r*.075);ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(0,0,rx*.72,ry*.72,0,3.55,4.95);ctx.stroke();
  ctx.globalAlpha=1;ctx.restore();
}

// air swoosh behind the paddle when it moves fast
function drawSwoosh(pp){
  const n=ptrail.length;if(n<3)return;
  const a=ptrail[n-1],o=ptrail[Math.max(0,n-5)];
  const sp=Math.hypot(a.x-o.x,a.y-o.y)/Math.min(4,n-1);
  if(sp<5)return;
  const k=clamp((sp-5)/16,0,1),th=TH();
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<n;i++){const p0=ptrail[i-1],p1=ptrail[i],f=i/(n-1);
    ctx.globalAlpha=k*.42*f*f;ctx.strokeStyle=th.fx;ctx.lineWidth=pp.r*2*(.3+.7*f);
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke()}
  const dx=a.x-o.x,dy=a.y-o.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy,ny=ux,len=Math.min(l*1.7,pp.r*5);
  ctx.strokeStyle='#fff';ctx.shadowColor=th.glow;ctx.shadowBlur=9;
  for(const s of[-1.15,-.4,.4,1.15]){
    const out=Math.abs(s)>1;ctx.globalAlpha=k*(out?.5:.8);ctx.lineWidth=out?1.5:2.5;
    const sx=a.x+nx*pp.r*s-ux*pp.r*1.1,sy=a.y+ny*pp.r*s-uy*pp.r*1.1,ll=len*(.6+.4*Math.abs(s));

  ctx.restore();

/* ================= online: play a friend =================
   Uses the site's room system (🌐). Each player's own computer decides whether THEY hit the ball,
   so the mouse paddle feels exactly like in a normal game. The picture is mirrored for the friend. */
let NET=null,ncx=0,lagMs=60;
function netSend(d){try{if(NET&&window.AG&&AG.net&&AG.net.match)AG.net.matchSend(d)}catch(e){}}
function netGo(role,name){
  NET={role:role,name:name||tt('חבר','Friend'),skin:null};ncx=0;
  for(const id of['#menu','#end','#shopM','#settM'])$(id)&&$(id).classList.remove('show');
  $('#friendHint').style.display='none';
  start();on=true;msg=tt('משחק נגד ','Playing ')+NET.name+' 🏓';msgBig=true;mt=110;
}
function netMsg(d){
  if(!NET||!d)return;
  if(d.t==='p'){ncx=-d.x;if(d.s)NET.skin=d.s;return}
  if(d.t==='ping'){netSend({t:'pong',k:d.k});return}
  if(d.t==='pong'){lagMs=lagMs*.7+(performance.now()-d.k)/2*.3;return}
  if(d.t==='b'){ // friend hit or served: the ball now flies towards me
    if(!ball)ball={};
