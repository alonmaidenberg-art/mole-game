<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#193552;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#112b46;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0e2338}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;cursor:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#112840;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<body>
<script src="../hub.js"></script>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🏓</div><h2>פינג-פונג</h2><div class="lb" id="howto">🖱️ המחבט דבוק לעכבר – פשוט מזיזים אותו אל הכדור, בלי ללחוץ.<br>מזיזים מהר = מכה חזקה 💥<br>הראשון ל-7 מנצח.</div><button class="btn" id="go">▶ שחק</button><button class="btn alt" id="settBtn" style="margin-top:8px;display:none">⚙️ הגדרות</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<div class="ov" id="settM"><div class="ovc" style="max-width:400px;text-align:center">
  <h2>⚙️ הגדרות</h2>
  <div style="margin:12px 0;font-weight:700">מהירות כדור</div>
  <div class="chips" style="justify-content:center">
    <button class="chip" data-sp="0.7" id="spSlow">🐢 איטי</button>
    <button class="chip on" data-sp="1.0" id="spNorm">⚡ רגיל</button>
    <button class="chip" data-sp="1.4" id="spFast">🚀 מהיר</button>
    <button class="chip" data-sp="2.0" id="spCrazy">💀 מטורף</button>
  </div>
  <div style="margin:16px 0;font-weight:700">קושי יריב 🤖</div>
  <div class="chips" style="justify-content:center">
    <button class="chip" data-diff="0.5" id="diffEasy">😴 קל</button>
    <button class="chip on" data-diff="1.0" id="diffNorm">😐 רגיל</button>
    <button class="chip" data-diff="1.8" id="diffHard">😤 קשה</button>
    <button class="chip" data-diff="3.2" id="diffImp">💀 בלתי אפשרי</button>
  </div>
  <div style="margin:16px 0;font-weight:700">טרולים 🎭</div>
  <div class="chips" style="justify-content:center">
    <button class="chip" id="trFast">🚀 מהרתי את היריב</button>
    <button class="chip" id="trSlow">🐢 האטתי את היריב</button>
  </div>
  <div id="trollMsg" style="min-height:22px;color:#ffd05a;font-weight:800;margin:8px 0;font-size:14px"></div>
  <button class="btn" id="settClose" style="margin-top:8px">סגור</button>
</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const EN=window.AG_LANG==='en',tt=(he,en)=>EN?en:he;
// The canvas fills the WHOLE window. The 800x450 game sits centred in it and the space
// around it is part of the game too, so the paddle can go anywhere on the screen.
const VB={x0:0,y0:0,x1:W,y1:H}; // visible area in game units
function resize(){const iw=innerWidth,ih=innerHeight,s=Math.min(iw/W,ih/H),d=Math.min(devicePixelRatio||1,2),ox=(iw-W*s)/2,oy=(ih-H*s)/2;
  cv.style.width=iw+'px';cv.style.height=ih+'px';cv.width=Math.round(iw*d);cv.height=Math.round(ih*d);ctx.setTransform(s*d,0,0,s*d,ox*d,oy*d);
  VB.x0=-ox/s;VB.y0=-oy/s;VB.x1=W+ox/s;VB.y1=H+oy/s}
addEventListener('resize',resize);resize();
function cpos(e){const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);return{x:(e.clientX-r.left-(r.width-W*s)/2)/s,y:(e.clientY-r.top-(r.height-H*s)/2)/s}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='tabletennis'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;

// settings & trolls
let ballSpeedMult=1.0; // player's ball speed multiplier (from settings)
let cpuSpeedMult=1.0;  // CPU speed multiplier (troll target — not the player)
let diffMult=1.0;      // difficulty: scales CPU base speed permanently
let trollTimer=0;      // frames left for troll effect on cpu

// settings panel — always visible
$('#settBtn').style.display='';
$('#settBtn').onclick=()=>$('#settM').classList.add('show');
$('#settClose').onclick=()=>$('#settM').classList.remove('show');
document.querySelectorAll('#settM .chip[data-sp]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#settM .chip[data-sp]').forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    ballSpeedMult=parseFloat(b.dataset.sp);
  }
});
document.querySelectorAll('#settM .chip[data-diff]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#settM .chip[data-diff]').forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    diffMult=parseFloat(b.dataset.diff);
  }
});
$('#trFast').onclick=()=>{
  cpuSpeedMult=2.2;trollTimer=420;
  $('#trollMsg').textContent='😈 היריב קיבל טורבו! הוא יהיה מהיר מדי לעצמו…';
  setTimeout(()=>{if(trollTimer<=0)$('#trollMsg').textContent=''},500);
};
$('#trSlow').onclick=()=>{
  cpuSpeedMult=0.3;trollTimer=420;
  $('#trollMsg').textContent='😂 היריב קופא! הוא זז לאט…';
  setTimeout(()=>{if(trollTimer<=0)$('#trollMsg').textContent=''},500);
};

function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let hits=[],on=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function B(x,y,w,h,col,txt,fn,fs=22,tc='#fff'){ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill();if(txt!=null){ctx.fillStyle=tc;ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+w/2,y+h/2+1)}if(fn)hits.push({x,y,w,h,fn})}
function T(t,x,y,fs=22,c='#fff',al='center'){ctx.fillStyle=c;ctx.font='bold '+fs+'px system-ui';ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);break}}});
function run(upd,drw,bg){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(on)upd()}hits=[];ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=bg||'#111';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();if(on||window.__show)drw()}requestAnimationFrame(l)}
function wire(start){$('#go').onclick=()=>{$('#menu').classList.remove('show');start();on=true};$('#again').onclick=()=>{$('#end').classList.remove('show');start();on=true};$('#menu2').onclick=()=>{on=false;$('#end').classList.remove('show');$('#menu').classList.add('show')}}
function over(title,score,msg,coins,dia,delay=600){on=false;window.__show=true;saveBest(score);setTimeout(()=>endGame(title,score,msg,coins,dia),delay)}

const G=.0022;
let px=0,pvx=0,cx=0,ps=0,as=0,lvl=0,sc=0,ball=null,L=-1,bnc=[0,0],phase='serve',pt=0,srv=0,swing=0,cswing=0,msg='',mt=0,trail=[],tpx=0,msgBig=false;
let smashCd=0,smashFlash=0;
let pdy=0,pdyv=0; // phone: paddle forward/back offset (negative = lunge forward)
const lerp=(a,b,t)=>a+(b-a)*t;
const gy=y=>128+250*y, hw=y=>(120+200*y)*.92, kk=y=>hw(y);
function P(x,y,h){return{x:W/2+x*hw(y),y:gy(y)-h*kk(y),s:kk(y)}}

/* ================= controls =================
   Computer ('mouse'): the paddle IS the mouse. Its centre is drawn exactly on the cursor,
   no clicking needed. A hit happens when the ball touches the paddle on screen, and the
   shot comes from how the mouse is moving at that moment (fast forward = smash).
   Phone ('touch'): drag + swipes, unchanged. */
let ctl=(window.matchMedia&&matchMedia('(pointer:fine)').matches)?'mouse':'touch';
$('#howto').innerHTML=ctl==='mouse'
  ?tt('🖱️ המחבט דבוק לעכבר – פשוט מזיזים אותו אל הכדור, בלי ללחוץ.<br>מזיזים מהר = מכה חזקה 💥<br>הראשון ל-7 מנצח.','🖱️ The paddle is stuck to your mouse – just move it onto the ball, no clicking.<br>Move fast = harder hit 💥<br>First to 7 wins.')
  :tt('📱 גררו את המחבט.<br>🔥 <b>סוויש קדימה</b> = הנחתה 💥<br>⬇️ <b>סוויש למטה</b> = סלייס ✂️<br>➡️ <b>סוויש הצידה</b> = זווית 📐<br>הראשון ל-7 מנצח.','📱 Drag the paddle.<br>🔥 <b>Swipe forward</b> = smash 💥<br>⬇️ <b>Swipe down</b> = slice ✂️<br>➡️ <b>Swipe sideways</b> = angle 📐<br>First to 7 wins.');
const PH=.2;    // paddle height above the table
const PSZ=.105; // paddle size (phone)
const PR=27;    // paddle size on computer: fixed, like a paddle stuck to the mouse
let psx=W/2,psy=350; // computer: paddle centre in canvas pixels (= the cursor)
// depth of a paddle whose centre is drawn at screen y (exact inverse of P(x,z,PH).y)
const zOf=sy=>(sy-(128-PH*.92*120))/(250-PH*.92*200);
let ptrail=[],burst=[],rings=[],hitsP=0;
const hist=[]; // recent cursor samples, for paddle speed
function pushHist(x,y,t){hist.push({x,y,t});if(hist.length>14)hist.shift()}
function paddleVel(){ // canvas px per 1/60 s
  if(hist.length<2)return{x:0,y:0};
  const a=hist[hist.length-1];
  if(performance.now()-a.t>70)return{x:0,y:0};
  let o=hist[hist.length-2];
  for(let i=hist.length-2;i>=0;i--){o=hist[i];if(a.t-o.t>=60)break}
  const dt=Math.max(4,a.t-o.t);
  return{x:(a.x-o.x)/dt*16.667,y:(a.y-o.y)/dt*16.667};
}
function pScreen(){ // player paddle centre on screen, radius, depth
  if(ctl==='mouse')return{x:psx,y:psy,r:PR,z:clamp(zOf(psy),.35,1.9)};
  const z=1.04+pdy,q=P(px,z,PH);return{x:q.x,y:q.y,r:q.s*PSZ,z}
}
function segDist(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l>0?clamp(-(ax*dx+ay*dy)/l,0,1):0;return Math.hypot(ax+dx*t,ay+dy*t)}

// computer: follow the mouse anywhere in the window, buttons never needed
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  ctl='mouse';
  const cp=cpos(e);psx=clamp(cp.x,VB.x0,VB.x1);psy=clamp(cp.y,VB.y0,VB.y1);
  pushHist(psx,psy,e.timeStamp||performance.now());
},{passive:true});

// phone: drag to move, swipe for special shots (same as before)
let _ly=null,_lx=null,_vy=0,_vx=0,_lid=null;
let swipeDir=null; // 'up'|'down'|'left'|'right'
let swipeStr=0,swipePending=false;
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse')return;
  const cp=cpos(e);
  tpx=clamp((cp.x-W/2)/hw(1),-1.15,1.15);
  if(e.pointerId!==_lid)return;
  const nx=e.clientX,ny=e.clientY;
  if(_lx!==null){const dx=nx-_lx,dy=ny-_ly;_vx=_vx*.4+dx*.6;_vy=_vy*.4+dy*.6}
  _lx=nx;_ly=ny;
  const screenFrac=clamp(cp.y/H,0,1);
  if(!swipeDir)pdy=lerp(pdy,clamp((screenFrac-.55)*1.1,-.38,.08),.18);
  const spd=Math.sqrt(_vx*_vx+_vy*_vy);
  if(spd>8){
    const ax=Math.abs(_vx),ay=Math.abs(_vy);
    if(ay>ax*.5&&_vy<-8){
      const str=Math.min((-_vy-8)/10,1);
      if(!swipeDir){swipeDir='up';swipeStr=str;swipePending=true;pdy=-0.30-str*.08;pdyv=0.03;swing=10;tone(920,.14,'square',.28);tone(580,.08,'square',.14);smashFlash=12}
    } else if(ay>ax*.7&&_vy>9){
      if(!swipeDir){swipeDir='down';swipeStr=Math.min((_vy-9)/10,1);swipePending=true}
    } else if(ax>ay*.7&&ax>9){
      const d=_vx>0?'right':'left';
      if(!swipeDir){swipeDir=d;swipeStr=Math.min((ax-9)/12,1);swipePending=true}
    }
  }
});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){ctl='mouse';const cp=cpos(e);psx=clamp(cp.x,VB.x0,VB.x1);psy=clamp(cp.y,VB.y0,VB.y1);pushHist(psx,psy,e.timeStamp||performance.now())}
  else{ctl='touch';tpx=clamp((cpos(e).x-W/2)/hw(1),-1.15,1.15);_lid=e.pointerId;_lx=null;_ly=null;_vx=0;_vy=0;swipeDir=null;swipeStr=0;swipePending=false}
  if(on&&phase==='serve'&&srv===0)serveP()});
const endTouch=e=>{if(e.pointerId===_lid){_lid=null;_lx=null;_ly=null;_vx=0;_vy=0}};
cv.addEventListener('pointerup',endTouch);cv.addEventListener('pointercancel',endTouch);

// keyboard: Space serves. Computer: arrows/WASD move the paddle. Phone mode keeps W/S/A/D shots.
addEventListener('keydown',e=>{
  if(keys[e.code])return;
  keys[e.code]=1;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space'&&on&&phase==='serve'&&srv===0){serveP();return}
  if(ctl!=='touch'||!on||phase!=='play'||swipeDir)return;
  if(e.code==='KeyW'||e.code==='ArrowUp'){swipeDir='up';swipeStr=0.8;swipePending=true;pdy=-0.35;pdyv=0.03;swing=10;tone(920,.14,'square',.28);tone(580,.08,'square',.14);smashFlash=12}
  else if(e.code==='KeyS'||e.code==='ArrowDown'){swipeDir='down';swipeStr=0.7;swipePending=true}
  else if(e.code==='KeyA'){swipeDir='left';swipeStr=0.7;swipePending=true}
  else if(e.code==='KeyD'){swipeDir='right';swipeStr=0.7;swipePending=true}
});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});

function launch(by,fy,tx,ty,T,hit){
  const mult=hit===1?cpuSpeedMult:ballSpeedMult;
  let Tm=Math.max(6,Math.round(T/mult));
  const b=ball;
  // never into the net (net is .2 high): if the arc is too low there, fly a little longer
  if((b.y-.5)*(ty-.5)<0){
    for(let i=0;i<90;i++){
      const vh=(.5*G*Tm*Tm-b.h)/Tm,tn=Tm*(b.y-.5)/(b.y-ty),hn=b.h+vh*tn-.5*G*tn*tn;
      if(hn>=.23)break;Tm++;
    }
  }
  b.vx=(tx-b.x)/Tm;b.vy=(ty-b.y)/Tm;b.vh=(.5*G*Tm*Tm-b.h)/Tm;
  L=hit;bnc=[0,0];b.ok=true}
function start(){px=0;pvx=0;tpx=0;cx=0;ps=0;as=0;lvl=0;sc=0;trail=[];msg='';mt=0;msgBig=false;smashCd=0;smashFlash=0;pdy=0;pdyv=0;cpuSpeedMult=1.0;trollTimer=0;ptrail=[];burst=[];rings=[];hitsP=0;swing=0;cswing=0;newPoint(0)}
function newPoint(who){srv=who;phase='serve';pt=0;ball={x:who?cx:px,y:who?.04:1.0,h:.25,vx:0,vy:0,vh:0};L=-1;bnc=[0,0];trail=[];if(!who)placeServeBall()}
function placeServeBall(){ // hold the ball next to the paddle while serving
  if(ctl!=='mouse'){ball.x=px;ball.y=1.0;ball.h=.25+Math.sin(pt*.1)*.03;return}
  const pp=pScreen(),zb=clamp(pp.z,.62,1.9),side=psx>W/2?-1:1;
  ball.y=zb;ball.h=PH+.05+Math.sin(pt*.1)*.02;

function score(w,why){if(w===0){ps++;sc+=10;tone(900,.2)}else{as++;tone(130,.3)}msg=(w===0?'נקודה! ':'נקודה למחשב ')+why;msgBig=false;mt=70;phase='dead';pt=0;

  srv=1-w}

// computer hit: shot comes from how the mouse moves at the moment of contact
function mouseShot(b,pp,bs){
  const v=paddleVel(),fwd=-v.y,aim=clamp(v.x/15,-1,1),pow=clamp((fwd-2.5)/13,0,1);
  const off=clamp((bs.x-pp.x)/(pp.r||1),-1.4,1.4); // where on the paddle it touched
  let tx=clamp(b.x*.35+aim*.6+off*.16+rnd(-.07,.07),-.86,.86),ty,T;
  if(pow>.6){ // smash
    ty=rnd(.07,.16);T=Math.round(25-pow*11);swing=22;
    msg=tt('הנחתה! 💥','SMASH! 💥');msgBig=true;mt=50;smashCd=3;smashFlash=12;
    tone(920,.14,'square',.28);tone(580,.08,'square',.14);
    for(let i=0;i<24;i++){const a=-Math.PI/2+rnd(-1.15,1.15),s=rnd(5,13);burst.push({x:bs.x,y:bs.y,vx:Math.cos(a)*s+aim*4,vy:Math.sin(a)*s,life:Math.round(rnd(12,22)),max:22})}
  }else if(pow>.18){ // drive
    ty=rnd(.12,.3);T=Math.round(38-pow*22);swing=16;tone(560+pow*300,.06,'square',.11);
  }else{ // block
    ty=rnd(.2,.36);T=44;swing=12;tone(520,.05,'square',.09);
  }
  rings.push({x:bs.x,y:bs.y,r0:pp.r*.6,life:14,max:14,big:pow>.6});
  hitsP++;
  b.h=Math.max(.06,b.h);
  launch(b.y,b.y,tx,ty,T,0);
}

function upd(){if(!isFinite(tpx))tpx=0;if(!isFinite(px))px=0;
  const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  const ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(ctl==='mouse'){
    if(kx||ky){psx=clamp(psx+kx*9,VB.x0,VB.x1);psy=clamp(psy+ky*7,VB.y0,VB.y1);pushHist(psx,psy,performance.now())}
    const z=clamp(zOf(psy),.35,1.9),npx=(psx-W/2)/hw(z);
    pvx=npx-px;px=npx;tpx=px;
  }else{
    if(kx)tpx=clamp(tpx+kx*.035,-1.15,1.15);
    if(ky!==0){
      if(ky<0){pdyv=Math.max(pdyv-.018,-.06)}else{pdyv=Math.min(pdyv+.014,.04)}
      pdy=clamp(pdy+pdyv,-.40,.08);
    }else if(_lid===null){// finger lifted: paddle returns
      pdy=lerp(pdy,0,.09);if(Math.abs(pdy)<.005)pdy=0;
    }
    const op=px;px+=clamp(tpx-px,-.18,.18);pvx=px-op;
  }
  const pp=pScreen(),pp0=ptrail.length?ptrail[ptrail.length-1]:pp;
  if(Math.hypot(pp.x-pp0.x,pp.y-pp0.y)>220)ptrail=[];
  ptrail.push({x:pp.x,y:pp.y});if(ptrail.length>9)ptrail.shift();
  if(smashCd>0)smashCd--;
  if(smashFlash>0)smashFlash--;
  if(trollTimer>0){trollTimer--;if(trollTimer===0){cpuSpeedMult=1.0;$('#trollMsg').textContent=''}}
  burst=burst.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;return --p.life>0});
  rings=rings.filter(r=>--r.life>0);
  if(swing>0)swing--;if(cswing>0)cswing--;if(mt>0)mt--;
  const csp=(.011+lvl*.0035)*diffMult;
  if(phase==='serve'){pt++;
    if(srv===1){ball.x=cx;ball.y=.04;ball.h=.25+Math.sin(pt*.1)*.03;cx+=clamp(rnd(-.4,.4)-cx,-.01,.01);if(pt>70)serveC()}
    else{placeServeBall();if(pt>400)serveP()}
    return}
  if(phase==='dead'){pt++;ball.vh-=G;ball.h+=ball.vh;ball.x+=ball.vx*.5;ball.y+=ball.vy*.5;if(ball.h<0){ball.h=0;ball.vh=Math.abs(ball.vh)*.5}if(pt>70){newPoint(srv)}return}
  const b=ball;trail.push({x:b.x,y:b.y,h:b.h});if(trail.length>9)trail.shift();
  // cpu movement
  let tgt=0;if(b.vy<0||b.y<.5){const t=Math.max(0,(b.y-.02)/Math.max(.004,-b.vy));tgt=clamp(b.x+b.vx*t*.9,-1.1,1.1)}
  cx+=clamp(tgt-cx,-csp,csp);pt++;
  const bs0=P(b.x,b.y,b.h);
  const py=b.y;b.x+=b.vx;b.y+=b.vy;b.h+=b.vh;b.vh-=G;
  // net
  if((py-.5)*(b.y-.5)<=0&&b.h<.2){b.vy*=-.2;b.vx*=.3;score(L===0?1:0,'הכדור פגע ברשת');return}
  // table bounce
  const onT=Math.abs(b.x)<=1&&b.y>=0&&b.y<=1;
  if(b.h<=0&&b.vh<0){if(onT){b.h=0;b.vh=-b.vh*.82;const side=b.y<.5?1:0;tone(260+side*40,.04,'sine',.08);
      // side: 1 = cpu half, 0 = player half
      const oppSide=L===0?1:0;
      if(side===oppSide){bnc[1]++;if(bnc[1]>=2){score(L,'שני קפיצות אצל היריב');return}}
      else{score(L===0?1:0,L===0?'הכדור נחת בצד שלך':'הכדור נחת בצד שלו');return}}
    else if(b.h<-.02){// off table
      if(bnc[1]>=1)score(L,'הכדור יצא');else score(1-L,'הכדור יצא');return}}
  // player hit
  if(ctl==='mouse'){
    // the ball touches the paddle on screen (swept, so fast moves can't skip through)
    if(L===1&&b.vy>0&&b.y>.52){
      const bs1=P(b.x,b.y,b.h),br=Math.max(4,bs1.s*.036);
      let ax=bs0.x-pp0.x,ay=bs0.y-pp0.y;const bx=bs1.x-pp.x,by=bs1.y-pp.y;
      if(Math.hypot(pp.x-pp0.x,pp.y-pp0.y)>140){ax=bs0.x-pp.x;ay=bs0.y-pp.y}
      if(segDist(ax,ay,bx,by)<pp.r*1.1+br+5){mouseShot(b,pp,bs1);return}
    }
  }else{
    // phone: forgiving hit zone around the paddle
    const hitY=1.04+pdy;
    if(L===1&&b.vy>0&&b.y>hitY-.35&&b.y<hitY+.4&&b.h<1.0&&bnc[1]>=1&&Math.abs(b.x-px)<.55){
      const lunge=-pdy;
      const sd=swipeDir,ss=swipeStr;
      const isSmash=sd==='up'||lunge>.08;
      const isSlice=sd==='down';
      const isAngleR=sd==='right';
      const isAngleL=sd==='left';
      const sp=Math.abs(pvx)*20+lunge*60+(isSmash?ss*40:0);
      let spd2=Math.round(clamp(46-sp*1.4,isSmash?10:isSlice?36:26,48));
      swing=isSmash?22:isSlice?6:14;
      let tx,ty;
      if(isSmash){
        tx=clamp((sd==='up'?pvx*4:0)+rnd(-.1,.1),-.85,.85);
        ty=clamp(.05+rnd(0,.12),.05,.17);
        spd2=4+Math.round((1-ss)*2);
        tone(920,.14,'square',.28);tone(580,.08,'square',.14);msg=tt('הנחתה! 💥','SMASH! 💥');msgBig=true;mt=50;smashCd=3;
        smashFlash=12;
      } else if(isSlice){
        tx=clamp((b.x-px)*-1.4+pvx*3+rnd(-.1,.1),-.8,.8);
        ty=clamp(.06+rnd(0,.03),.04,.1);spd2=Math.round(spd2*1.5);
        tone(280,.1,'sine',.1);msg='סלייס ✂️';msgBig=false;mt=28;
      } else if(isAngleR){
        tx=clamp(.6+ss*.2+rnd(0,.1),.4,.88);
        ty=clamp(.18+rnd(0,.08),.1,.3);spd2=Math.round(spd2*.85);
        tone(700,.07,'square',.1);msg='זווית! 📐';msgBig=false;mt=22;
      } else if(isAngleL){
        tx=clamp(-.6-ss*.2-rnd(0,.1),-.88,-.4);
        ty=clamp(.18+rnd(0,.08),.1,.3);spd2=Math.round(spd2*.85);
        tone(700,.07,'square',.1);msg='זווית! 📐';msgBig=false;mt=22;
      } else {
        tx=clamp((b.x-px)*-1.6+pvx*5+rnd(-.1,.1),-.85,.85);
        ty=clamp(.2+rnd(0,.1)-Math.abs(pvx)*.4,.08,.4);
        tone(560,.05,'square',.09);
      }
      const bq=P(b.x,b.y,b.h);rings.push({x:bq.x,y:bq.y,r0:pp.r*.6,life:14,max:14,big:isSmash});hitsP++;
      b.h=Math.max(.05,b.h);launch(b.y,b.y,tx,ty,spd2,0);
      if(isSmash)pdyv=0.08;else pdyv*=-.5;
      swipeDir=null;swipeStr=0;
      return}
  }
  // cpu hit
  if(L===0&&b.vy<0&&b.y<.12&&b.y>-.08&&b.h<.6&&bnc[1]>=1&&Math.abs(b.x-cx)<.28+lvl*.025){
    if(Math.random()<.12-lvl*.025&&!ball.cpuMiss){ball.cpuMiss=1}
    if(!ball.cpuMiss){cswing=14;const T=Math.round(clamp(46-lvl*2,34,46));const tx=clamp(rnd(-.8,.8),-.85,.85),ty=rnd(.62,.84);b.h=Math.max(.05,b.h);launch(b.y,b.y,tx,ty,T,1);tone(430,.05,'square',.09);return}}
  if(b.y<-.5||b.y>1.6||b.h<-.8){score(L===0?(bnc[1]>=1?0:1):(bnc[1]>=1?1:0),'פספוס')}
}

function drawPaddle(x,y,r,rot,face){

  const hg=ctx.createLinearGradient(-r*.18,0,r*.18,0);hg.addColorStop(0,'#9a5f2a');hg.addColorStop(.5,'#e3ad70');hg.addColorStop(1,'#9a5f2a');

  ctx.fillStyle='rgba(60,30,10,.25)';ctx.fillRect(-r*.18,r*1.22,r*.36,r*.08);
  // wooden edge
  ctx.fillStyle='#f3e0bb';ctx.beginPath();ctx.arc(0,0,r*1.08,0,7);ctx.fill();
  ctx.lineWidth=Math.max(1,r*.035);ctx.strokeStyle='rgba(110,60,20,.45)';ctx.stroke();
  // rubber
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.06,0,0,r);g.addColorStop(0,face[0]);g.addColorStop(1,face[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=Math.max(1,r*.07);ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,r*.74,3.65,5.1);ctx.stroke();

}
function drawBall(b){const q=P(b.x,b.y,b.h),s0=P(b.x,b.y,0),r=Math.max(4,q.s*.036);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(s0.x,s0.y,r*1.1,r*.45,0,0,7);ctx.fill();
  ctx.fillStyle='#ff8a2a33';trail.forEach((t,i)=>{const p=P(t.x,t.y,t.h);ctx.globalAlpha=i/trail.length*.35;ctx.beginPath();ctx.arc(p.x,p.y,r*(.5+i/trail.length*.5),0,7);ctx.fill()});ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(q.x-r*.35,q.y-r*.4,r*.1,q.x,q.y,r);g.addColorStop(0,'#fff');g.addColorStop(.5,'#ffe2b8');g.addColorStop(1,'#ff9a3a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,r,0,7);ctx.fill()}
// air swoosh behind the paddle when it moves fast
function drawSwoosh(pp){
  const n=ptrail.length;if(n<3)return;
  const a=ptrail[n-1],o=ptrail[Math.max(0,n-5)];
  const sp=Math.hypot(a.x-o.x,a.y-o.y)/Math.min(4,n-1);
  if(sp<5)return;
  const k=clamp((sp-5)/16,0,1);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<n;i++){const p0=ptrail[i-1],p1=ptrail[i],f=i/(n-1);
    ctx.globalAlpha=k*.5*f*f;ctx.strokeStyle='#e4f7ff';ctx.lineWidth=pp.r*2*(.3+.7*f);
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke()}
  const dx=a.x-o.x,dy=a.y-o.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy,ny=ux,len=Math.min(l*1.7,pp.r*5);
  ctx.strokeStyle='#fff';ctx.shadowColor='#8fe3ff';ctx.shadowBlur=8;
  for(const s of[-1.15,-.4,.4,1.15]){
    const out=Math.abs(s)>1;ctx.globalAlpha=k*(out?.55:.85);ctx.lineWidth=out?1.5:2.5;
    const sx=a.x+nx*pp.r*s-ux*pp.r*1.1,sy=a.y+ny*pp.r*s-uy*pp.r*1.1,ll=len*(.6+.4*Math.abs(s));
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-ux*ll,sy-uy*ll);ctx.stroke()}
  ctx.restore();
}
function drawFX(){
  if(!burst.length&&!rings.length)return;
  ctx.save();ctx.lineCap='round';
  for(const r of rings){const f=r.life/r.max;ctx.globalAlpha=f*.9;ctx.strokeStyle=r.big?'#ffe08a':'#fff';ctx.lineWidth=(r.big?4:2.5)*f+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r0+(1-f)*(r.big?60:30),0,7);ctx.stroke()}
  ctx.shadowColor='#bdf0ff';ctx.shadowBlur=10;ctx.strokeStyle='#fff';
  for(const p of burst){const f=p.life/p.max;ctx.globalAlpha=f;ctx.lineWidth=1.5+f*2.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.stroke()}
  ctx.restore();
