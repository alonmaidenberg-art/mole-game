<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1a1038;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#5b36d6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#1a1038;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#150a30;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2c1b6a,#1a1038);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0d0826}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#120a2c;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🐔</div><h2>חוצה כבישים</h2><div class="lb">חצו כבישים ונהרות בלי להיפגע. כל צעד קדימה = נקודה</div><div class="chips" id="ch"></div><div style="opacity:.75;font-size:12.5px;margin-top:8px"><b>חצים/WASD</b> או החלקה / לחיצה על המסך</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='crossy'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

const SK=['🐔','🐸','🐱','🦊','🐼','🐵'];let sel=+store.get('cr_c',0);const chEl=$('#ch');SK.forEach((e,i)=>{const b=document.createElement('button');b.className='chip'+(i===sel?' on':'');b.textContent=e;b.style.fontSize='26px';b.onclick=()=>{sel=i;store.set('cr_c',i);[...chEl.children].forEach(k=>k.classList.toggle('on',k===b))};chEl.appendChild(b)});
const TS=50,COLS=15;let rows=[],pl,cam,score,state='menu',frame=0,maxRow,dead=0,parts=[],eagle=0,hop=0;
function mkRow(i){if(i<3)return{i,t:'grass',tr:[]};const r=Math.random(),dif=Math.min(1,i/80);let t=r<.28?'grass':r<.68?'road':r<.88?'water':'rail';
  const row={i,t,tr:[],dir:Math.random()<.5?-1:1,sp:rnd(1.2,2.2)*(1+dif*.8)};
  if(t==='grass'){for(let c=0;c<COLS;c++)if(Math.random()<.2&&Math.abs(c-7)>0)row.tr.push(c)}
  if(t==='road'){const n=2+Math.floor(Math.random()*2);for(let k=0;k<n;k++)row.tr.push({x:k*(W/n)+rnd(0,60),w:rnd(60,100),c:['#e8433f','#2f7bff','#f2b400','#27b36a','#a78bff'][Math.floor(Math.random()*5)]})}
  if(t==='water'){row.sp*=.7;const n=3;for(let k=0;k<n;k++)row.tr.push({x:k*(W/n)+rnd(0,40),w:rnd(110,170)})}
  if(t==='rail'){row.tr=[{x:-400,w:300}];row.cd=Math.floor(rnd(60,200));row.warn=0}return row}
function ensure(){while(rows.length<maxRow+18)rows.push(mkRow(rows.length))}
function reset(){rows=[];maxRow=0;pl={c:7,r:0,x:7*TS+TS/2,y:0,on:null,sx:0};cam=0;score=0;frame=0;dead=0;eagle=0;parts=[];ensure();state='play';hop=0}
function canGo(c,r){if(c<0||c>=COLS)return false;const row=rows[r];if(!row)return false;if(row.t==='grass'&&row.tr.includes(c))return false;return r>=0}
function move(dc,dr){if(state!=='play'||hop>0)return;const nc=pl.c+dc,nr=pl.r+dr;if(!canGo(nc,nr)){return}pl.c=nc;pl.r=nr;pl.x=nc*TS+TS/2;pl.on=null;hop=6;tone(500+nr*10,.05);if(nr>maxRow){maxRow=nr;score=maxRow;ensure()}}
addEventListener('keydown',e=>{const m={ArrowUp:[0,1],KeyW:[0,1],Space:[0,1],ArrowDown:[0,-1],KeyS:[0,-1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(m)move(m[0],m[1])});
let ts=null;cv.addEventListener('pointerdown',e=>{ts=cpos(e)});cv.addEventListener('pointerup',e=>{if(!ts)return;const p=cpos(e),dx=p.x-ts.x,dy=p.y-ts.y;ts=null;if(Math.hypot(dx,dy)<20)move(0,1);else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy<0?1:-1)});
function die(why){if(state!=='play')return;state='dead';dead=60;tone(120,.4,'sawtooth',.1);for(let i=0;i<20;i++)parts.push({x:pl.x,y:pl.r*TS,vx:rnd(-4,4),vy:rnd(-6,1),t:0,life:40,col:why==='water'?'#7fd4ff':'#fff'});saveBest(score);setTimeout(()=>endGame('אוי לא!',score,'עברת '+score+' שורות',Math.floor(score/4),score>=60?1:0),700)}
function step(){if(state==='menu')return;frame++;if(hop>0)hop--;
  for(const r of rows){if(r.t==='road')for(const c of r.tr){c.x+=r.dir*r.sp;if(c.x>W+120)c.x=-120-c.w;if(c.x<-120-c.w)c.x=W+120}
    else if(r.t==='water')for(const c of r.tr){c.x+=r.dir*r.sp;if(c.x>W+60)c.x=-60-c.w;if(c.x<-60-c.w)c.x=W+60}
    else if(r.t==='rail'){const t=r.tr[0];if(r.cd>0){r.cd--;r.warn=r.cd<50?1:0;if(r.cd===0){t.x=r.dir>0?-t.w-20:W+20;r.run=1}}else{t.x+=r.dir*14;if(t.x>W+400||t.x<-400-t.w){r.cd=Math.floor(rnd(100,260));r.run=0}}}}
  if(state==='play'){const row=rows[pl.r];
    if(row.t==='road'){for(const c of row.tr)if(Math.abs(pl.x-(c.x+c.w/2))<c.w/2+14)die('car')}
    if(row.t==='rail'&&row.run&&Math.abs(pl.x-(row.tr[0].x+row.tr[0].w/2))<row.tr[0].w/2+14)die('car');
    if(row.t==='water'&&hop===0){const l=row.tr.find(c=>pl.x>c.x+8&&pl.x<c.x+c.w-8);if(l){pl.x+=row.dir*row.sp}else die('water');if(pl.x<0||pl.x>W)die('water');pl.c=Math.round((pl.x-TS/2)/TS)}
    if(frame%600===0&&maxRow>0)eagle=1;
    const idle=frame-(pl.last||0);if(pl.r<maxRow-4&&frame%1===0){}
    cam+=((pl.r)-cam)*.08;if(pl.r<maxRow-5){die('car')}}
  else cam+=0;for(const q of parts){q.t++;q.x+=q.vx;q.y+=q.vy;q.vy+=.3}parts=parts.filter(q=>q.t<q.life)}
const sy=r=>H-90-(r-cam)*TS;
function draw(){ctx.fillStyle='#8fd16a';ctx.fillRect(0,0,W,H);const lo=Math.floor(cam)-3,hi=Math.floor(cam)+10;
  for(let r=lo;r<=hi;r++){const row=rows[r];if(!row||r<0)continue;const y=sy(r)-TS/2;
    if(row.t==='grass'){ctx.fillStyle=r%2?'#8fd16a':'#9ddb78';ctx.fillRect(0,y,W,TS);for(const c of row.tr){const x=c*TS+TS/2;ctx.fillStyle='#6b4a2a';ctx.fillRect(x-4,y+TS-18,8,14);ctx.fillStyle='#2f9a46';ctx.beginPath();ctx.arc(x,y+TS-28,18,0,7);ctx.fill()}}
    else if(row.t==='road'){ctx.fillStyle='#4a4a58';ctx.fillRect(0,y,W,TS);ctx.fillStyle='#ffffff55';for(let x=0;x<W;x+=60)ctx.fillRect(x,y+TS/2-2,30,4);for(const c of row.tr){ctx.fillStyle=c.c;ctx.beginPath();ctx.roundRect?ctx.roundRect(c.x,y+8,c.w,TS-16,8):ctx.rect(c.x,y+8,c.w,TS-16);ctx.fill();ctx.fillStyle='#bfe8ff';const wx=row.dir>0?c.x+c.w-26:c.x+6;ctx.fillRect(wx,y+12,20,TS-24)}}
    else if(row.t==='water'){ctx.fillStyle='#3b9be8';ctx.fillRect(0,y,W,TS);ctx.fillStyle='#ffffff30';for(let x=0;x<W;x+=70)ctx.fillRect((x+frame*row.dir)%W,y+10,24,3);for(const c of row.tr){ctx.fillStyle='#9a6a3a';ctx.beginPath();ctx.roundRect?ctx.roundRect(c.x,y+6,c.w,TS-12,10):ctx.rect(c.x,y+6,c.w,TS-12);ctx.fill();ctx.fillStyle='#b98450';ctx.fillRect(c.x+8,y+14,c.w-16,4)}}
    else{ctx.fillStyle='#6a5a4a';ctx.fillRect(0,y,W,TS);ctx.fillStyle='#2a2a2a';ctx.fillRect(0,y+14,W,4);ctx.fillRect(0,y+TS-18,W,4);if(row.warn&&frame%10<5){ctx.fillStyle='#ff3a3a';ctx.beginPath();ctx.arc(30,y+TS/2,10,0,7);ctx.arc(W-30,y+TS/2,10,0,7);ctx.fill()}
      const t=row.tr[0];if(row.run){ctx.fillStyle='#d94a4a';ctx.fillRect(t.x,y+6,t.w,TS-12);ctx.fillStyle='#fff';for(let k=0;k<5;k++)ctx.fillRect(t.x+10+k*55,y+14,26,12)}}}
  if(pl){const y=sy(pl.r)-TS/2+TS/2-(hop>0?10:0),x=pl.x;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,sy(pl.r)+10,16,6,0,0,7);ctx.fill();ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';if(state!=='dead'||dead>0)ctx.fillText(SK[sel],x,y)}
  for(const q of parts){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.col;ctx.fillRect(q.x,sy(pl.r)+q.y*0+q.t*0+q.y-pl.r*TS+TS*0,4,4)}ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.font='bold 44px system-ui';ctx.textAlign='left';ctx.strokeText(score,16,50);ctx.fillText(score,16,50)}
let last=performance.now(),acc=0;function loop(n){requestAnimationFrame(loop);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;step()}if(rows.length)draw();else{ctx.fillStyle='#8fd16a';ctx.fillRect(0,0,W,H)}}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show')};
window.__s={reset,step,move,get pl(){return pl},get state(){return state},get score(){return score},get rows(){return rows}};requestAnimationFrame(loop);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
