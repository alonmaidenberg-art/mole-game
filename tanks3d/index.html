<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#193552;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#112b46;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0e2338}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#112840;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}#cv{left:0;top:0;width:100%;height:100%;transform:none}#hud{font-size:20px}
</style>
</head>
<body>
<script src="../lib/three.min.js"></script><script src="../lib/real3d.js"></script><canvas id="cv"></canvas><div id="hud"></div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🛡️</div><h2>קרב טנקים 3D</h2><div class="lb">הטנק מכוון וירה אוטומטית. אתם רק נעים ומתחמקים!</div><div style="opacity:.75;font-size:12.5px;margin-top:8px"><b>WASD/חצים</b> תנועה · בטלפון: גררו את האצבע</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,300);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function onSwipe(fn,tap){let s=null;cv.addEventListener('pointerdown',e=>{s={x:e.clientX,y:e.clientY}});cv.addEventListener('pointerup',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;s=null;if(Math.hypot(dx,dy)<20){tap&&tap()}else if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy<0?'u':'d')})}
const BK='tanks3d'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}
function runLoop(stepFn,active){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(active())stepFn()}R.render(scene,cam)}requestAnimationFrame(l)}

R3.upgrade(R);R3.autoMaterials();R3.shadowAll();R3.env(R,scene,'day');R3.sky(scene,'day',{radius:600,fogNear:120,fogFar:480});const SUN=R3.sun(scene,{position:[70,110,50],intensity:1.2,ambient:.42,skyColor:0xc3e0ff,groundColor:0x6a6a42,shadowRadius:70,far:340});
const AX=22,AZ=14,M=c=>new THREE.MeshLambertMaterial({color:c});
const floor=new THREE.Mesh(new THREE.BoxGeometry(AX*2+2,.5,AZ*2+2),M(0x7ab85a));floor.position.y=-.25;scene.add(floor);
for(let i=-AX;i<AX;i+=4)for(let j=-AZ;j<AZ;j+=4)if(((i+j)/4)%2===0){const t=new THREE.Mesh(new THREE.BoxGeometry(4,.02,4),M(0x86c466));t.position.set(i+2,.01,j+2);scene.add(t)}
const bd=new THREE.Mesh(new THREE.BoxGeometry(AX*2+3,1.2,.8),M(0x8a6a4a));for(const [x,z,r] of[[0,-AZ-1,0],[0,AZ+1,0],[-AX-1,0,1],[AX+1,0,1]]){const w=bd.clone();w.position.set(x,.6,z);if(r){w.rotation.y=Math.PI/2;w.scale.x=(AZ*2+3)/(AX*2+3)}scene.add(w)}
const WALLS=[[-8,-4,3,3],[8,4,3,3],[0,0,2,6],[-14,6,3,2],[14,-6,3,2]];const walls=WALLS.map(([x,z,w,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,2,d),M(0x9a9aa8));m.position.set(x,1,z);scene.add(m);return{x,z,w,d}});
function mkTank(c1,c2){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,2.4),M(c1));b.position.y=.55;const t=new THREE.Group();const tb=new THREE.Mesh(new THREE.BoxGeometry(1.1,.5,1.2),M(c2));tb.position.y=1.15;const bar=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,1.6),M(0x333));bar.position.set(0,1.15,1);t.add(tb,bar);g.add(b,t);g.userData.turret=t;scene.add(g);return g}
let state='menu',pl,en,bl,parts,score,wave,frame,kills;
const inWall=(x,z,r)=>walls.some(w=>Math.abs(x-w.x)<w.w/2+r&&Math.abs(z-w.z)<w.d/2+r);
function reset(){for(const e of en||[])scene.remove(e.g);for(const b of bl||[])scene.remove(b.m);if(pl)scene.remove(pl.g);pl={g:mkTank(0x3f7be8,0x2a5ab8),x:-AX+3,z:0,a:0,hp:5,cd:0,inv:0};en=[];bl=[];parts=[];score=0;wave=0;frame=0;kills=0;state='play';nextWave()}
function nextWave(){wave++;const n=Math.min(8,2+wave);for(let i=0;i<n;i++){let x,z,t=0;do{x=rnd(4,AX-2);z=rnd(-AZ+2,AZ-2)}while(inWall(x,z,1.5)&&t++<20);const hv=wave>2&&Math.random()<.3;en.push({g:mkTank(hv?0x8a1a1a:0xe8433f,hv?0x5a0e0e:0xb82a2a),x,z,a:Math.PI,hp:hv?3:1,cd:rnd(60,160),hv,sp:(.045+wave*.004)*(hv?.8:1)})}}
function shoot(o,tx,tz,own,spd){const a=Math.atan2(tx-o.x,tz-o.z);const m=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),M(own==='p'?0xffe066:0xff5555));m.position.set(o.x+Math.sin(a)*1.5,1.15,o.z+Math.cos(a)*1.5);scene.add(m);bl.push({m,x:m.position.x,z:m.position.z,vx:Math.sin(a)*spd,vz:Math.cos(a)*spd,own,life:120});tone(own==='p'?500:260,.06,'square',.05)}
let tdrag=null;cv.addEventListener('pointerdown',e=>{tdrag={x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY}});cv.addEventListener('pointermove',e=>{if(tdrag){tdrag.cx=e.clientX;tdrag.cy=e.clientY}});for(const t of['pointerup','pointercancel'])addEventListener(t,()=>tdrag=null);
function moveObj(o,dx,dz,r){const nx=clamp(o.x+dx,-AX+1,AX-1),nz=clamp(o.z+dz,-AZ+1,AZ-1);if(!inWall(nx,o.z,r))o.x=nx;if(!inWall(o.x,nz,r))o.z=nz}
function step(){if(state!=='play')return;frame++;
  let dx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0),dz=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);if(tdrag){const ax=tdrag.cx-tdrag.x,ay=tdrag.cy-tdrag.y,l=Math.hypot(ax,ay);if(l>8){dx=ax/Math.max(l,40);dz=ay/Math.max(l,40)}}
  const l=Math.hypot(dx,dz);if(l>0){dx/=l;dz/=l;pl.a=Math.atan2(dx,dz);moveObj(pl,dx*.2,dz*.2,1)}
  pl.g.position.set(pl.x,0,pl.z);pl.g.rotation.y=pl.a;if(pl.inv>0)pl.inv--;pl.g.visible=pl.inv%8<5;
  let near=null,nd=1e9;for(const e of en){const d=Math.hypot(e.x-pl.x,e.z-pl.z);if(d<nd){nd=d;near=e}}
  if(near){pl.g.userData.turret.rotation.y=Math.atan2(near.x-pl.x,near.z-pl.z)-pl.a;if(--pl.cd<=0&&nd<30){shoot(pl,near.x,near.z,'p',.55);pl.cd=24}}
  for(const e of en){const d=Math.hypot(pl.x-e.x,pl.z-e.z),a=Math.atan2(pl.x-e.x,pl.z-e.z);if(d>9)moveObj(e,Math.sin(a)*e.sp*3,Math.cos(a)*e.sp*3,1);else if(d<5)moveObj(e,-Math.sin(a)*e.sp*2,-Math.cos(a)*e.sp*2,1);e.a=a;e.g.position.set(e.x,0,e.z);e.g.rotation.y=a;
    for(const f of en)if(f!==e){const dd=Math.hypot(e.x-f.x,e.z-f.z);if(dd<2.2&&dd>0){e.x+=(e.x-f.x)/dd*.05;e.z+=(e.z-f.z)/dd*.05}}
    if(--e.cd<=0){e.cd=rnd(70,150)-wave*3;shoot(e,pl.x+rnd(-1.5,1.5),pl.z+rnd(-1.5,1.5),'e',.28)}}
  for(const b of bl){b.x+=b.vx;b.z+=b.vz;b.m.position.set(b.x,1.15,b.z);b.life--;if(inWall(b.x,b.z,.1)||Math.abs(b.x)>AX||Math.abs(b.z)>AZ)b.life=0;
    if(b.own==='p'){for(const e of en)if(Math.hypot(b.x-e.x,b.z-e.z)<1.3){b.life=0;e.hp--;if(e.hp<=0){e.dead=1;score+=e.hv?30:10;kills++;boom(e.x,e.z)}}}else if(pl.inv<=0&&Math.hypot(b.x-pl.x,b.z-pl.z)<1.2){b.life=0;hurt()}}
  bl=bl.filter(b=>{if(b.life<=0){scene.remove(b.m);return false}return true});en=en.filter(e=>{if(e.dead){scene.remove(e.g);return false}return true});
  for(const q of parts){q.t++;q.m.position.x+=q.vx;q.m.position.y+=q.vy;q.m.position.z+=q.vz;q.vy-=.02}parts=parts.filter(q=>{if(q.t>30){scene.remove(q.m);return false}return true});
  if(!en.length&&state==='play'){if(!pl.nw)pl.nw=60;if(--pl.nw<=0){pl.nw=0;nextWave()}}
  cam.position.set(pl.x*.4,24,pl.z*.4+16);cam.lookAt(pl.x*.4,0,pl.z*.4);$('#hud').textContent='גל '+wave+'   ⭐ '+score+'   '+'❤️'.repeat(Math.max(0,pl.hp))}
function boom(x,z){tone(160,.15,'sawtooth',.08);for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),M([0xffd05a,0xff8a3a,0x444][i%3]));m.position.set(x,1,z);scene.add(m);parts.push({m,t:0,vx:rnd(-.2,.2),vy:rnd(.1,.3),vz:rnd(-.2,.2)})}}
function hurt(){pl.hp--;pl.inv=80;tone(120,.3,'sawtooth',.1);if(pl.hp<=0){state='dead';boom(pl.x,pl.z);saveBest(score);setTimeout(()=>endGame('הטנק נהרס',score,'הגעת לגל '+wave,Math.floor(score/8),wave>=8?1:0),700)}}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show')};
window.__s={reset,step,get state(){return state},get score(){return score},get wave(){return wave},get pl(){return pl}};
cam.position.set(0,24,16);cam.lookAt(0,0,0);runLoop(step,()=>state==='play');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
