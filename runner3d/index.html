<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ריצה 3D – אלון מידנברג</title>
<meta name="description" content="משחק ריצה תלת-ממדי: קפיצה, החלקה ומטבעות.">
<meta name="theme-color" content="#8fd0ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1a1038;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#5b36d6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#1a1038;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#150a30;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2c1b6a,#1a1038);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0d0826}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#120a2c;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}#cv{left:0;top:0;width:100%;height:100%;transform:none}#hud{font-size:20px}
</style>
</head>
<body>
<script src="../lib/three.min.js"></script><canvas id="cv"></canvas><div id="hud"></div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🏃</div><h2>ריצה 3D</h2><div class="lb">רצו, קפצו, החליקו ואספו מטבעות. המהירות עולה לאט לאט</div><div style="opacity:.75;font-size:12.5px;margin-top:8px"><b>◀ ▶</b> החלפת נתיב · <b>▲/רווח</b> קפיצה · <b>▼</b> החלקה<br>בטלפון: החלק באצבע</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,300);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function onSwipe(fn,tap){let s=null;cv.addEventListener('pointerdown',e=>{s={x:e.clientX,y:e.clientY}});cv.addEventListener('pointerup',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;s=null;if(Math.hypot(dx,dy)<20){tap&&tap()}else if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy<0?'u':'d')})}
const BK='runner3d'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}
function runLoop(stepFn,active){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(active())stepFn()}R.render(scene,cam)}requestAnimationFrame(l)}

scene.background=new THREE.Color(0x8fd0ff);scene.fog=new THREE.Fog(0x8fd0ff,30,110);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a5a,.85));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,12,6);scene.add(dl);
const LANES=[-2.2,0,2.2];const M=(c)=>new THREE.MeshLambertMaterial({color:c});
const ground=[];for(let i=0;i<14;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(8,.4,10),M(i%2?0x6a6a7a:0x75758a));g.position.set(0,-.2,-i*10+10);scene.add(g);ground.push(g)}
for(const x of[-1.1,1.1]){for(let i=0;i<14;i++){}}
const side=[];for(let i=0;i<30;i++){const h=rnd(3,12),b=new THREE.Mesh(new THREE.BoxGeometry(rnd(3,6),h,rnd(3,6)),M([0xe86a5a,0x5a8ae8,0xf2c24a,0x7ad07a,0xb48ae8][i%5]));b.position.set((i%2?1:-1)*rnd(7,12),h/2,-Math.floor(i/2)*9);scene.add(b);side.push(b)}
const P=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.6),M(0xe8433f));body.position.y=.95;const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),M(0xf0c8a0));head.position.y=1.85;const legL=new THREE.Mesh(new THREE.BoxGeometry(.3,.6,.3),M(0x223));const legR=legL.clone();legL.position.set(-.22,.3,0);legR.position.set(.22,.3,0);P.add(body,head,legL,legR);scene.add(P);
let state='menu',lane,px,py,vy,slide,speed,dist,obs,coins,score,got,frame;
function reset(){for(const o of obs||[])scene.remove(o.m);for(const c of coins||[])scene.remove(c.m);obs=[];coins=[];lane=1;px=0;py=0;vy=0;slide=0;speed=.34;dist=0;score=0;got=0;frame=0;state='play'}
function mkObs(z){const l=Math.floor(Math.random()*3),t=Math.random();let m,type;if(t<.4){type='block';m=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.4,1.4),M(0xc0392b))}else if(t<.7){type='low';m=new THREE.Mesh(new THREE.BoxGeometry(2,.8,.6),M(0xf2b400))}else{type='high';m=new THREE.Group();const bar=new THREE.Mesh(new THREE.BoxGeometry(2.2,.5,.5),M(0x7a3ad0));bar.position.y=1.5;for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.2,1.8,.2),M(0x333));p.position.set(s,.9,0);m.add(p)}m.add(bar)}
  m.position.set(LANES[l],type==='block'?1.2:type==='low'?.4:0,z);scene.add(m);obs.push({m,l,type,z})}
function mkCoin(l,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,16),M(0xffd05a));m.rotation.x=Math.PI/2;m.position.set(LANES[l],1,z);scene.add(m);coins.push({m,l,z})}
function move(d){if(state!=='play')return;if(d==='l')lane=Math.max(0,lane-1);if(d==='r')lane=Math.min(2,lane+1);if(d==='u'&&py<=.01){vy=.26;tone(500,.06)}if(d==='d'){slide=40;if(py>.01)vy=-.4}}
addEventListener('keydown',e=>{const m={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',Space:'u',ArrowDown:'d',KeyS:'d'}[e.code];if(m)move(m)});onSwipe(move,()=>move('u'));
let nextSpawn=0;
function step(){frame++;speed=Math.min(.95,.34+frame/3000);dist+=speed;score=Math.floor(dist);
  px+=(LANES[lane]-px)*.25;vy-=.015;py+=vy;if(py<0){py=0;vy=0}if(slide>0)slide--;
  P.position.set(px,py,0);P.scale.y=slide>0&&py<=.01?.5:1;const rs=Math.sin(frame*.4)*.4;legL.rotation.x=rs;legR.rotation.x=-rs;P.rotation.z=(LANES[lane]-px)*-.1;
  for(const g of ground){g.position.z+=speed;if(g.position.z>15)g.position.z-=140}for(const b of side){b.position.z+=speed;if(b.position.z>15)b.position.z-=140}
  nextSpawn-=speed;if(nextSpawn<=0){mkObs(-90);if(Math.random()<.7)mkCoin(Math.floor(Math.random()*3),-86-Math.random()*6);nextSpawn=rnd(9,16)-speed*5}
  if(frame%25===0)for(let k=0;k<3;k++)if(Math.random()<.35)mkCoin(lane,-90-k*2.5);
  for(const o of obs){o.m.position.z+=speed;o.z=o.m.position.z;if(Math.abs(o.z)<.9&&Math.abs(o.m.position.x-px)<1.0){let hit=false;if(o.type==='block')hit=true;if(o.type==='low'&&py<.7)hit=true;if(o.type==='high'&&!(slide>0&&py<.01))hit=true;if(hit&&state==='play')die()}}
  for(const c of coins){c.m.position.z+=speed;c.m.rotation.z+=.1;if(Math.abs(c.m.position.z)<.9&&Math.abs(c.m.position.x-px)<1&&py<1.8&&!c.got){c.got=1;c.m.visible=false;got++;tone(900,.05)}}
  obs=obs.filter(o=>{if(o.m.position.z>8){scene.remove(o.m);return false}return true});coins=coins.filter(c=>{if(c.m.position.z>8){scene.remove(c.m);return false}return true});
  cam.position.set(px*.5,4.2,7);cam.lookAt(px*.3,1.2,-8);$('#hud').textContent=score+' מ׳  🪙 '+got}
function die(){state='dead';tone(110,.5,'sawtooth',.12);saveBest(score);setTimeout(()=>endGame('התנגשת!',score+' מ׳','',Math.floor(score/15)+got,score>=500?1:0),700)}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show')};
window.__s={reset,step,move,get state(){return state},get score(){return score}};
cam.position.set(0,4.2,7);cam.lookAt(0,1.2,-8);runLoop(step,()=>state==='play');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
