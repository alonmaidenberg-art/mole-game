<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>חוט</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<script src="../hub.js"></script>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 800, H = 450;
canvas.width = W; canvas.height = H;

// Scale canvas to fit screen
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Game state
let lives = 3, score = 0, level = 0;
let state = 'start'; // start, play, dead, win, gameover
let wireLen, maxWireLen, wireDecayRate;
let pointerX = 400, pointerY = 225;
let tipX, tipY;
let deadTimer = 0, winTimer = 0;
let flashAlpha = 0;

// Levels: array of {walls: [{x,y,w,h}], A: {x,y}, B: {x,y}}
// Walls are rectangles the wire tip must not enter
const LEVELS = [
  // Level 1: straight corridor
  {
    walls: [
      {x:100,y:150,w:600,h:30},
      {x:100,y:270,w:600,h:30}
    ],
    A: {x:130,y:210}, B: {x:670,y:210}
  },
  // Level 2: one turn
  {
    walls: [
      {x:80,y:120,w:30,h:200},
      {x:80,y:120,w:300,h:30},
      {x:350,y:120,w:30,h:120},
      {x:350,y:210,w:200,h:30},
      {x:550,y:210,w:30,h:120},
      {x:280,y:300,w:300,h:30}
    ],
    A: {x:200,y:200}, B: {x:430,y:260}
  },
  // Level 3: S-curve
  {
    walls: [
      {x:100,y:100,w:250,h:25},
      {x:100,y:200,w:250,h:25},
      {x:350,y:200,w:25,h:25},
      {x:350,y:225,w:250,h:25},
      {x:350,y:325,w:250,h:25},
      {x:100,y:300,w:25,h:50}
    ],
    A: {x:200,y:155}, B: {x:600,y:280}
  },
  // Level 4: zigzag
  {
    walls: [
      {x:60,y:60,w:680,h:20},
      {x:60,y:370,w:680,h:20},
      {x:60,y:60,w:20,h:200},
      {x:200,y:160,w:20,h:210},
      {x:340,y:60,w:20,h:200},
      {x:480,y:160,w:20,h:210},
      {x:620,y:60,w:20,h:200}
    ],
    A: {x:130,y:110}, B: {x:550,y:260}
  },
  // Level 5: maze-like
  {
    walls: [
      {x:50,y:50,w:700,h:20},
      {x:50,y:380,w:700,h:20},
      {x:50,y:50,w:20,h:330},
      {x:730,y:50,w:20,h:330},
      {x:150,y:150,w:200,h:20},
      {x:450,y:150,w:200,h:20},
      {x:150,y:150,w:20,h:130},
      {x:350,y:280,w:20,h:100},
      {x:450,y:280,w:200,h:20},
      {x:150,y:250,w:150,h:20}
    ],
    A: {x:100,y:215}, B: {x:680,y:215}
  },
  // Level 6: tight corridors
  {
    walls: [
      {x:50,y:50,w:700,h:20},{x:50,y:380,w:700,h:20},
      {x:50,y:50,w:20,h:330},{x:730,y:50,w:20,h:330},
      {x:150,y:70,w:20,h:160},{x:300,y:220,w:20,h:160},
      {x:450,y:70,w:20,h:160},{x:600,y:220,w:20,h:160},
      {x:150,y:70,w:300,h:20},{x:450,y:220,w:300,h:20}
    ],
    A: {x:100,y:215}, B: {x:680,y:325}
  },
  // Level 7: spiral attempt
  {
    walls: [
      {x:60,y:60,w:680,h:20},{x:60,y:370,w:680,h:20},
      {x:60,y:60,w:20,h:310},{x:720,y:60,w:20,h:310},
      {x:140,y:140,w:520,h:20},{x:140,y:140,w:20,h:160},
      {x:140,y:280,w:440,h:20},{x:560,y:140,w:20,h:160},
      {x:220,y:220,w:280,h:20},{x:220,y:220,w:20,h:60},
      {x:480,y:220,w:20,h:60}
    ],
    A: {x:100,y:215}, B: {x:380,y:260}
  },
  // Level 8: narrow passages
  {
    walls: [
      {x:50,y:50,w:700,h:15},{x:50,y:385,w:700,h:15},
      {x:50,y:50,w:15,h:335},{x:735,y:50,w:15,h:335},
      {x:160,y:50,w:15,h:245},{x:260,y:160,w:15,h:240},
      {x:360,y:50,w:15,h:245},{x:460,y:160,w:15,h:240},
      {x:560,y:50,w:15,h:245}
    ],
    A: {x:105,y:300}, B: {x:680,y:120}
  },
  // Level 9: complex
  {
    walls: [
      {x:40,y:40,w:720,h:15},{x:40,y:395,w:720,h:15},
      {x:40,y:40,w:15,h:355},{x:745,y:40,w:15,h:355},
      {x:120,y:40,w:15,h:200},{x:200,y:200,w:15,h:200},
      {x:280,y:40,w:15,h:200},{x:360,y:200,w:15,h:200},
      {x:440,y:40,w:15,h:200},{x:520,y:200,w:15,h:200},
      {x:600,y:40,w:15,h:200},{x:120,y:200,w:200,h:15},
      {x:360,y:200,w:200,h:15}
    ],
    A: {x:75,y:220}, B: {x:700,y:300}
  },
  // Level 10: final boss
  {
    walls: [
      {x:30,y:30,w:740,h:15},{x:30,y:405,w:740,h:15},
      {x:30,y:30,w:15,h:375},{x:755,y:30,w:15,h:375},
      {x:100,y:30,w:15,h:290},{x:170,y:125,w:15,h:290},
      {x:240,y:30,w:15,h:290},{x:310,y:125,w:15,h:290},
      {x:380,y:30,w:15,h:290},{x:450,y:125,w:15,h:290},
      {x:520,y:30,w:15,h:290},{x:590,y:125,w:15,h:290},
      {x:660,y:30,w:15,h:290}
    ],
    A: {x:60,y:250}, B: {x:710,y:200}
  }
];

function startLevel() {
  const lvl = LEVELS[Math.min(level, LEVELS.length-1)];
  const speedMult = 1 + level * 0.15;
  maxWireLen = Math.max(200, 450 - level * 20);
  wireLen = maxWireLen;
  wireDecayRate = (0.4 + level * 0.08) * speedMult;
  tipX = lvl.A.x;
  tipY = lvl.A.y;
  pointerX = lvl.A.x;
  pointerY = lvl.A.y;
  state = 'play';
  flashAlpha = 0;
}

function getLevel() { return LEVELS[Math.min(level, LEVELS.length-1)]; }

function wallsHit(x, y, r) {
  const walls = getLevel().walls;
  for (const w of walls) {
    const cx = Math.max(w.x, Math.min(x, w.x+w.w));
    const cy = Math.max(w.y, Math.min(y, w.y+w.h));
    const dx = x-cx, dy = y-cy;
    if (dx*dx+dy*dy < r*r) return true;
  }
  return false;
}

function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2)}

// Input
let pDown = false;
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  if (e.touches) {
    return {x: (e.touches[0].clientX - rect.left)*scaleX, y: (e.touches[0].clientY - rect.top)*scaleY};
  }
  return {x: (e.clientX - rect.left)*scaleX, y: (e.clientY - rect.top)*scaleY};
}
canvas.addEventListener('pointerdown', e => {
  pDown = true;
  const p = getPos(e);
  pointerX = p.x; pointerY = p.y;
  if (state === 'start' || state === 'gameover') { level=0; lives=3; score=0; startLevel(); }
  else if (state === 'win') { level++; if(level>=LEVELS.length){state='gameover';}else{score++;startLevel();} }
  else if (state === 'dead') { startLevel(); }
});
canvas.addEventListener('pointermove', e => {
  if (!pDown) return;
  const p = getPos(e);
  pointerX = p.x; pointerY = p.y;
});
canvas.addEventListener('pointerup', () => pDown = false);
canvas.addEventListener('pointercancel', () => pDown = false);

// Main loop
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last)/1000, 0.05);
  last = ts;

  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  if (state === 'start') {
    drawStart();
  } else if (state === 'play') {
    updatePlay(dt);
    drawPlay();
  } else if (state === 'dead') {
    deadTimer -= dt;
    drawPlay();
    drawDeadOverlay();
    if (deadTimer <= 0) state = 'dead_wait';
  } else if (state === 'dead_wait') {
    drawPlay();
    drawDeadOverlay();
  } else if (state === 'win') {
    winTimer -= dt;
    drawPlay();
    drawWinOverlay();
    if (winTimer <= 0) { level++; if(level>=LEVELS.length){state='gameover';}else{score++;startLevel();} }
  } else if (state === 'gameover') {
    drawGameover();
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,80,0,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    flashAlpha = Math.max(0, flashAlpha - dt*3);
  }

  requestAnimationFrame(loop);
}

function updatePlay(dt) {
  if (!pDown) return;

  // Move tip toward pointer, but check collision incrementally
  const dx = pointerX - tipX, dy = pointerY - tipY;
  const d = Math.sqrt(dx*dx+dy*dy);
  const speed = 300;
  const step = Math.min(d, speed*dt);
  if (d > 2) {
    const nx = tipX + (dx/d)*step;
    const ny = tipY + (dy/d)*step;
    if (!wallsHit(nx, ny, 7)) {
      tipX = nx; tipY = ny;
    } else {
      // try sliding along walls
      if (!wallsHit(nx, tipY, 7)) tipX = nx;
      else if (!wallsHit(tipX, ny, 7)) tipY = ny;
    }
  }

  // Decay wire
  wireLen -= wireDecayRate * dt * 60;

  if (wireLen <= 0) {
    // Dead - ran out of wire
    flashAlpha = 0.5;
    lives--;
    deadTimer = 0.5;
    state = lives <= 0 ? 'gameover' : 'dead';
    if (state === 'gameover') return;
    // Reset tip to A
    const lvl = getLevel();
    tipX = lvl.A.x; tipY = lvl.A.y;
    wireLen = maxWireLen;
    return;
  }

  // Check if tip hits a wall
  if (wallsHit(tipX, tipY, 7)) {
    flashAlpha = 0.5;
    lives--;
    deadTimer = 0.5;
    state = lives <= 0 ? 'gameover' : 'dead';
    const lvl = getLevel();
    tipX = lvl.A.x; tipY = lvl.A.y;
    wireLen = maxWireLen;
    return;
  }

  // Check reach B
  const lvl = getLevel();
  if (dist(tipX, tipY, lvl.B.x, lvl.B.y) < 18) {
    winTimer = 1.2;
    state = 'win';
  }
}

function drawPlay() {
  const lvl = getLevel();

  // Draw walls
  ctx.fillStyle = '#3a3a5c';
  ctx.strokeStyle = '#5a5a8c';
  ctx.lineWidth = 1;
  for (const w of lvl.walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Draw wire from A to tip
  const dist_to_tip = dist(lvl.A.x, lvl.A.y, tipX, tipY);
  const usedLen = Math.min(dist_to_tip, wireLen);
  const ratio = usedLen / dist_to_tip || 0;
  const drawTipX = lvl.A.x + (tipX - lvl.A.x) * ratio;
  const drawTipY = lvl.A.y + (tipY - lvl.A.y) * ratio;

  // Wire glow
  const wireHue = wireLen / maxWireLen; // 1=full green, 0=red
  const wireColor = wireHue > 0.3
    ? `hsl(${50 + wireHue*20},100%,60%)`
    : `hsl(${wireHue*50},100%,60%)`;

  ctx.save();
  ctx.shadowColor = wireColor;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = wireColor;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lvl.A.x, lvl.A.y);
  ctx.lineTo(drawTipX, drawTipY);
  ctx.stroke();
  ctx.restore();

  // Wire bar
  const barW = 200, barH = 12;
  const barX = W/2 - barW/2, barY = H - 30;
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(barX, barY, barW, barH);
  const pct = wireLen / maxWireLen;
  const barColor = pct > 0.5 ? '#44ff88' : pct > 0.25 ? '#ffcc00' : '#ff4444';
  ctx.fillStyle = barColor;
  ctx.fillRect(barX, barY, barW * pct, barH);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('חוט', W/2, barY - 4);

  // A point
  ctx.save();
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.arc(lvl.A.x, lvl.A.y, 10, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', lvl.A.x, lvl.A.y);

  // B point - pulse
  const pulse = 1 + 0.15*Math.sin(Date.now()/300);
  ctx.save();
  ctx.shadowColor = '#ff44aa';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff44aa';
  ctx.beginPath();
  ctx.arc(lvl.B.x, lvl.B.y, 10*pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('B', lvl.B.x, lvl.B.y);

  // HUD
  ctx.fillStyle = '#eee';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(`שלב ${level+1}/10`, 15, 12);
  ctx.textAlign = 'right';
  ctx.fillText(`ניקוד: ${score}`, W-15, 12);

  // Lives
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#ff4444' : '#333';
    ctx.beginPath();
    ctx.arc(W/2 + (i-1)*25, 18, 8, 0, Math.PI*2);
    ctx.fill();
  }

  // Tip dot
  ctx.save();
  ctx.shadowColor = wireColor;
  ctx.shadowBlur = 10;
  ctx.fillStyle = wireColor;
  ctx.beginPath();
  ctx.arc(drawTipX, drawTipY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawDeadOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('נגמר החוט!', W/2, H/2 - 20);
  ctx.fillStyle = '#aaa';
  ctx.font = '20px Arial';
  ctx.fillText(`נשארו ${lives} לחים`, W/2, H/2 + 25);
  ctx.font = '16px Arial';
  ctx.fillText('לחץ להמשך', W/2, H/2 + 60);
}

function drawWinOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎉 עברת!', W/2, H/2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '22px Arial';
  ctx.fillText(`שלב ${level+1} הושלם`, W/2, H/2 + 25);
}

function drawStart() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 56px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('חוט', W/2, H/2 - 80);
  ctx.fillStyle = '#aaa';
  ctx.font = '22px Arial';
  ctx.fillText('הובל את החוט מ-A ל-B לפני שהוא נגמר', W/2, H/2 - 20);
  ctx.fillText('גרור את האצבע/עכבר כדי להזיז את הקצה', W/2, H/2 + 20);
  ctx.fillStyle = '#ff44aa';
  ctx.font = '24px Arial';
  ctx.fillText('לחץ להתחיל', W/2, H/2 + 70);

  // Draw sample wire
  ctx.save();
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2 - 100, H/2 + 130);
  ctx.lineTo(W/2 + 100, H/2 + 130);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.arc(W/2 - 100, H/2 + 130, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ff44aa';
  ctx.beginPath();
  ctx.arc(W/2 + 100, H/2 + 130, 8, 0, Math.PI*2);
  ctx.fill();
}

function drawGameover() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('נגמר המשחק', W/2, H/2 - 60);
  ctx.fillStyle = '#fff';
  ctx.font = '28px Arial';
  ctx.fillText(`ניקוד סופי: ${score}`, W/2, H/2);
  ctx.fillStyle = '#ffcc00';
  ctx.font = '22px Arial';
  ctx.fillText('לחץ לשחק שוב', W/2, H/2 + 60);
}

requestAnimationFrame(ts => { last = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
