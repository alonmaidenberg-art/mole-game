<!doctype html>
<html lang="he" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ציפור מעופפת – אלון מידנברג</title>
<meta name="description" content="ציפור מעופפת בין צינורות: משחק רפלקסים.">
<meta name="theme-color" content="#5ec8ff">
<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#193552;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#112b46;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%}
</style>
</head>
<body>
<canvas id="cv" style="position:fixed;inset:0;width:100%;height:100%;touch-action:none"></canvas>
<div id="hud" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:54px;font-weight:900;text-shadow:0 3px 0 #0006;pointer-events:none">0</div>
<button class="ib" id="menuB" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;display:none">☰</button>
<div class="ov show" id="menu"><div class="ovc"><div style="font-size:70px;line-height:1">🐤</div><h2>ציפור מעופפת</h2><div style="opacity:.8;margin-bottom:6px">לוחצים כדי לעוף ולא נוגעים בצינורות</div>
<div class="chips" id="mLv"><button class="chip" data-v="1">קל</button><button class="chip on" data-v="2">רגיל</button><button class="chip" data-v="3">קשה</button></div>
<div style="margin:10px 0">🏆 שיא: <b id="best">0</b></div><button class="btn" id="go">▶ שחק</button><div style="opacity:.7;font-size:13px;margin-top:8px">רווח / לחיצה / מגע</div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נפלת!</h2><div id="eM" style="font-size:22px;margin-bottom:6px"></div><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="mb2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}

const cv=$('#cv'),c=cv.getContext('2d');const PT=[];function burst(x,y,col,n){n=n||18;for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*9,vy:Math.random()*-9-1,t:0,l:26+~~(Math.random()*14),c:col||'#ffd23a',r:2+Math.random()*3})}let VW,VH,lv=+store.get('b_lv',2),best=+store.get('b_best',0),state='menu',bird,pipes,score,t=0,gnd=0,flash=0;$('#best').textContent=best;
const CFG={1:{gap:.34,sp:2.4,g:.34,j:-6.4},2:{gap:.28,sp:2.9,g:.4,j:-7},3:{gap:.22,sp:3.4,g:.44,j:-7.4}};
[...$('#mLv').children].forEach(b=>{b.classList.toggle('on',+b.dataset.v===lv);b.onclick=()=>{lv=+b.dataset.v;store.set('b_lv',lv);[...$('#mLv').children].forEach(k=>k.classList.toggle('on',k===b))}});
function resize(){const d=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*d;cv.height=VH*d;c.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function start(){bird={x:VW*.28,y:VH*.45,vy:0,r:16};pipes=[];score=0;t=0;state='play';$('#hud').textContent=0;['menu','end'].forEach(i=>$('#'+i).classList.remove('show'));$('#menuB').style.display='block';flap()}
function flap(){if(state!=='play')return;bird.vy=CFG[lv].j;tone(520,.07)}
function die(){if(state!=='play')return;state='dead';tone(140,.4,'sawtooth');flash=8;burst(bird.x,bird.y,'#ffd23a',24);let nb=false;if(score>best){best=score;store.set('b_best',best);nb=true}$('#best').textContent=best;$('#eT').textContent=nb?'שיא חדש! 🏆':'נפלת!';$('#eM').textContent='עברת '+score+' צינורות';setTimeout(()=>$('#end').classList.add('show'),600)}
function step(){const k=CFG[lv];t++;gnd=(gnd+k.sp)%40;
  if(state==='play'){bird.vy+=k.g;bird.y+=bird.vy;if(t%2===0)PT.push({x:bird.x-bird.r*.7,y:bird.y,vx:-1.5,vy:(Math.random()-.5)*.5,t:0,l:7,c:'rgba(255,210,50,.45)',r:3.5});
    if(!pipes.length||pipes[pipes.length-1].x<VW-Math.max(220,VW*.34)){const gh=VH*k.gap+30,top=60+Math.random()*(VH-120-VH*.12-gh);pipes.push({x:VW+40,top,gh,w:64,s:false})}
    pipes.forEach(p=>{p.x-=k.sp;if(!p.s&&p.x+p.w<bird.x){p.s=true;score++;$('#hud').textContent=score;tone(880,.08)}
      if(bird.x+bird.r-3>p.x&&bird.x-bird.r+3<p.x+p.w&&(bird.y-bird.r+3<p.top||bird.y+bird.r-3>p.top+p.gh))die()});
    pipes=pipes.filter(p=>p.x>-90);const gy=VH-VH*.12;if(bird.y+bird.r>gy||bird.y<-40)die()}
  else if(state==='dead'){bird.vy+=.5;bird.y=Math.min(bird.y+bird.vy,VH-VH*.12-bird.r)}
  else{bird&&(bird.y=VH*.45+Math.sin(t*.06)*10)}}
function draw(){const gy=VH-VH*.12;
  // Sky: dusk gradient
  const sg=c.createLinearGradient(0,0,0,VH);sg.addColorStop(0,'#07021a');sg.addColorStop(.4,'#1a0d4a');sg.addColorStop(.72,'#8b1f2a');sg.addColorStop(1,'#e8632a');c.fillStyle=sg;c.fillRect(0,0,VW,VH);
  // Stars
  for(let i=0;i<55;i++){const sx=((i*7919+313)%VW+VW)%VW,sy=((i*4523+77)%(VH*.48));const br=.3+Math.sin(t*.04+i*.8)*.25;c.fillStyle='rgba(255,255,255,'+br+')';c.beginPath();c.arc(sx,sy,.8+Math.sin(i)*.5,0,7);c.fill()}
  // Moon
  c.save();c.shadowBlur=22;c.shadowColor='#fffde0';c.fillStyle='#fffde0';c.beginPath();c.arc(VW*.82,VH*.14,20,0,7);c.fill();c.shadowBlur=0;c.fillStyle='#07021a';c.beginPath();c.arc(VW*.82+9,VH*.14-5,16,0,7);c.fill();c.restore();
  // Mountains silhouette
  c.fillStyle='#0a0618';c.beginPath();c.moveTo(0,gy);const mpts=[[0,gy*.72],[VW*.12,gy*.38],[VW*.22,gy*.62],[VW*.38,gy*.28],[VW*.5,gy*.55],[VW*.64,gy*.32],[VW*.78,gy*.5],[VW*.9,gy*.4],[VW,gy*.58],[VW,gy]];mpts.forEach(([mx,my])=>c.lineTo(mx,my));c.closePath();c.fill();
  // Clouds (slow parallax)
  for(let i=0;i<3;i++){const cx=((i*290-t*.25)%(VW+330)+VW+330)%(VW+330)-150,cy=100+i*58;c.fillStyle='rgba(255,170,100,.13)';c.beginPath();c.arc(cx,cy,44,0,7);c.arc(cx+42,cy-14,37,0,7);c.arc(cx+80,cy,42,0,7);c.arc(cx+32,cy-26,28,0,7);c.fill()}
  // Particle trail & explosions
  for(const p of PT){const al=1-p.t/p.l;c.globalAlpha=al*.9;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,Math.max(.5,p.r*(1-p.t/p.l*.5)),0,7);c.fill()}c.globalAlpha=1;
  // Pipes (3D metallic green)
  for(const p of (pipes||[])){
    const pg=c.createLinearGradient(p.x,0,p.x+p.w,0);pg.addColorStop(0,'#1a6e1a');pg.addColorStop(.28,'#4acc4a');pg.addColorStop(.7,'#2a9230');pg.addColorStop(1,'#113811');
    const cg=c.createLinearGradient(p.x-5,0,p.x+p.w+5,0);cg.addColorStop(0,'#1a6e1a');cg.addColorStop(.22,'#5ae05a');cg.addColorStop(.78,'#2a9230');cg.addColorStop(1,'#113811');
    // top pipe body
    c.fillStyle=pg;c.fillRect(p.x,0,p.w,p.top);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(p.x+p.w-14,0,14,p.top);c.fillStyle='rgba(255,255,255,.1)';c.fillRect(p.x+3,0,7,p.top);
    // top cap
    c.fillStyle=cg;c.fillRect(p.x-6,p.top-26,p.w+12,26);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(p.x+p.w+1,p.top-26,11,26);c.fillStyle='rgba(255,255,255,.12)';c.fillRect(p.x-3,p.top-26,8,26);
    // bottom pipe body
    c.fillStyle=pg;c.fillRect(p.x,p.top+p.gh,p.w,VH);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(p.x+p.w-14,p.top+p.gh+26,14,VH);c.fillStyle='rgba(255,255,255,.1)';c.fillRect(p.x+3,p.top+p.gh+26,7,VH);
    // bottom cap
    c.fillStyle=cg;c.fillRect(p.x-6,p.top+p.gh,p.w+12,26);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(p.x+p.w+1,p.top+p.gh,11,26);c.fillStyle='rgba(255,255,255,.12)';c.fillRect(p.x-3,p.top+p.gh,8,26)}
  // Ground
  const gg=c.createLinearGradient(0,gy,0,VH);gg.addColorStop(0,'#5aa83c');gg.addColorStop(.12,'#4a9230');gg.addColorStop(.13,'#8b5e2a');gg.addColorStop(1,'#6b4520');c.fillStyle=gg;c.fillRect(0,gy,VW,VH-gy);c.fillStyle='rgba(0,0,0,.12)';for(let x=-gnd;x<VW;x+=40)c.fillRect(x,gy+16,20,6);
  // Bird
  if(bird){const ba=Math.max(-.5,Math.min(1.2,bird.vy*.07));const wa=Math.sin(t*.45)*.55;c.save();c.translate(bird.x,bird.y);c.rotate(ba);
    c.shadowBlur=18;c.shadowColor='rgba(255,210,50,.7)';
    // wing
    c.fillStyle='#e09000';c.save();c.translate(-2,3);c.rotate(wa);c.beginPath();c.ellipse(-5,2,10,5,-.3,0,7);c.fill();c.restore();
    c.shadowBlur=0;
    // body glow
    const bg=c.createRadialGradient(-4,-5,2,0,0,bird.r);bg.addColorStop(0,'#ffe87a');bg.addColorStop(1,'#f0a800');c.fillStyle=bg;c.beginPath();c.arc(0,0,bird.r,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(7,-5,6,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(9,-5,3,0,7);c.fill();c.fillStyle='#ff7a3a';c.beginPath();c.moveTo(13,0);c.lineTo(26,3);c.lineTo(13,7);c.fill();c.restore()}
  // Flash (orange-red on death instead of white)
  if(flash>0){c.fillStyle='rgba(255,80,30,'+flash/12+')';c.fillRect(0,0,VW,VH);flash--}
  // Advance particles
  for(const p of PT){p.t++;p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.96}
  for(let i=PT.length-1;i>=0;i--)if(PT[i].t>PT[i].l)PT.splice(i,1)}
let last=performance.now(),acc=0;function loop(n){requestAnimationFrame(loop);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;step()}draw()}
bird={x:VW*.28,y:VH*.45,vy:0,r:16};pipes=[];requestAnimationFrame(loop);
function act(e){if(state==='play'){flap()}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();act()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();act()}});
$('#go').onclick=start;$('#again').onclick=start;
function toMenu(){state='menu';pipes=[];$('#hud').textContent=0;$('#end').classList.remove('show');$('#menu').classList.add('show');$('#menuB').style.display='none'}
$('#mb2').onclick=toMenu;$('#menuB').onclick=toMenu;
window.__b={start,step,get state(){return state},get score(){return score},get bird(){return bird},flap};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="../hub.js"></script>
</body>
</html>
