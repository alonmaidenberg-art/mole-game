<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>תפקידים</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a2e;display:flex;justify-content:center;align-items:center;width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<script src="../hub.js"></script>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const W=800,H=450;
c.width=W;c.height=H;
const scale=Math.min(innerWidth/W,innerHeight/H);
c.style.width=W*scale+'px';c.style.height=H*scale+'px';

// Roles definition
const ROLES=[
  {id:'athlete',name:'ספורטאי',emoji:'🏃',color:'#00e676',desc:'רץ מהיר! מהירות כפולה',speed:5,ability:'fast',abDesc:'מהירות x2'},
  {id:'thief',name:'גנב',emoji:'🦹',color:'#b388ff',desc:'עובר דרך מכשולים קטנים!',speed:2.5,ability:'phase',abDesc:'עוברת קירות קטנים'},
  {id:'cop',name:'שוטר',emoji:'👮',color:'#42a5f5',desc:'דוחף מכשולים הצידה!',speed:3,ability:'push',abDesc:'דוחף מכשולים'},
  {id:'wizard',name:'קוסם',emoji:'🧙',color:'#ff7043',desc:'טלפורט — הקש פעמיים!',speed:3,ability:'teleport',abDesc:'טלפורט בלחיצה כפולה'},
  {id:'acrobat',name:'אקרובט',emoji:'🤸',color:'#ffee58',desc:'קפיצה כפולה!',speed:3.5,ability:'jump',abDesc:'קפיצה כפולה'},
];

// Levels: array of obstacle rects {x,y,w,h,small}
const LEVELS=[
  // Level 1 - simple corridor
  {obs:[{x:100,y:50,w:20,h:280,small:false},{x:680,y:120,w:20,h:280,small:false}]},
  // Level 2
  {obs:[{x:200,y:0,w:20,h:300,small:false},{x:400,y:150,w:20,h:300,small:false},{x:600,y:0,w:20,h:280,small:false}]},
  // Level 3
  {obs:[{x:150,y:100,w:200,h:20,small:false},{x:450,y:330,w:200,h:20,small:false},{x:300,y:200,w:20,h:150,small:true}]},
  // Level 4
  {obs:[{x:100,y:0,w:20,h:200,small:false},{x:100,y:250,w:20,h:200,small:false},{x:300,y:50,w:20,h:200,small:false},{x:300,y:300,w:300,h:20,small:false}]},
  // Level 5
  {obs:[{x:200,y:150,w:400,h:20,small:false},{x:200,y:150,w:20,h:150,small:false},{x:580,y:150,w:20,h:150,small:false},{x:200,y:280,w:200,h:20,small:true}]},
  // Level 6
  {obs:[{x:50,y:200,w:300,h:20,small:false},{x:450,y:230,w:300,h:20,small:false},{x:200,y:0,w:20,h:200,small:false},{x:600,y:230,w:20,h:220,small:false}]},
  // Level 7
  {obs:[{x:150,y:50,w:20,h:350,small:false},{x:300,y:50,w:20,h:250,small:false},{x:450,y:150,w:20,h:300,small:false},{x:600,y:50,w:20,h:280,small:true}]},
  // Level 8
  {obs:[{x:100,y:100,w:150,h:20,small:false},{x:100,y:100,w:20,h:250,small:false},{x:100,y:330,w:300,h:20,small:false},{x:400,y:100,w:20,h:230,small:false},{x:400,y:100,w:200,h:20,small:true}]},
  // Level 9
  {obs:[{x:120,y:0,w:20,h:180,small:false},{x:120,y:270,w:20,h:180,small:false},{x:250,y:180,w:20,h:270,small:false},{x:380,y:0,w:20,h:270,small:false},{x:510,y:180,w:20,h:270,small:true}]},
  // Level 10
  {obs:[{x:100,y:50,w:20,h:160,small:false},{x:100,y:280,w:280,h:20,small:false},{x:100,y:280,w:20,h:120,small:false},{x:300,y:50,w:20,h:230,small:false},{x:300,y:50,w:300,h:20,small:false},{x:580,y:50,w:20,h:230,small:false},{x:430,y:280,w:170,h:20,small:true}]},
];

// Game state
let lives=3,score=0,level=0,state='rolescreen'; // rolescreen|playing|dead|win|gameover
let role=ROLES[0];
let px,py,pvx=0,pvy=0;
let onGround=false,jumpCount=0;
let teleTarget=null,teleFlash=0;
let pushedObs=[];
let keys={};
let pointer={x:W/2,y:H/2,down:false};
let dblTapTime=0;
let roleTimer=0;
let deadTimer=0;

const GRAVITY=0.4;
const PSIZE=22;
const GOAL_SIZE=25;

function getStart(){return {x:60,y:H-80};}
function getGoal(){return {x:W-60,y:80};}

function resetPlayer(){
  const s=getStart();
  px=s.x;py=s.y;pvx=0;pvy=0;onGround=false;jumpCount=0;teleTarget=null;teleFlash=0;pushedObs=[];
}

function pickRole(){
  role=ROLES[Math.floor(Math.random()*ROLES.length)];
}

function startLevel(){
  resetPlayer();
  state='playing';
}

function getLevelObs(){
  const lv=LEVELS[Math.min(level,LEVELS.length-1)];
  // Deep copy + merge pushed offsets
  return lv.obs.map((o,i)=>{
    const push=pushedObs[i]||{dx:0,dy:0};
    return {...o,x:o.x+push.dx,y:o.y+push.dy};
  });
}

function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function circleRect(cx,cy,r,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-nx)**2+(cy-ny)**2<r*r;
}

function update(){
  if(state==='rolescreen'){
    roleTimer--;
    if(roleTimer<=0) startLevel();
    return;
  }
  if(state==='dead'){
    deadTimer--;
    if(deadTimer<=0){
      if(lives<=0){state='gameover';}
      else{state='rolescreen';pickRole();roleTimer=180;}
    }
    return;
  }
  if(state!=='playing') return;

  // Input → velocity
  let spd=role.speed;
  let moveX=0;

  // Touch/pointer drag
  if(pointer.down){
    const dx=pointer.x-px;
    if(Math.abs(dx)>8) moveX=Math.sign(dx)*spd;
  }
  // Keyboard
  if(keys['ArrowLeft']||keys['a']) moveX=-spd;
  if(keys['ArrowRight']||keys['d']) moveX=spd;

  pvx=moveX;

  // Gravity
  pvy+=GRAVITY;

  // Jump (athlete=double, acrobat=double, others=single)
  // handled in keydown/pointerdown

  // Teleport flash
  if(teleFlash>0) teleFlash--;

  // Move X
  px+=pvx;
  // Wall bounce
  if(px<PSIZE){px=PSIZE;pvx=0;}
  if(px>W-PSIZE){px=W-PSIZE;pvx=0;}

  // Obstacle collisions X
  const obs=getLevelObs();
  for(let i=0;i<obs.length;i++){
    const o=obs[i];
    if(role.ability==='phase'&&o.small) continue;
    if(circleRect(px,py,PSIZE,o.x,o.y,o.w,o.h)){
      // push back X
      const prevX=px-pvx;
      px=prevX;pvx=0;
      // cop can push small
      if(role.ability==='push'&&o.small){
        if(!pushedObs[i]) pushedObs[i]={dx:0,dy:0};
        pushedObs[i].dx+=moveX*2;
      }
    }
  }

  // Move Y
  py+=pvy;
  onGround=false;

  // Floor
  if(py>H-PSIZE){py=H-PSIZE;pvy=0;onGround=true;jumpCount=0;}

  // Obstacle collisions Y
  const obs2=getLevelObs();
  for(let i=0;i<obs2.length;i++){
    const o=obs2[i];
    if(role.ability==='phase'&&o.small) continue;
    if(circleRect(px,py,PSIZE,o.x,o.y,o.w,o.h)){
      const prevY=py-pvy;
      if(pvy>0){// landing on top
        py=o.y-PSIZE;pvy=0;onGround=true;jumpCount=0;
      } else {
        py=o.y+o.h+PSIZE;pvy=0;
      }
    }
  }

  // Ceiling
  if(py<PSIZE){py=PSIZE;pvy=0;}

  // Check goal
  const g=getGoal();
  if(Math.hypot(px-g.x,py-g.y)<GOAL_SIZE+PSIZE){
    score++;
    level++;
    if(level>=LEVELS.length){state='win';}
    else{state='rolescreen';pickRole();roleTimer=200;}
    return;
  }
}

function jump(){
  const maxJumps=(role.ability==='acrobat'||role.ability==='athlete')?2:1;
  if(jumpCount<maxJumps){
    pvy=-10;jumpCount++;onGround=false;
  }
}

function doTeleport(tx,ty){
  // Check not inside obstacle
  const obs=getLevelObs();
  let ok=true;
  for(const o of obs){
    if(circleRect(tx,ty,PSIZE,o.x,o.y,o.w,o.h)){ok=false;break;}
  }
  if(ok&&tx>PSIZE&&tx<W-PSIZE&&ty>PSIZE&&ty<H-PSIZE){
    px=tx;py=ty;pvy=0;teleFlash=15;
  }
}

// Draw
function draw(){
  // Background gradient
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0a2e');
  bg.addColorStop(1,'#0d0520');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  if(state==='rolescreen'){
    drawRoleScreen();
    return;
  }
  if(state==='gameover'){drawEndScreen(false);return;}
  if(state==='win'){drawEndScreen(true);return;}

  // Draw floor
  ctx.fillStyle='#2a1a4e';
  ctx.fillRect(0,H-10,W,10);

  // Draw obstacles
  const obs=getLevelObs();
  obs.forEach((o,i)=>{
    const isSmall=o.small;
    ctx.save();
    if(isSmall){
      ctx.fillStyle='#4a3a6e';
      ctx.strokeStyle='#7a6aae';
    } else {
      ctx.fillStyle='#3a2a5e';
      ctx.strokeStyle='#6a5a9e';
    }
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(o.x,o.y,o.w,o.h,4);
    ctx.fill();ctx.stroke();
    ctx.restore();
  });

  // Draw start A
  const s=getStart();
  ctx.save();
  ctx.fillStyle='#00e676';
  ctx.shadowColor='#00e676';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(s.x,s.y,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('A',s.x,s.y);
  ctx.restore();

  // Draw goal B
  const g=getGoal();
  ctx.save();
  const pulse=0.8+0.2*Math.sin(Date.now()/300);
  ctx.fillStyle='#ff4081';
  ctx.shadowColor='#ff4081';ctx.shadowBlur=20*pulse;
  ctx.beginPath();ctx.arc(g.x,g.y,GOAL_SIZE*pulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('B',g.x,g.y);
  ctx.restore();

  // Teleport target indicator
  if(role.ability==='teleport'&&state==='playing'){
    ctx.save();
    ctx.strokeStyle=role.color;ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(pointer.x/scale,pointer.y/scale,15,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Draw player
  ctx.save();
  if(teleFlash>0){
    ctx.shadowColor='#fff';ctx.shadowBlur=30;
  } else {
    ctx.shadowColor=role.color;ctx.shadowBlur=18;
  }
  ctx.fillStyle=role.color;
  ctx.beginPath();ctx.arc(px,py,PSIZE,0,Math.PI*2);ctx.fill();
  // emoji
  ctx.font=`${PSIZE}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowBlur=0;
  ctx.fillText(role.emoji,px,py);
  ctx.restore();

  // Dead flash
  if(state==='dead'){
    ctx.save();
    ctx.fillStyle=`rgba(255,0,0,${0.3*deadTimer/40})`;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // HUD
  drawHUD();
}

function drawRoleScreen(){
  // Dark overlay
  ctx.fillStyle='rgba(10,5,20,0.95)';
  ctx.fillRect(0,0,W,H);

  // Role card
  const cx=W/2,cy=H/2;
  ctx.save();
  ctx.fillStyle=role.color+'33';
  ctx.strokeStyle=role.color;
  ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(cx-200,cy-120,400,240,20);
  ctx.fill();ctx.stroke();

  // Emoji big
  ctx.font='72px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(role.emoji,cx,cy-50);

  // Name
  ctx.fillStyle=role.color;
  ctx.font='bold 32px sans-serif';
  ctx.fillText(role.name,cx,cy+20);

  // Desc
  ctx.fillStyle='#eee';
  ctx.font='18px sans-serif';
  ctx.fillText(role.desc,cx,cy+58);

  // Level
  ctx.fillStyle='#aaa';
  ctx.font='14px sans-serif';
  ctx.fillText(`שלב ${level+1} מתוך 10`,cx,cy+90);

  // Timer bar
  const barW=200,barH=8;
  const prog=roleTimer/200;
  ctx.fillStyle='#333';
  ctx.fillRect(cx-barW/2,cy+110,barW,barH);
  ctx.fillStyle=role.color;
  ctx.fillRect(cx-barW/2,cy+110,barW*prog,barH);

  ctx.restore();
}

function drawHUD(){
  // Lives
  ctx.save();
  ctx.font='22px sans-serif';
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?'#ff4444':'#333';
    ctx.fillText('❤',20+i*28,30);
  }
  // Score
  ctx.fillStyle='#fff';
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='right';
  ctx.fillText(`ניקוד: ${score}`,W-20,30);
  // Role badge
  ctx.fillStyle=role.color;
  ctx.font='14px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(`${role.emoji} ${role.name} — ${role.abDesc}`,W/2,30);
  ctx.restore();
}

function drawEndScreen(win){
  ctx.fillStyle='rgba(10,5,20,0.9)';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(win){
    ctx.fillStyle='#ffee58';
    ctx.font='bold 48px sans-serif';
    ctx.fillText('🎉 ניצחת!',W/2,H/2-40);
  } else {
    ctx.fillStyle='#ff4444';
    ctx.font='bold 48px sans-serif';
    ctx.fillText('משחק נגמר',W/2,H/2-40);
  }
  ctx.fillStyle='#fff';
  ctx.font='24px sans-serif';
  ctx.fillText(`ניקוד סופי: ${score}`,W/2,H/2+20);
  ctx.fillStyle='#aaa';
  ctx.font='18px sans-serif';
  ctx.fillText('הקש להתחיל מחדש',W/2,H/2+65);
  ctx.restore();
}

// Input
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){
    if(state==='playing') jump();
    if(state==='gameover'||state==='win') restartGame();
    if(state==='rolescreen'){roleTimer=0;}
  }
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// Touch/pointer
let rawPX=0,rawPY=0;
function getRaw(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left),y:(t.clientY-r.top)};
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=getRaw(e);
  rawPX=p.x;rawPY=p.y;
  pointer.x=p.x;pointer.y=p.y;pointer.down=true;

  if(state==='gameover'||state==='win'){restartGame();return;}
  if(state==='rolescreen'){roleTimer=0;return;}
  if(state!=='playing') return;

  // Double tap = teleport
  if(role.ability==='teleport'){
    const now=Date.now();
    if(now-dblTapTime<350){
      doTeleport(p.x/scale,p.y/scale);
      dblTapTime=0;return;
    }
    dblTapTime=now;
  }

  // Single tap upper half = jump
  if(p.y/scale<py){
    jump();
  }
});

c.addEventListener('pointermove',e=>{
  e.preventDefault();
  const p=getRaw(e);
  pointer.x=p.x;pointer.y=p.y;
});

c.addEventListener('pointerup',e=>{
  pointer.down=false;
});

function restartGame(){
  lives=3;score=0;level=0;
  pickRole();
  roleTimer=200;
  state='rolescreen';
}

// Game loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Init
pickRole();
roleTimer=200;
loop();
</script>
</body>
</html>
