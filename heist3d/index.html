*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;opacity:.85;text-shadow:0 0 4px #000}
#toolbar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;direction:ltr}
.tslot{width:56px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;gap:0}
.tslot span{font-size:10px;font-weight:800;opacity:.75}
.tslot.on{border-color:#ffd05a;background:rgba(255,208,80,.2);box-shadow:0 0 10px rgba(255,208,80,.4)}
#topcorner{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}
.hudpill{background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 14px;font-weight:900;font-size:16px;text-shadow:0 1px 3px #000}
#timer.urgent{color:#ff5555;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.4}}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;border:12px solid rgba(255,0,0,.7);opacity:0;transition:opacity .15s;border-radius:0}
#hit{position:fixed;inset:0;pointer-events:none;z-index:6;background:rgba(255,255,255,.18);opacity:0;transition:opacity .05s}
/* Viewmodel */
#vm{position:fixed;bottom:0;right:-10px;width:260px;height:220px;pointer-events:none;z-index:4}
#vmcv{width:100%;height:100%}
/* Overlays */
.ov{position:fixed;inset:0;background:rgba(5,10,5,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;overflow-y:auto}
.ov.show{display:flex}
.ovc{width:100%;max-width:420px;background:linear-gradient(160deg,#1e2e1e,#0e1a0e);border:2px solid rgba(100,220,100,.25);border-radius:28px;padding:24px;text-align:center;margin:auto}
.ovc h2{margin:0 0 8px;font-size:32px;color:#7fff88}
.lb{opacity:.85;font-size:14px;margin-bottom:8px;line-height:1.6}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;margin-top:10px;font:inherit;font-size:20px;font-weight:900;color:#0a1a0a;background:linear-gradient(180deg,#7fff88,#44cc55);box-shadow:0 5px 0 #1a6e22;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a6e22}
.btn.alt{background:transparent;color:#aaffaa;border:2px solid rgba(100,255,100,.3);box-shadow:none;font-size:15px;padding:11px}
/* Mobile controls */
#joy{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:14px;width:100px;height:100px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);display:none;touch-action:none;z-index:8}
#jknob{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#hitBtn{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));right:14px;width:72px;height:72px;border-radius:50%;border:2.5px solid rgba(255,200,50,.5);background:rgba(80,50,0,.55);color:#ffd05a;font-size:30px;display:none;touch-action:none;z-index:8;align-items:center;justify-content:center}
/* Click to lock */
#lockMsg{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:14px;padding:10px 22px;font-weight:800;font-size:16px;pointer-events:none;z-index:7;text-align:center;transition:opacity .3s}
#alarmbar{position:fixed;top:0;left:0;right:0;height:5px;background:transparent;z-index:9;transition:.4s}
</style>

  <div class="lb" style="font-size:12px;opacity:.65"><b>WASD</b> תנועה · <b>עכבר</b> הסתכלות · <b>לחיצה / E</b> שבירה · <b>1-2-3</b> כלי · <b>רווח</b> קפיצה</div>

<script src="../lib/three.min.js"></script>
<script>
'use strict';
/* ───── utils ───── */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;
function tone(f,d=.1,type='triangle',v=.07){try{_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,_ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+d+.02)}catch(e){}}
function chord(fs,d){fs.forEach((f,i)=>setTimeout(()=>tone(f,d,'sine',.05),i*70))}

/* ───── renderer ───── */
const rcv=$('#cv');
const R=new THREE.WebGLRenderer({canvas:rcv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(75,1,.05,200);
cam.position.set(0,1.6,0);
scene.add(cam);

function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ───── lighting ───── */
scene.fog=new THREE.Fog(0x87ceeb,.1,120);
scene.background=new THREE.Color(0x87ceeb);
const sun=new THREE.DirectionalLight(0xfff5dd,1.4);sun.position.set(50,80,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=200;
sun.shadow.camera.left=sun.shadow.camera.bottom=-80;sun.shadow.camera.right=sun.shadow.camera.top=80;
scene.add(sun);scene.add(new THREE.AmbientLight(0xaaccff,.55));
const hemi=new THREE.HemisphereLight(0x87ceeb,0x4a7a1a,.4);scene.add(hemi);

/* ───── block system ───── */
// Block types: 0=air,1=concrete,2=brick,3=plaster,4=vault,5=safe,6=floor/ground,7=glass,8=wood
const BLK_COLOR=[0,0x888888,0xcc8866,0xddcc99,0x556655,0xddaa00,0x447733,0xaaddff,0x8b6914];
const BLK_HP   =[0,       4,       3,       2,       7,       6,       0,       1,      3];
const BLK_EMIT =[0,0,0,0,0,1,0,0,0];
const BLK_SIZE=1;

const world=new Map(); // "x,y,z" -> {type,mesh,hp,maxHp}
function wKey(x,y,z){return x+','+y+','+z}

const matByType=[];
for(let i=1;i<=8;i++){
  const m=new THREE.MeshLambertMaterial({color:BLK_COLOR[i]});
  if(BLK_EMIT[i])m.emissive=new THREE.Color(BLK_COLOR[i]),m.emissiveIntensity=.3;
  matByType.push(m);
}
const geo=new THREE.BoxGeometry(.99,.99,.99);

function placeBlock(x,y,z,type){
  const k=wKey(x,y,z);
  if(world.has(k))return;
  const mesh=new THREE.Mesh(geo,matByType[type-1].clone());
  mesh.position.set(x+.5,y+.5,z+.5);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);
  world.set(k,{type,mesh,hp:BLK_HP[type],maxHp:BLK_HP[type]});
}

function removeBlock(x,y,z){
  const k=wKey(x,y,z);
  const b=world.get(k);if(!b)return;
  scene.remove(b.mesh);world.delete(k);
}

function hasBlock(x,y,z){return world.has(wKey(x,y,z))}
function getBlock(x,y,z){return world.get(wKey(x,y,z))}

/* ───── level building ───── */
function fillBox(x1,y1,z1,x2,y2,z2,type,hollow=false){
  for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++){
    if(hollow&&x>x1&&x<x2&&y>y1&&y<y2&&z>z1&&z<z2)continue;
    placeBlock(x,y,z,type);
  }
}

// Ground plane (infinite-ish green)
function mkGround(){
  const groundGeo=new THREE.PlaneGeometry(400,400);
  const groundMat=new THREE.MeshLambertMaterial({color:0x4a8a1a});
  const g=new THREE.Mesh(groundGeo,groundMat);g.rotation.x=-Math.PI/2;g.receiveShadow=true;
  scene.add(g);
  // Grass tufts for depth
  for(let i=0;i<80;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.6,1,.6),new THREE.MeshLambertMaterial({color:0x336622}));
    b.position.set((Math.random()-.5)*120,.5,(Math.random()-.5)*120);
    if(Math.abs(b.position.x)<20&&Math.abs(b.position.z)<25)continue;
    scene.add(b);
  }
  // Road
  const road=new THREE.Mesh(new THREE.PlaneGeometry(8,60),new THREE.MeshLambertMaterial({color:0x555566}));
  road.rotation.x=-Math.PI/2;road.position.y=.01;road.position.z=10;scene.add(road);
}

// Levels
const LEVELS=[
  // Level 1 – Small bank, 2 vaults
  ()=>{
    // Outer shell: 20x6x16 bank
    fillBox(-10,0,-14,9,0,-14,6); // floor strip for entry
    // Main building
    for(let x=-10;x<=9;x++)for(let z=-14;z<=-1;z++){
      if(z===0)continue;
      const isWall=x===-10||x===9||z===-14;
      const isCeil=false;
      if(isWall)placeBlock(x,0,z,1);
    }
    // Floor inside
    for(let x=-9;x<=8;x++)for(let z=-13;z<=-2;z++)placeBlock(x,-1,z,6);
    // Walls height 1-5
    for(let y=1;y<=5;y++){
      for(let x=-10;x<=9;x++){
        placeBlock(x,y,-14,1); // back
        if(y<=4){placeBlock(-10,y,-14+0,1);placeBlock(9,y,-14+0,1);} // already done
      }
      for(let z=-14;z<=-1;z++){
        placeBlock(-10,y,z,1); // left
        placeBlock(9,y,z,1);  // right
      }
      // Ceiling
      if(y===5)for(let x=-10;x<=9;x++)for(let z=-14;z<=-1;z++)placeBlock(x,y,z,1);
    }
    // Windows (remove blocks)
    for(let y=2;y<=4;y++)for(let x=-7;x<=-2;x++)removeBlock(x,y,-14);
    for(let y=2;y<=4;y++)for(let x=2;x<=7;x++)removeBlock(x,y,-14);
    for(let y=2;y<=3;y++){for(let z=-11;z>=-5;z--)removeBlock(-10,y,z);for(let z=-11;z>=-5;z--)removeBlock(9,y,z);}
    // Glass in windows
    for(let y=2;y<=4;y++)for(let x=-7;x<=-2;x++)placeBlock(x,y,-14,7);
    for(let y=2;y<=4;y++)for(let x=2;x<=7;x++)placeBlock(x,y,-14,7);
    // Entry (gap in front wall)
    for(let y=0;y<=2;y++)for(let x=-1;x<=0;x++){removeBlock(x,y,0);} // front door
    // Interior partition wall
    for(let x=-10;x<=-2;x++)for(let y=0;y<=4;y++)placeBlock(x,y,-7,2);
    for(let x=1;x<=9;x++)for(let y=0;y<=4;y++)placeBlock(x,y,-7,2);
    // Vault doors
    placeBlock(-1,0,-7,4);placeBlock(-1,1,-7,4);placeBlock(0,0,-7,4);placeBlock(0,1,-7,4);
    // Safes in vault room
    placeBlock(-7,0,-12,5);placeBlock(5,0,-12,5);placeBlock(-3,0,-12,5);placeBlock(2,0,-12,5);
    // Some wooden crates for cover
    placeBlock(-5,0,-3,8);placeBlock(4,0,-3,8);placeBlock(-5,1,-3,8);placeBlock(4,1,-3,8);
    // Guard spawns
    return {guards:[{x:3,z:-4},{x:-5,z:-10}],exit:{x:0,z:3},cashPerSafe:300,time:90,safeCount:4};
  },
  // Level 2 – Bigger, more rooms
  ()=>{
    // Floor
    for(let x=-14;x<=13;x++)for(let z=-20;z<=-1;z++)placeBlock(x,-1,z,6);
    // Outer walls 5 high
    for(let y=0;y<=5;y++){
      for(let x=-14;x<=13;x++){placeBlock(x,y,-20,1);if(y===5)placeBlock(x,y,-20,1);}
      for(let z=-20;z<=-1;z++){placeBlock(-14,y,z,1);placeBlock(13,y,z,1);}
      if(y===5)for(let x=-14;x<=13;x++)for(let z=-20;z<=-1;z++)placeBlock(x,y,z,1);
    }
    // Windows
    for(let y=2;y<=4;y++){for(let x=-11;x<=-4;x++)removeBlock(x,y,-20);for(let x=3;x<=10;x++)removeBlock(x,y,-20);}
    for(let y=2;y<=4;y++){for(let z=-15;z>=-7;z--){removeBlock(-14,y,z);removeBlock(13,y,z);}}
    for(let y=2;y<=4;y++){for(let x=-11;x<=-4;x++)placeBlock(x,y,-20,7);for(let x=3;x<=10;x++)placeBlock(x,y,-20,7);}
    // Entry
    for(let y=0;y<=2;y++)for(let x=-1;x<=0;x++)removeBlock(x,y,0);
    // Interior walls
    for(let x=-14;x<=-3;x++)for(let y=0;y<=4;y++)placeBlock(x,y,-10,2);
    for(let x=2;x<=13;x++)for(let y=0;y<=4;y++)placeBlock(x,y,-10,2);
    // Corridor partition
    for(let z=-10;z>=-1;z--)for(let y=0;y<=4;y++){placeBlock(-2,y,z,3);placeBlock(1,y,z,3);}
    for(let y=0;y<=2;y++){removeBlock(-2,y,-6);removeBlock(-2,y,-5);removeBlock(1,y,-6);removeBlock(1,y,-5);}
    // Vault wall
    for(let x=-14;x<=13;x++)for(let y=0;y<=4;y++)placeBlock(x,y,-16,1);
    // Vault doors
    for(let dy=0;dy<=1;dy++){placeBlock(-6,dy,-16,4);placeBlock(-5,dy,-16,4);placeBlock(4,dy,-16,4);placeBlock(5,dy,-16,4);}
    // Safes
    for(const [sx,sz] of[[-10,-19],[6,-19],[0,-19],[-4,-19],[4,-13],[-4,-13]])placeBlock(sx,0,sz,5);
    // Crates / cover
    for(const [cx,cz] of[[-8,-4],[6,-4],[-8,-13],[6,-13]])for(let dy=0;dy<=1;dy++)placeBlock(cx,dy,cz,8);
    return {guards:[{x:4,z:-4},{x:-8,z:-4},{x:0,z:-13},{x:7,z:-13}],exit:{x:0,z:3},cashPerSafe:400,time:100,safeCount:6};
  },
  // Level 3 – Big bank, maze layout
  ()=>{
    for(let x=-16;x<=15;x++)for(let z=-26;z<=-1;z++)placeBlock(x,-1,z,6);
    for(let y=0;y<=6;y++){
      for(let x=-16;x<=15;x++){placeBlock(x,y,-26,1);}
      for(let z=-26;z<=-1;z++){placeBlock(-16,y,z,1);placeBlock(15,y,z,1);}
      if(y===6)for(let x=-16;x<=15;x++)for(let z=-26;z<=-1;z++)placeBlock(x,y,z,1);
    }
    for(let y=2;y<=5;y++){for(let x=-13;x<=-5;x++)removeBlock(x,y,-26);for(let x=4;x<=12;x++)removeBlock(x,y,-26);}
    for(let y=2;y<=5;y++){for(let x=-13;x<=-5;x++)placeBlock(x,y,-26,7);for(let x=4;x<=12;x++)placeBlock(x,y,-26,7);}
    for(let y=0;y<=2;y++)for(let x=-1;x<=0;x++)removeBlock(x,y,0);
    // Corridor grid
    for(let x=-16;x<=-5;x++)for(let y=0;y<=5;y++)placeBlock(x,y,-10,2);
    for(let x=4;x<=15;x++)for(let y=0;y<=5;y++)placeBlock(x,y,-10,2);
    for(let z=-10;z>=-1;z--)for(let y=0;y<=5;y++){placeBlock(-4,y,z,2);placeBlock(3,y,z,2);}
    for(let y=0;y<=2;y++){removeBlock(-4,y,-6);removeBlock(-4,y,-5);removeBlock(3,y,-6);removeBlock(3,y,-5);}
    for(let x=-5;x<=4;x++)for(let y=0;y<=5;y++)placeBlock(x,y,-18,1);
    for(let x=-16;x<=15;x++)for(let y=0;y<=5;y++)placeBlock(x,y,-21,1);
    for(const [dy] of[[0],[1]]){
      for(const [sx] of[[-12],[-11],[9],[10]])placeBlock(sx,dy,-10,4);
      for(const [sx] of[[-3],[-2],[1],[2]])placeBlock(sx,dy,-18,4);
      for(const [sx] of[[-8],[-7],[5],[6]])placeBlock(sx,dy,-21,4);
    }
    for(const [sx,sz] of[[-12,-25],[8,-25],[0,-25],[-5,-25],[4,-25],[-12,-15],[8,-15],[0,-15]])placeBlock(sx,0,sz,5);
    for(const [cx,cz] of[[-10,-4],[7,-4],[-10,-15],[7,-15],[0,-9],[0,-20]])for(let dy=0;dy<=1;dy++)placeBlock(cx,dy,cz,8);
    return {guards:[{x:5,z:-4},{x:-9,z:-4},{x:0,z:-14},{x:8,z:-14},{x:-8,z:-23},{x:5,z:-23}],exit:{x:0,z:3},cashPerSafe:500,time:120,safeCount:8};
  }
];

/* ───── player ───── */
const player={
  px:0,py:1.6,pz:2,   // position (eye level)
  yaw:0,pitch:0,       // look angles
  vx:0,vy:0,vz:0,
  onGround:false,
  hp:3,
  cash:0,
  bombCount:3,
  inv:0               // invincibility frames
};
const PLAYER_H=1.7,PLAYER_R=.35;
const GRAVITY=.018,JUMP_V=.3,WALK_SPEED=.1,RUN_SPEED=.17;

/* ───── input ───── */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Digit1')selTool(0);if(e.code==='Digit2')selTool(1);if(e.code==='Digit3')selTool(2)});
addEventListener('keyup',e=>{keys[e.code]=0});

// Pointer lock
let locked=false,mouseDX=0,mouseDY=0;
document.addEventListener('pointerlockchange',()=>{locked=!!document.pointerLockElement;$('#lockMsg').style.opacity=locked?0:1});
document.addEventListener('mousemove',e=>{if(locked){mouseDX+=e.movementX;mouseDY+=e.movementY}});
rcv.addEventListener('click',()=>{if(!locked&&state==='play')rcv.requestPointerLock()});
rcv.addEventListener('mousedown',e=>{if(locked&&state==='play'&&e.button===0){startHit()}});
addEventListener('keydown',e=>{if(e.code==='KeyE'&&state==='play')startHit()});

// Touch / mobile
const isMobile=matchMedia('(pointer:coarse)').matches;
let joyAx=0,joyAy=0,joyId=null,joyOrigin=null;
let lookId=null,lookLast=null;
if(isMobile){
  $('#joy').style.display='block';
  $('#hitBtn').style.display='flex';
  $('#lockMsg').style.opacity=0;
  const joy=$('#joy'),knob=$('#jknob');
  joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyOrigin={x:e.clientX,y:e.clientY};joy.setPointerCapture(e.pointerId)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId!==joyId||!joyOrigin)return;const dx=e.clientX-joyOrigin.x,dy=e.clientY-joyOrigin.y;const r=Math.min(30,Math.hypot(dx,dy));const a=Math.atan2(dy,dx);joyAx=Math.cos(a)*r/30;joyAy=Math.sin(a)*r/30;knob.style.left=(50+joyAx*34)+'%';knob.style.top=(50+joyAy*34)+'%'});
  function resetJoy(){joyAx=joyAy=0;joyId=null;joyOrigin=null;$('#jknob').style.left=$('#jknob').style.top='50%'}
  joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
  // Right-side look drag
  rcv.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth/2)return;lookId=e.pointerId;lookLast={x:e.clientX,y:e.clientY}});
  rcv.addEventListener('pointermove',e=>{if(e.pointerId!==lookId||!lookLast)return;mouseDX+=e.clientX-lookLast.x;mouseDY+=e.clientY-lookLast.y;lookLast={x:e.clientX,y:e.clientY}});
  rcv.addEventListener('pointerup',e=>{if(e.pointerId===lookId){lookId=null;lookLast=null}});
  rcv.addEventListener('pointercancel',e=>{if(e.pointerId===lookId){lookId=null;lookLast=null}});
  $('#hitBtn').addEventListener('pointerdown',startHit);
}

/* ───── tool ───── */
let toolIdx=0;
const TOOL_IDS=['t0','t1','t2'];
function selTool(i){toolIdx=i;TOOL_IDS.forEach((id,j)=>$(('#'+id)).classList.toggle('on',j===i));tone([440,620,820][i],.05,'sine',.04)}

/* ───── viewmodel (hammer in hand) ───── */
const vmcv=$('#vmcv'),vmx=vmcv.getContext('2d');
let vmSwing=0,vmSwingV=0;
function startHit(){if(state!=='play')return;vmSwingV=1;doHit()}
function drawVM(){
  vmx.clearRect(0,0,260,220);
  vmSwingV*=.8;vmSwing=vmSwing*.7+vmSwingV*.3;
  const sx=130+vmSwing*18,sy=160-vmSwing*30;
  const icons=['🔨','⚙️','💣'];
  if(toolIdx===2&&player.bombCount<=0){vmx.fillStyle='rgba(255,255,255,.4)';vmx.font='900 14px system-ui';vmx.textAlign='center';vmx.fillText('אין פצצות',130,200);return}
  vmx.save();vmx.translate(sx,sy);vmx.rotate((-0.3+vmSwing*.5)*Math.PI/2);
  // Draw tool body
  vmx.fillStyle=toolIdx===0?'#885522':toolIdx===1?'#666':' #222';
  vmx.fillRect(-8,0,16,55); // handle
  vmx.fillStyle=toolIdx===0?'#888':toolIdx===1?'#aaa':'#333';
  if(toolIdx===0){vmx.fillRect(-18,-22,36,24);} // hammer head
  else if(toolIdx===1){for(let i=0;i<6;i++){vmx.fillRect(-3-i*.5,-6-i*7,6+i,6);}} // drill bits
  else{vmx.beginPath();vmx.arc(0,-15,15,0,Math.PI*2);vmx.fill();vmx.fillStyle='#555';vmx.fillRect(-3,-12,6,20);} // bomb
  vmx.restore();
}

/* ───── hit / destroy ───── */
const REACH=4.5;
let hitCooldown=0;
function doHit(){
  if(hitCooldown>0)return;
  // Raycast from camera center
  const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
  const origin=new THREE.Vector3(player.px,player.py,player.pz);
  // Step along ray
  for(let t=0.3;t<=REACH;t+=0.25){
    const x=Math.floor(origin.x+dir.x*t);
    const y=Math.floor(origin.y+dir.y*t);
    const z=Math.floor(origin.z+dir.z*t);
    const b=getBlock(x,y,z);
    if(b&&b.type!==6){// hit something (not indestructible floor)
      hitBlock(x,y,z,b);
      // Flash
      $('#hit').style.opacity=.3;setTimeout(()=>$('#hit').style.opacity=0,80);
      break;
    }
  }
  hitCooldown=toolIdx===1?10:toolIdx===0?14:0;
  if(toolIdx===2){// bomb
    if(player.bombCount<=0){tone(100,.1,'square',.05);return}
    player.bombCount--;
    updateBombCount();
    // Plant bomb at feet+1
    plantBomb(Math.floor(player.px),Math.floor(player.py-1),Math.floor(player.pz-1));
    hitCooldown=60;tone(300,.1,'sine',.06);
  }
}

function hitBlock(x,y,z,b){
  if(b.type===6)return;// indestructible
  const dmg=toolIdx===1?2:1;
  b.hp-=dmg;
  // Tint to show damage
  const frac=Math.max(0,b.hp/b.maxHp);
  const base=BLK_COLOR[b.type];
  b.mesh.material.color.setHex(base).multiplyScalar(.4+frac*.6);
  tone(200+b.hp*40,.06,'square',.06);
  // Dust particles
  dustAt(x+.5,y+.5,z+.5,b.type);
  if(b.hp<=0){
    if(b.type===5)openSafe(x,y,z);// safe drops cash
    removeBlock(x,y,z);
    tone(150,.15,'sawtooth',.08);
  }
}

/* ───── particles ───── */
const parts=[];
function dustAt(px,py,pz,type){
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.15,.15,.15),new THREE.MeshBasicMaterial({color:BLK_COLOR[type]}));
    m.position.set(px,py,pz);scene.add(m);
    const a=Math.random()*Math.PI*2,el=(Math.random()-.5)*Math.PI;
    const sp=.05+Math.random()*.12;
    parts.push({m,vx:Math.cos(a)*Math.cos(el)*sp,vy:Math.sin(el)*sp+.04,vz:Math.sin(a)*Math.cos(el)*sp,life:25,maxL:25});
  }
}
function stepParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=.9;p.vz*=.9;p.vy-=.008;p.m.position.x+=p.vx;p.m.position.y+=p.vy;p.m.position.z+=p.vz;p.life--;if(p.life<=0){scene.remove(p.m);parts.splice(i,1)}}}

/* ───── safe & cash ───── */
let cashObjects=[];
function openSafe(x,y,z){
  tone(880,.1,'sine',.07);setTimeout(()=>tone(1100,.1,'sine',.06),80);setTimeout(()=>tone(1320,.15,'sine',.07),160);
  // Spray cash bundles
  for(let i=0;i<4;i++){
    const cm=new THREE.Mesh(new THREE.BoxGeometry(.4,.25,.4),new THREE.MeshLambertMaterial({color:0x22ee66,emissive:new THREE.Color(0x115533),emissiveIntensity:.4}));
    const a=i*Math.PI/2+.3;cm.position.set(x+.5+Math.cos(a)*.8,y+.5,z+.5+Math.sin(a)*.8);
    scene.add(cm);cashObjects.push({m:cm,x:x+.5+Math.cos(a)*.8,z:z+.5+Math.sin(a)*.8,bob:i,val:Math.floor(currentLvlData.cashPerSafe/4)});
  }
  dustAt(x+.5,y+.5,z+.5,5);
}
function pickupCash(){for(let i=cashObjects.length-1;i>=0;i--){const c=cashObjects[i];if(Math.hypot(player.px-c.x,player.pz-c.z)<1.3){player.cash+=c.val;scene.remove(c.m);cashObjects.splice(i,1);$('#cash').textContent='💰 '+player.cash;tone(600,.05,'sine',.05)}}}
function updateBombCount(){$('#t2').querySelector('b').textContent=player.bombCount}

/* ───── bombs ───── */
const activeBombs=[];
function plantBomb(x,y,z){
  const bm=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),new THREE.MeshLambertMaterial({color:0x222222,emissive:new THREE.Color(0xff4400),emissiveIntensity:.5}));
  bm.position.set(x+.5,y+.5,z+.5);scene.add(bm);
  activeBombs.push({m:bm,x,y,z,timer:180});
}
function stepBombs(){for(let i=activeBombs.length-1;i>=0;i--){const b=activeBombs[i];b.timer--;b.m.material.emissiveIntensity=.5+Math.sin(b.timer*.3)*.4;if(b.timer<=0){// BOOM
  scene.remove(b.m);activeBombs.splice(i,1);
  tone(80,.5,'sawtooth',.12);
  dustAt(b.x+.5,b.y+.5,b.z+.5,1);dustAt(b.x+.5,b.y+.5,b.z+.5,2);
  for(let dx=-2;dx<=2;dx++)for(let dy=-1;dy<=2;dy++)for(let dz=-2;dz<=2;dz++){
    const bb=getBlock(b.x+dx,b.y+dy,b.z+dz);
    if(bb&&bb.type!==6){if(bb.type===5)openSafe(b.x+dx,b.y+dy,b.z+dz);removeBlock(b.x+dx,b.y+dy,b.z+dz);}}
  // Hurt player if close
  if(Math.hypot(player.px-(b.x+.5),player.py-(b.y+.5),player.pz-(b.z+.5))<3)hurtPlayer();
}}}

/* ───── guards ───── */
let guards=[];
const guardGeos=[new THREE.BoxGeometry(.6,1,.5),new THREE.BoxGeometry(.55,.55,.55),new THREE.BoxGeometry(.7,.2,.7)];
const guardMats=[new THREE.MeshLambertMaterial({color:0x2255cc}),new THREE.MeshLambertMaterial({color:0xffbb88}),new THREE.MeshLambertMaterial({color:0xdd2222})];
function mkGuard(x,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(guardGeos[0],guardMats[0].clone());body.position.y=.6;g.add(body);
  const head=new THREE.Mesh(guardGeos[1],guardMats[1].clone());head.position.y=1.4;g.add(head);
  const hat=new THREE.Mesh(guardGeos[2],guardMats[2].clone());hat.position.y=1.72;g.add(hat);
  g.castShadow=true;scene.add(g);
  const a=Math.random()*Math.PI*2;
  return{g,x,z,a:0,state:'patrol',patA:x,patB:x+(Math.random()-.5)*10,patZ:z,patT:0,speed:.04+level*.007,alertTimer:0,cd:0};
}
function guardSees(gd){const dx=player.px-gd.x,dz=player.pz-gd.z;const dist=Math.hypot(dx,dz);if(dist>7)return false;const steps=Math.ceil(dist/.4);for(let s=1;s<steps;s++){const t=s/steps;if(hasBlock(Math.floor(gd.x+dx*t),Math.floor(player.py-.5),Math.floor(gd.z+dz*t)))return false;}return true}
function stepGuard(gd){gd.cd=Math.max(0,gd.cd-1);gd.patT++;
  if(gd.state==='patrol'){const tx=(gd.patT%300<150)?gd.patA:gd.patB,tz=gd.patZ;const dx=tx-gd.x,dz=tz-gd.z;const d=Math.hypot(dx,dz);if(d>.4){moveEntity(gd,dx/d*gd.speed,dz/d*gd.speed,.3);gd.a=Math.atan2(dx,dz)}if(guardSees(gd)){gd.state='chase';gd.alertTimer=0;tone(880,.08,'sine',.04);alarm=Math.min(100,alarm+8)}}
  else{gd.alertTimer++;alarm=Math.min(100,alarm+.4);const dx=player.px-gd.x,dz=player.pz-gd.z;const d=Math.hypot(dx,dz);if(d>.5){moveEntity(gd,dx/d*gd.speed*1.7,dz/d*gd.speed*1.7,.3);gd.a=Math.atan2(dx,dz)}
  if(d<1&&player.inv<=0){hurtPlayer();gd.state='patrol';gd.alertTimer=0}
  if(!guardSees(gd)){gd.alertTimer++;if(gd.alertTimer>80){gd.state='patrol';gd.alertTimer=0}}}
  gd.g.position.set(gd.x,0,gd.z);gd.g.rotation.y=gd.a;
  // Bobbing walk
  gd.g.position.y=Math.abs(Math.sin(gd.patT*.15))*.06;
}
function moveEntity(e,dx,dz,r){const nx=e.x+dx,nz=e.z+dz;if(!hasBlock(Math.floor(nx),0,Math.floor(e.z))&&!hasBlock(Math.floor(nx),1,Math.floor(e.z)))e.x=nx;if(!hasBlock(Math.floor(e.x),0,Math.floor(nz))&&!hasBlock(Math.floor(e.x),1,Math.floor(nz)))e.z=nz;}

/* ───── player movement ───── */
function movePlayer(){
  // Look
  const sens=isMobile?.003:.0025;
  player.yaw-=mouseDX*sens;
  player.pitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,player.pitch-mouseDY*sens));
  mouseDX=0;mouseDY=0;
  cam.rotation.order='YXZ';cam.rotation.y=player.yaw;cam.rotation.x=player.pitch;

  // Move
  const sp=(keys.ShiftLeft||keys.ShiftRight)?RUN_SPEED:WALK_SPEED;
  let fx=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  let fz=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
  if(isMobile){fx+=joyAx;fz+=joyAy}
  const fl=Math.hypot(fx,fz);if(fl>0){fx/=fl;fz/=fl}
  // Apply yaw to movement
  const cy=Math.cos(player.yaw),sy=Math.sin(player.yaw);
  player.vx=(fx*cy-fz*sy)*sp;
  player.vz=(fx*sy+fz*cy)*sp;
  // Gravity
  player.vy-=GRAVITY;
  // Jump
  if((keys.Space)&&player.onGround){player.vy=JUMP_V;player.onGround=false;tone(300,.05,'sine',.04)}
  // Collide & move
  const nx=player.px+player.vx,ny=player.py+player.vy,nz=player.pz+player.vz;
  player.onGround=false;
  // Floor check
  if(ny<1.6){player.py=1.6;player.vy=0;player.onGround=true}else player.py=ny;
  // Block collision (simple AABB)
  const bx=Math.floor(nx),by=Math.floor(player.py-1),bz=Math.floor(player.pz);
  if(!hasBlock(bx,by,bz)&&!hasBlock(bx,by+1,bz))player.px=nx;
  const bx2=Math.floor(player.px),bz2=Math.floor(nz);
  if(!hasBlock(bx2,by,bz2)&&!hasBlock(bx2,by+1,bz2))player.pz=nz;
  // Ground on block tops
  const floorY=Math.floor(player.py-.01);
  if(hasBlock(Math.floor(player.px),floorY,Math.floor(player.pz))){player.py=floorY+1+1.6;player.vy=0;player.onGround=true}
  cam.position.set(player.px,player.py,player.pz);
  if(player.inv>0)player.inv--;
}

/* ───── hurt ───── */
function hurtPlayer(){player.hp--;player.inv=80;$('#dmg').style.opacity=.6;setTimeout(()=>$('#dmg').style.opacity=0,200);tone(100,.3,'sawtooth',.1);$('#hearts').textContent='❤️'.repeat(Math.max(0,player.hp))+'🖤'.repeat(Math.max(0,3-player.hp));if(player.hp<=0)gameOver()}

/* ───── alarm ───── */
let alarm=0;
function updateAlarm(){if(alarm>0&&!guards.some(g=>g.state==='chase'))alarm=Math.max(0,alarm-.1);const pct=alarm/100;$('#alarmbar').style.background=alarm>0?`linear-gradient(90deg,hsl(${10+pct*20},100%,50%),hsl(${40-pct*30},100%,60%))`:'';}

/* ───── timer ───── */
let timeLeft=90,lastSecFrame=0,gameFrame=0;
function updateTimer(){const sec=Math.floor(gameFrame/60);if(sec!==lastSecFrame){lastSecFrame=sec;timeLeft=Math.max(0,currentLvlData.time-sec);$('#timer').textContent='⏱ '+timeLeft;$('#timer').classList.toggle('urgent',timeLeft<=15);if(timeLeft===0)gameOver()}}

/* ───── exit ───── */
let exitMesh=null;
function mkExit(ex){if(exitMesh)scene.remove(exitMesh);const em=new THREE.Mesh(new THREE.BoxGeometry(2,3,.2),new THREE.MeshLambertMaterial({color:0xffd05a,emissive:new THREE.Color(0xffd05a),emissiveIntensity:.5}));em.position.set(ex.x+.5,1.5,ex.z+.5);scene.add(em);exitMesh=em}
function checkExit(){if(!currentLvlData)return;const ex=currentLvlData.exit;if(Math.hypot(player.px-ex.x,player.pz-ex.z)<2&&cashObjects.length===0&&player.cash>0)levelClear()}

/* ───── state machine ───── */
let state='menu',level=1,currentLvlData=null;
const BEST_KEY='heist3d_best';
let best=+store.get(BEST_KEY,0);$('#best').textContent=best;

function startLevel(lvl){
  level=lvl;
  // Clear world
  for(const[k,b]of world)scene.remove(b.mesh);world.clear();
  for(const p of parts)scene.remove(p.m);parts.length=0;
  for(const b of activeBombs)scene.remove(b.m);activeBombs.length=0;
  for(const c of cashObjects)scene.remove(c.m);cashObjects.length=0;
  for(const g of guards)scene.remove(g.g);guards.length=0;
  if(exitMesh)scene.remove(exitMesh);exitMesh=null;
  mkGround();
  currentLvlData=LEVELS[lvl-1]();
  guards=currentLvlData.guards.map(gd=>mkGuard(gd.x,gd.z));
  mkExit(currentLvlData.exit);
  player.px=0;player.py=1.6;player.pz=2;player.vx=player.vy=player.vz=0;player.hp=3;player.cash=0;player.inv=0;player.bombCount=3;
  player.yaw=Math.PI;player.pitch=0;
  toolIdx=0;selTool(0);
  alarm=0;gameFrame=0;lastSecFrame=0;timeLeft=currentLvlData.time;hitCooldown=0;
  if(!isMobile&&state!=='play')rcv.requestPointerLock().catch(()=>{});
  state='play';
  $('#hearts').textContent='❤️❤️❤️';
  $('#cash').textContent='💰 0';
  $('#timer').textContent='⏱ '+currentLvlData.time;
  $('#timer').classList.remove('urgent');
  updateBombCount();
}

function gameOver(){state='over';if(locked)document.exitPointerLock();$('#ovS').textContent='💰 '+player.cash;$('#ovM').textContent='שלב '+level;if(player.cash>best){best=player.cash;store.set(BEST_KEY,best);$('#best').textContent=best}if(window.AG&&player.cash>0)AG.add(Math.floor(player.cash/60),0);$('#over').classList.add('show')}
function levelClear(){state='clear';if(locked)document.exitPointerLock();chord([880,1100,1320,1760],.5);const earn=Math.floor(player.cash/50)+(level>1?1:0);const dia=level>=3&&alarm<20?1:0;if(player.cash>best){best=player.cash;store.set(BEST_KEY,best);$('#best').textContent=best}if(window.AG&&earn>0)AG.add(earn,dia);$('#clT').textContent=level>=3?'🏆 כל הבנקים!':'✅ שלב '+level+' הושלם!';$('#clS').textContent='💰 '+player.cash;$('#clM').textContent='שומרים: '+(alarm<20?'🕵️ חרישי +💎':alarm<50?'הסתבכת קצת':'🚨 היה רעש')+' · +'+earn+' 🪙'+(dia?' +1 💎':'');$('#clear').classList.add('show')}

/* ───── main loop ───── */
function step(){
  if(state!=='play')return;
  gameFrame++;
  if(hitCooldown>0)hitCooldown--;
  movePlayer();
  guards.forEach(stepGuard);
  stepParts();stepBombs();
  pickupCash();checkExit();updateAlarm();updateTimer();
  // Cash bob
  cashObjects.forEach(c=>{c.bob+=.07;c.m.position.y=.5+Math.sin(c.bob)*.12;c.m.rotation.y+=.03});
  // Guard bobbing already in stepGuard
  drawVM();
  R.render(scene,cam);
}

// Menu buttons
$('#go1').onclick=()=>{$('#menu').classList.remove('show');startLevel(1)};
$('#go2').onclick=()=>{$('#menu').classList.remove('show');startLevel(2)};
$('#go3').onclick=()=>{$('#menu').classList.remove('show');startLevel(3)};
$('#retry').onclick=()=>{$('#over').classList.remove('show');startLevel(level)};
$('#ovMenu').onclick=()=>{$('#over').classList.remove('show');state='menu';$('#menu').classList.add('show')};
$('#nextBtn').onclick=()=>{$('#clear').classList.remove('show');if(level<3)startLevel(level+1);else{state='menu';$('#menu').classList.add('show')}};
$('#clMenu').onclick=()=>{$('#clear').classList.remove('show');state='menu';$('#menu').classList.add('show')};

// Initial render
R.render(scene,cam);
function loop(){requestAnimationFrame(loop);step()}
loop();
</script>
