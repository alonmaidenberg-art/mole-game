<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🐛</div><h2>נחש נגד תולעים</h2><div class="lb">הזיזו את האצבע/העכבר לכיוון שרוצים לנוע. אכלו נקודות אור כדי לגדול. אם הראש שלכם פוגע בגוף של תולעת אחרת – אתם נופלים! לחצו על ⚡ (או רווח) כדי להאיץ. אפשר גם עם החצים.</div><div class="chips" id="lv"><button class="chip" data-v="1">קל</button><button class="chip on" data-v="2">רגיל</button><button class="chip" data-v="3">קשה</button></div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='wormio'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let hits=[],on=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function B(x,y,w,h,col,txt,fn,fs=22,tc='#fff'){ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill();if(txt!=null){ctx.fillStyle=tc;ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+w/2,y+h/2+1)}if(fn)hits.push({x,y,w,h,fn})}
function T(t,x,y,fs=22,c='#fff',al='center'){ctx.fillStyle=c;ctx.font='bold '+fs+'px system-ui';ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);break}}});
function run(upd,drw,bg){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(on)upd()}hits=[];ctx.fillStyle=bg||'#111';ctx.fillRect(0,0,W,H);if(on||window.__show)drw()}requestAnimationFrame(l)}
function wire(start){$('#go').onclick=()=>{$('#menu').classList.remove('show');start();on=true};$('#again').onclick=()=>{$('#end').classList.remove('show');start();on=true};$('#menu2').onclick=()=>{on=false;$('#end').classList.remove('show');$('#menu').classList.add('show')}}
function over(title,score,msg,coins,dia,delay=600){on=false;window.__show=true;saveBest(score);setTimeout(()=>endGame(title,score,msg,coins,dia),delay)}

const WW=3200,WH=2400;
let lvl=2;[...$('#lv').children].forEach(b=>b.onclick=()=>{[...$('#lv').children].forEach(k=>k.classList.toggle('on',k===b));lvl=+b.dataset.v});
const NAMES=['דבורי','פיקל','נחשוש','זיגזג','ברק','לולי','טורבו','קיפוד','גמבו','שחור','פיצי','ירוק','סליים','בוסי','רוני','מיקי'];
const SK=[[20,60],[200,60],[300,70],[40,70],[170,65],[260,60],[0,70],[100,60],[330,60],[60,80]];
let worms,orbs,me,cam,fr,kills,boostP=false,ang0=null,prs={},ptrSteer=null,keysA=0,sbest=0;
const hsl=(h,s,l,a)=>`hsla(${h},${s}%,${l}%,${a===undefined?1:a})`;
function mk(ai,i){const sk=ai?SK[i%SK.length]:[130,70];const w={ai,x:rnd(300,WW-300),y:rnd(300,WH-300),a:rnd(0,6.28),ta:0,len:ai?rnd(12,40):12,gr:0,seg:[],h:sk[0],s:sk[1],name:ai?NAMES[i%NAMES.length]:'אתה',boost:false,dead:false,sk:rnd(.5,1.2),tt:0,sc:0};w.ta=w.a;w.seg=[];const D=5;for(let k=0;k<Math.floor(w.len);k++)w.seg.push({x:w.x-Math.cos(w.a)*k*D,y:w.y-Math.sin(w.a)*k*D});return w}
const rad=w=>7+Math.min(14,Math.sqrt(w.len)*.95);
function orb(x,y,v,c){orbs.push({x,y,v:v||1,h:c===undefined?rnd(0,360):c,r:v>2?7:rnd(3,5)})}
function start(){worms=[];orbs=[];kills=0;fr=0;boostP=false;me=mk(false);me.x=WW/2;me.y=WH/2;me.a=me.ta=0;me.seg=[];for(let k=0;k<12;k++)me.seg.push({x:me.x-k*5,y:me.y});worms.push(me);const n=[0,7,10,14][lvl];for(let i=0;i<n;i++){const w=mk(true,i);if(Math.hypot(w.x-me.x,w.y-me.y)<500){w.x=rnd(300,WW-300);w.y=WH-200}w.seg=[];for(let k=0;k<Math.floor(w.len);k++)w.seg.push({x:w.x-Math.cos(w.a)*k*5,y:w.y-Math.sin(w.a)*k*5});worms.push(w)}
 for(let i=0;i<520;i++)orb(rnd(30,WW-30),rnd(30,WH-30));cam={x:me.x,y:me.y,z:1}}
function kill(w,by){if(w.dead)return;w.dead=true;if(by&&by===me)kills++;const m=Math.max(1,Math.floor(w.seg.length/3));for(let i=0;i<w.seg.length;i+=3)orb(w.seg[i].x+rnd(-8,8),w.seg[i].y+rnd(-8,8),2.5,w.h);tone(w===me?150:520,.2,'sawtooth',.08);
 if(w===me){over('נאכלת! 🐛',Math.floor(me.len*5),'אורך סופי: '+Math.floor(me.len)+' · הפלת '+kills+' תולעים',Math.min(70,Math.floor(me.len/5)+kills*4),me.len>180?1:0,900)}else{const i=worms.indexOf(w);const n=mk(true,Math.floor(rnd(0,99)));let tries=0;do{n.x=rnd(300,WW-300);n.y=rnd(300,WH-300);tries++}while(Math.hypot(n.x-me.x,n.y-me.y)<700&&tries<20);n.seg=[];for(let k=0;k<Math.floor(n.len);k++)n.seg.push({x:n.x-Math.cos(n.a)*k*5,y:n.y-Math.sin(n.a)*k*5});worms[i]=n}}
function danger(w,ax,ay,r){for(const o of worms){if(o===w||o.dead)continue;const ro=rad(o);for(let i=0;i<o.seg.length;i+=2){if(Math.hypot(o.seg[i].x-ax,o.seg[i].y-ay)<ro+r+14)return true}}return false}
function think(w){const sp=[0,.04,.06,.085][lvl];w.tt++;const r=rad(w);let best=null,bd=1e9;
 if(w.tt%8===0||!w.tg){w.tg=null;for(const o of orbs){const d=(o.x-w.x)**2+(o.y-w.y)**2;if(d<bd&&d<(280+lvl*60)**2){bd=d;best=o}}if(best)w.tg=best;else if(w.tt%90===0)w.ta=rnd(0,6.28)}
 let want=w.tg?Math.atan2(w.tg.y-w.y,w.tg.x-w.x):w.ta;
 const mg=140;if(w.x<mg)want=0;if(w.x>WW-mg)want=Math.PI;if(w.y<mg)want=Math.PI/2;if(w.y>WH-mg)want=-Math.PI/2;
 for(const da of [0,.5,-.5,1,-1,1.6,-1.6]){const aa=w.a+da,ax=w.x+Math.cos(aa)*(r*2+30),ay=w.y+Math.sin(aa)*(r*2+30);if(!danger(w,ax,ay,r)){if(da!==0&&danger(w,w.x+Math.cos(w.a)*(r*2+30),w.y+Math.sin(w.a)*(r*2+30),r))want=aa;break}}
 let d=want-w.a;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;w.a+=clamp(d,-sp*1.6,sp*1.6);
 w.boost=lvl>1&&w.len>30&&!!w.tg&&Math.random()<.002}
function stepW(w){const r=rad(w);let sp=2.35+(w===me?0:[0,-.35,-.1,.1][lvl]);let b=w===me?boostP&&w.len>12:w.boost;if(b){sp*=1.75;w.len-=.05;w.gr-=.05;if(fr%6===0){const t=w.seg[w.seg.length-1];if(t)orb(t.x,t.y,1,w.h)}}
 w.x+=Math.cos(w.a)*sp;w.y+=Math.sin(w.a)*sp;w.x=clamp(w.x,r,WW-r);w.y=clamp(w.y,r,WH-r);
 const want=Math.floor(w.len);while(w.seg.length<want)w.seg.push({...w.seg[w.seg.length-1]});while(w.seg.length>want)w.seg.pop();
 const D=Math.max(4,r*.5);let px=w.x,py=w.y;for(const s of w.seg){const dx=s.x-px,dy=s.y-py,d=Math.hypot(dx,dy)||1;if(d>D){s.x=px+dx/d*D;s.y=py+dy/d*D}px=s.x;py=s.y}
 for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];if((o.x-w.x)**2+(o.y-w.y)**2<(r+o.r+10)**2){w.len+=o.v*.28;orbs.splice(i,1);if(w===me&&fr%3===0)tone(700+Math.random()*300,.03,'sine',.03)}}
 w.sc=Math.floor(w.len*5)}
function upd(){fr++;
 // player steering
 if(ptrSteer){const dx=ptrSteer.x-W/2,dy=ptrSteer.y-H/2;if(Math.hypot(dx,dy)>12)me.ta=Math.atan2(dy,dx)}
 if(keysA){me.ta=me.a+keysA*.12}
 let d=me.ta-me.a;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;me.a+=clamp(d,-.085,.085);
 if(keys.Space||keys.ShiftLeft||keys.ShiftRight)boostP=true;else if(!prs.boost)boostP=false;
 for(const w of worms){if(w.ai)think(w)}
 for(const w of worms)stepW(w);
 // collisions: head of a vs body of b
 for(const a of worms){if(a.dead)continue;const ra=rad(a);for(const b of worms){if(b===a||b.dead)continue;const rb=rad(b);let hit=false;
   if(Math.hypot(a.x-b.x,a.y-b.y)<(ra+rb)*.75&&a.len<b.len*0.0)hit=true;
   for(let i=1;i<b.seg.length&&!hit;i+=1){const s=b.seg[i];if((s.x-a.x)**2+(s.y-a.y)**2<((ra+rb)*.72)**2)hit=true}
   if(hit){kill(a,b);break}}}
 if(me.dead)return;
 while(orbs.length<520)orb(rnd(30,WW-30),rnd(30,WH-30));
 const z=1-Math.min(.4,(me.len-12)/700);cam.z+=(z-cam.z)*.03;cam.x+=(me.x-cam.x)*.18;cam.y+=(me.y-cam.y)*.18}
function drawWorm(w){const r=rad(w),n=w.seg.length;
 for(let i=n-1;i>=0;i--){const s=w.seg[i];if(s.x<cam.x-W/cam.z/2-30||s.x>cam.x+W/cam.z/2+30||s.y<cam.y-H/cam.z/2-30||s.y>cam.y+H/cam.z/2+30)continue;const t=1-i/n*.25;const rr2=r*(.7+.3*t);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(s.x+3,s.y+5,rr2,0,7);ctx.fill();
  const l=(Math.floor(i/3)%2?46:54);const g=ctx.createRadialGradient(s.x-rr2*.3,s.y-rr2*.35,rr2*.1,s.x,s.y,rr2);g.addColorStop(0,hsl(w.h,w.s,l+22));g.addColorStop(1,hsl(w.h+12,w.s+10,l-8));ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,rr2,0,7);ctx.fill()}
 const b=(w===me?boostP&&w.len>12:w.boost);if(b){ctx.strokeStyle=hsl(w.h,90,70,.5);ctx.lineWidth=4;ctx.beginPath();ctx.arc(w.x,w.y,r+6+Math.sin(fr*.4)*2,0,7);ctx.stroke()}
 const g=ctx.createRadialGradient(w.x-r*.3,w.y-r*.35,r*.1,w.x,w.y,r*1.05);g.addColorStop(0,hsl(w.h,w.s,78));g.addColorStop(1,hsl(w.h+12,w.s+10,48));ctx.fillStyle=g;ctx.beginPath();ctx.arc(w.x,w.y,r*1.05,0,7);ctx.fill();
 for(const sd of[-1,1]){const ex=w.x+Math.cos(w.a)*r*.45+Math.cos(w.a+1.57*sd)*r*.5,ey=w.y+Math.sin(w.a)*r*.45+Math.sin(w.a+1.57*sd)*r*.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*.36,0,7);ctx.fill();ctx.fillStyle='#10204a';ctx.beginPath();ctx.arc(ex+Math.cos(w.a)*r*.12,ey+Math.sin(w.a)*r*.12,r*.19,0,7);ctx.fill()}
 ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.9)';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=3;ctx.strokeText(w.name,w.x,w.y-r-12);ctx.fillText(w.name,w.x,w.y-r-12)}
function drw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a7bd0');g.addColorStop(1,'#0b4a95');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
 const vx0=cam.x-W/cam.z/2,vy0=cam.y-H/cam.z/2,vx1=cam.x+W/cam.z/2,vy1=cam.y+H/cam.z/2;
 ctx.fillStyle='#14396e';ctx.fillRect(0,0,WW,WH);ctx.fillStyle='rgba(255,255,255,.05)';
 for(let x=Math.floor(vx0/80)*80;x<vx1;x+=80)for(let y=Math.floor(vy0/80)*80;y<vy1;y+=80){const o=((y/80)&1)*40;ctx.beginPath();ctx.arc(x+o,y,18,0,7);ctx.fill()}
 ctx.strokeStyle='rgba(120,210,255,.9)';ctx.lineWidth=10;ctx.strokeRect(0,0,WW,WH);
 for(const o of orbs){if(o.x<vx0-10||o.x>vx1+10||o.y<vy0-10||o.y>vy1+10)continue;const pu=1+Math.sin(fr*.1+o.x)*.12;ctx.fillStyle=hsl(o.h,90,60,.25);ctx.beginPath();ctx.arc(o.x,o.y,o.r*2.2*pu,0,7);ctx.fill();ctx.fillStyle=hsl(o.h,95,68);ctx.beginPath();ctx.arc(o.x,o.y,o.r*pu,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(o.x-o.r*.3,o.y-o.r*.3,o.r*.3,0,7);ctx.fill()}
 for(const w of worms)if(w!==me)drawWorm(w);drawWorm(me);
 ctx.restore();
