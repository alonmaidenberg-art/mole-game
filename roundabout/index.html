<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#193552;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{margin:6px 0;font-size:30px;text-align:center}
.sub{text-align:center;opacity:.75;margin:0 0 10px}
.box{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:14px;margin:12px 0}
.lb{opacity:.8;font-size:15px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:13px 6px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#112b46;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.chip.on{background:#ffd05a;color:#2a1c00;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);box-shadow:0 6px 0 #0d7a66;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a66}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:16px;padding:12px}
.ib{min-width:46px;height:42px;padding:0 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.scr{display:none}.scr.show{display:block}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.show{display:flex}
.ovc{width:100%;max-width:380px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:26px;padding:22px;text-align:center}
.ovc h2{margin:0 0 6px;font-size:30px}
body{overflow:hidden;position:fixed;inset:0;width:100%;background:#0e2338}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
.ov{overflow:auto}.ovc{margin:auto}
#hud{position:fixed;left:0;right:0;top:0;text-align:center;font-weight:900;font-size:22px;pointer-events:none;z-index:8;padding-top:max(8px,env(safe-area-inset-top));direction:ltr;text-shadow:0 2px 4px #000}
.tb{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,12,60,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;display:none}
.tb.on{background:rgba(255,160,40,.85)}
#rot{position:fixed;inset:0;background:#112840;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:20px}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

<body>
<canvas id="cv"></canvas><div id="hud"></div>
<div id="rot">📱↔️<br>סובבו את הטלפון לרוחב</div>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🚦</div><h2>כיכר התנועה</h2><div class="lb">לחצו (או רווח) כדי לשלוח את המכונית הבאה לכיכר. חכו שהמקום יתפנה! נגיעה בין מכוניות = התנגשות. 3 ניסיונות</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script src="../lib/real2d.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const W=800,H=450;const cv=$('#cv'),ctx=cv.getContext('2d');const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function holdBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(1);b.classList.add('on')});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,e=>{fn(0);b.classList.remove('on')})}
const BK='roundabout'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}

let hits=[],on=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function B(x,y,w,h,col,txt,fn,fs=22,tc='#fff'){ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill();if(txt!=null){ctx.fillStyle=tc;ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+w/2,y+h/2+1)}if(fn)hits.push({x,y,w,h,fn})}
function T(t,x,y,fs=22,c='#fff',al='center'){ctx.fillStyle=c;ctx.font='bold '+fs+'px system-ui';ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn(p);break}}});
function run(upd,drw,bg){let last=performance.now(),acc=0;const _bg=bg||'#111';let _grd=null;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(on)upd()}hits=[];if(window.R2){if(!_grd){_grd=ctx.createLinearGradient(0,0,0,H);_grd.addColorStop(0,R2.lighten(_bg,.17));_grd.addColorStop(.55,_bg);_grd.addColorStop(1,R2.darken(_bg,.27))}ctx.fillStyle=_grd}else ctx.fillStyle=_bg;ctx.fillRect(0,0,W,H);if(on||window.__show)drw();if(window.R2&&!window.__flatBg)R2.vignette(ctx,W,H,.2)}requestAnimationFrame(l)}
function wire(start){$('#go').onclick=()=>{$('#menu').classList.remove('show');start();on=true};$('#again').onclick=()=>{$('#end').classList.remove('show');start();on=true};$('#menu2').onclick=()=>{on=false;$('#end').classList.remove('show');$('#menu').classList.add('show')}}
function over(title,score,msg,coins,dia,delay=600){on=false;window.__show=true;saveBest(score);setTimeout(()=>endGame(title,score,msg,coins,dia),delay)}

const CX=400,CY=225,R0=150;
let cars,queue,lvl,sc,lives,msg,ent=Math.PI/2,fr,fin;
function setup(){cars=[];fr=0;fin=0;const n=4+lvl*2;queue=[];for(let i=0;i<n;i++)queue.push({w:.02+Math.min(.016,lvl*.002)+(lvl>=2&&Math.random()<.35?rnd(-.006,.012):0),big:lvl>=3&&Math.random()<.25});}
function start(){lvl=0;sc=0;lives=3;msg='';setup()}
function fail(){if(fin)return;tone(100,.5,'sawtooth');lives--;fin=1;if(lives<=0){over('התנגשות!',sc,'שלבים: '+lvl,sc,lvl>=4?1:0)}else{msg='התנגשות! ננסה שוב';setTimeout(()=>{if(on){setup()}},900)}}
function ad(a,b){let d=Math.abs(a-b)%(Math.PI*2);return d>Math.PI?Math.PI*2-d:d}
function send(){if(!on||fin||!queue.length)return;const q=queue.shift();const c={a:ent,w:q.w,big:q.big,t:0};cars.push(c);tone(400,.06);if(cars.some(o=>o!==c&&ad(o.a,c.a)<(o.big||c.big?.3:.22)))fail()}
cv.addEventListener('pointerdown',send);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')send()});
function upd(){if(fin)return;fr++;for(const c of cars){c.a+=c.w;c.t+=c.w}cars=cars.filter(c=>c.t<Math.PI*2+.25);
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){if(ad(cars[i].a,cars[j].a)<(cars[i].big||cars[j].big?.3:.22)){fail();return}}
  if(!queue.length&&!cars.length){sc+=100+lvl*20;lvl++;msg='שלב '+lvl+' ✔';tone(900,.25);setup()}}
// draw a car at current transform; nose pointing "up" (negative y)
function drawCar(big,col){const w=big?20:14,h=big?44:28,r=4;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(3,4,w*.7,h*.3,0,0,7);ctx.fill();
  // body
  const bg=ctx.createLinearGradient(-w,0,w,0);bg.addColorStop(0,col);bg.addColorStop(.45,'#fff8');bg.addColorStop(.55,'#fff4');bg.addColorStop(1,col);
  ctx.fillStyle=bg;rr(-w,-h,w*2,h,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  // windshield (front = top)
  const wr=big?3:2;
  ctx.fillStyle='rgba(180,230,255,.7)';rr(-w+wr,-h+h*.18,w*2-wr*2,h*.28,wr);ctx.fill();
  // rear window
  ctx.fillStyle='rgba(180,230,255,.5)';rr(-w+wr,-h+h*.54,w*2-wr*2,h*.2,wr);ctx.fill();
  // headlights (front)
  ctx.fillStyle='#fffacc';ctx.shadowBlur=big?10:7;ctx.shadowColor='#fffacc';
  ctx.beginPath();ctx.arc(-w+wr,-h+5,wr,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(w-wr,-h+5,wr,0,7);ctx.fill();
  ctx.shadowBlur=0;
  // tail lights
  ctx.fillStyle='#ff3333';
  ctx.beginPath();ctx.arc(-w+wr,h*.4,wr*.9,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(w-wr,h*.4,wr*.9,0,7);ctx.fill();
  // wheels
  ctx.fillStyle='#1a1a2e';
  for(const [wx,wy] of[[-w+1,-h*.5],[w-1,-h*.5],[-w+1,h*.25],[w-1,h*.25]]){ctx.beginPath();ctx.arc(wx,wy,big?4:3,0,7);ctx.fill();ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.stroke()}}
// animated stick runner (at bottom of screen in queue area)
let runPh=0;
function drawRunner(x,y,sc2){runPh+=.09;ctx.save();ctx.translate(x,y);ctx.scale(sc2,sc2);
  const s=Math.sin(runPh),c2=Math.cos(runPh);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,22,10,3,0,0,7);ctx.fill();
  // legs
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(-6+s*7,18);ctx.lineTo(-3+s*4,28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(6-s*7,18);ctx.lineTo(3-s*4,28);ctx.stroke();
  // body
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(0,-2);ctx.stroke();
  // arms
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-8+c2*5,-6-s*4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8-c2*5,-6+s*4);ctx.stroke();
  // head
  ctx.fillStyle='#ffe0a0';ctx.beginPath();ctx.arc(0,-9,6,0,7);ctx.fill();
  ctx.fillStyle='#1a0a00';ctx.beginPath();ctx.arc(2,-9,1.5,0,7);ctx.fill();
  ctx.restore()}
function drw(){
  // night-city sky gradient
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07091a');bg.addColorStop(.6,'#111630');bg.addColorStop(1,'#1a2540');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // stars
  for(let i=0;i<40;i++){const sx=((i*197+31)%W),sy=((i*113+17)%(CY-20));const br=.3+Math.sin(fr*.05+i*.7)*.2;ctx.globalAlpha=br;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,i%3<1?1.2:.7,0,7);ctx.fill()}ctx.globalAlpha=1;
  // city silhouette
  ctx.fillStyle='#111830';
  const bld=[[0,120,60,180],[70,90,50,230],[130,70,45,220],[185,100,55,210],[245,60,40,230],[290,80,60,220],[360,50,45,235],[410,90,55,225],[470,65,50,220],[525,100,60,210],[590,75,45,230],[640,55,55,220],[700,80,60,210],[760,100,50,220]];
  for(const[bx,bh,bw,by] of bld){ctx.fillRect(bx,by-bh,bw,bh);// windows
    ctx.fillStyle='rgba(255,220,80,.35)';for(let wy=by-bh+8;wy<by-4;wy+=12)for(let wx=bx+5;wx<bx+bw-5;wx+=10){if(Math.sin(wx*7+wy*13)>.1)ctx.fillRect(wx,wy,6,7)}ctx.fillStyle='#111830'}
  // road into roundabout (from bottom)
  const rw=52;ctx.fillStyle='#2a3550';ctx.fillRect(CX-rw/2,CY+R0-10,rw,H-(CY+R0)+30);
  // road markings
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.setLineDash([14,10]);
  ctx.beginPath();ctx.moveTo(CX,CY+R0+10);ctx.lineTo(CX,H);ctx.stroke();ctx.setLineDash([]);
  // roundabout asphalt ring
  ctx.strokeStyle='#2d3d58';ctx.lineWidth=52;ctx.beginPath();ctx.arc(CX,CY,R0,0,7);ctx.stroke();
  // dashed lane marker
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.arc(CX,CY,R0,0,7);ctx.stroke();ctx.setLineDash([]);
  // center island
  const ig=ctx.createRadialGradient(CX,CY,0,CX,CY,R0-26);ig.addColorStop(0,'#1e3a1e');ig.addColorStop(.6,'#2a4a2a');ig.addColorStop(1,'#1a2e1a');
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(CX,CY,R0-26,0,7);ctx.fill();
  // trees on island
  for(let i=0;i<5;i++){const ta=i/5*Math.PI*2,tr=R0-50;const tx=CX+Math.cos(ta)*tr,ty=CY+Math.sin(ta)*tr;
    ctx.fillStyle='#1a2a0a';ctx.beginPath();ctx.arc(tx,ty,10,0,7);ctx.fill();
    ctx.fillStyle='#2d4a1a';ctx.beginPath();ctx.arc(tx,ty-5,8,0,7);ctx.fill()}
  // draw cars
  for(const c of cars){ctx.save();ctx.translate(CX+Math.cos(c.a)*R0,CY+Math.sin(c.a)*R0);ctx.rotate(c.a+Math.PI/2);drawCar(c.big,c.big?'#ff6020':'#2060ff');ctx.restore()}
  // queue preview (bottom area)
  ctx.fillStyle='rgba(255,255,255,.07)';rr(CX-rw/2,CY+R0+20,rw,H-(CY+R0)-30,10);ctx.fill();
  queue.slice(0,5).forEach((q,i)=>{ctx.globalAlpha=i?.5:.95;ctx.save();ctx.translate(CX,CY+R0+56+i*44);ctx.rotate(Math.PI);drawCar(q.big,q.big?'#ff6020':'#2060ff');ctx.restore()});ctx.globalAlpha=1;
  // runner at right side
  if(on||window.__show)drawRunner(W-70,H-50,.85);
  // traffic light at entry
  const tlx=CX+R0+8,tly=CY+R0*.7;ctx.fillStyle='#222';rr(tlx-6,tly-28,12,38,4);ctx.fill();
  const lc=queue.length>0?'#44ff44':'#ff4444';ctx.fillStyle=lc;ctx.shadowBlur=lc==='#44ff44'?12:8;ctx.shadowColor=lc;ctx.beginPath();ctx.arc(tlx,tly-18,5,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(tlx,tly-4,5,0,7);ctx.fill();
  // HUD
  ctx.fillStyle='rgba(5,10,25,.55)';rr(10,8,120,36,10);ctx.fill();T('⭐ '+sc,70,27,22);
  ctx.fillStyle='rgba(5,10,25,.55)';rr(W/2-70,8,140,36,10);ctx.fill();T('שלב '+(lvl+1),W/2,27,20);
  ctx.fillStyle='rgba(5,10,25,.55)';rr(W-125,8,116,36,10);ctx.fill();T('❤️'.repeat(lives),W-66,27,18);
  T('נשארו: '+queue.length,CX,CY,20,'#fff7');if(msg)T(msg,W/2,68,22,'#ffd23f')}
wire(start);run(upd,drw,'#1a2540');window.__s={step:upd,start:()=>{start();on=true},get on(){return on},get score(){return sc},send,get cars(){return cars},get queue(){return queue},get lvl(){return lvl},get lives(){return lives},get ent(){return ent},ad};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
