<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:radial-gradient(700px 500px at 80% -10%,#3e9fd6 0,transparent 60%),radial-gradient(600px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#193552;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}

<script src="../lib/three.min.js"></script><script src="../lib/real3d.js"></script><canvas id="cv"></canvas><div id="hud"></div><button class="tb" id="bL" style="left:8px">◀</button><button class="tb" id="bR" style="left:90px">▶</button><button class="tb" id="bF" style="left:49px;bottom:94px">▲</button><button class="tb" id="bJ" style="right:8px;width:90px;height:90px">⤒</button>
<div class="ov show" id="menu"><div class="ovc" style="max-width:440px"><div style="font-size:56px">🧗</div><h2>פארקור 3D</h2><div class="lb">קפצו בין הפלטפורמות, אספו כוכבים והגיעו לדגל. אפשר קפיצה כפולה!</div><div class="chips" id="lv"></div><div style="opacity:.75;font-size:12.5px;margin-top:8px"><b>חצים/WASD</b> תנועה · <b>רווח</b> קפיצה (פעמיים באוויר)<br>בטלפון: כפתורים על המסך</div><button class="btn" id="go">▶ שחק</button><div style="opacity:.8;margin-top:10px;font-size:15px">שיא: <b id="best">0</b></div></div></div>
<div class="ov" id="end"><div class="ovc"><h2 id="eT">נגמר</h2><div style="font-size:48px;font-weight:900;color:#ffd05a" id="eS"></div><p id="eM"></p><button class="btn" id="again">🔁 שוב</button><button class="btn alt" id="menu2">תפריט</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let _ac=null;function tone(f,d=.1,t='triangle',v=.07){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d+.02)}catch(e){}}
const keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,300);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>{keys[e.code]=0});
function onSwipe(fn,tap){let s=null;cv.addEventListener('pointerdown',e=>{s={x:e.clientX,y:e.clientY}});cv.addEventListener('pointerup',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;s=null;if(Math.hypot(dx,dy)<20){tap&&tap()}else if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy<0?'u':'d')})}
const BK='parkour3d'+'_best';let best=+store.get(BK,0);$('#best').textContent=best;
function endGame(title,score,msg,coins,dia){$('#eT').textContent=title;$('#eS').textContent=score;let m=msg||'';if(window.AG&&coins>0){AG.add(coins,dia||0);m+=' +'+coins+' 🪙'+(dia?' +'+dia+' 💎':'')}$('#eM').textContent=m;$('#end').classList.add('show')}
function saveBest(s){if(s>best){best=s;store.set(BK,s);$('#best').textContent=s}}
function runLoop(stepFn,active){let last=performance.now(),acc=0;function l(n){requestAnimationFrame(l);acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){acc-=1000/60;if(active())stepFn()}R.render(scene,cam)}requestAnimationFrame(l)}

R3.upgrade(R);R3.autoMaterials();R3.shadowAll();R3.env(R,scene,'dusk');R3.sky(scene,'dusk',{radius:600,fogNear:90,fogFar:420});const SUN=R3.sun(scene,{position:[60,110,40],intensity:1.1,ambient:.5,skyColor:0xffd3b0,groundColor:0x4a3a6a,shadowRadius:60,far:320});
const _pc=R3.concrete(13),_pw=R3.wood(27,['#c9a26a','#b8915c','#d1ad77','#bf9862']);
const PLATM={g:new THREE.MeshStandardMaterial({map:R3.tex(_pc,1.4,1.4),color:0x7df0b4,roughness:.8,metalness:0,envMapIntensity:.3}),
             m:new THREE.MeshStandardMaterial({map:R3.tex(_pc,1.4,1.4),color:0xff8a82,roughness:.8,metalness:0,envMapIntensity:.3}),
             c:new THREE.MeshStandardMaterial({map:R3.tex(_pw,1,1),roughness:.75,metalness:0,envMapIntensity:.3}),
             a:new THREE.MeshStandardMaterial({map:R3.tex(_pc,1.4,1.4),color:0xa89cf0,roughness:.85,metalness:0,envMapIntensity:.35}),
             b:new THREE.MeshStandardMaterial({map:R3.tex(_pc,1.4,1.4),color:0xc4bcff,roughness:.85,metalness:0,envMapIntensity:.35})};
const M=c=>new THREE.MeshLambertMaterial({color:c});
const sun=new THREE.Mesh(new THREE.SphereGeometry(18,16,12),new THREE.MeshBasicMaterial({color:0xffe9a8}));sun.position.set(-40,30,-150);scene.add(sun);
for(let i=0;i<30;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(rnd(4,10),rnd(1,2),rnd(3,6)),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7}));c.position.set(rnd(-80,80),rnd(-25,10),rnd(-300,10));scene.add(c)}
let LV=[],lv=+store.get('pk_lv',0);const lvEl=$('#lv');
function genLevel(seed,n,gapMax,moving,crumble){let s=seed;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};const P=[{x:0,y:0,z:0,w:6,d:6,t:'s'}];let x=0,y=0,z=0;
  for(let i=1;i<n;i++){const gap=2+R()*gapMax,dx=(R()-.5)*gapMax*1.4,dy=(R()-.45)*1.6;z-=gap+2;x=clamp(x+dx,-9,9);y=clamp(y+dy,-3,10);const w=R()<.5?3.5:2.6;const t=R()<moving?'m':(R()<crumble?'c':'s');P.push({x,y,z,w,d:w,t,ph:R()*6,ox:x,oy:y})}
  const last=P[P.length-1];last.t='g';last.w=6;last.d=6;return P}
const CFG=[[1,18,2.2,.1,.05],[7,24,3,.2,.15],[13,30,3.6,.3,.25]];
['קל','בינוני','קשה'].forEach((n,i)=>{const b=document.createElement('button');b.className='chip'+(i===lv?' on':'');b.textContent=n;b.onclick=()=>{lv=i;store.set('pk_lv',i);[...lvEl.children].forEach(k=>k.classList.toggle('on',k===b))};lvEl.appendChild(b)});
const pl=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.CapsuleGeometry(.4,.8,4,8):new THREE.CylinderGeometry(.4,.4,1.2,10),M(0x2f7bff));body.position.y=.8;const hd=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),M(0xf0c8a0));hd.position.y=1.7;const cap=new THREE.Mesh(new THREE.BoxGeometry(.8,.2,.8),M(0xe8433f));cap.position.y=1.95;pl.add(body,hd,cap);scene.add(pl);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.5,12),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));shadow.rotation.x=-Math.PI/2;scene.add(shadow);
let state='menu',plats=[],stars=[],flag,x,y,z,vx,vy,vz,ground,jumps,cp,falls,got,frame,startT,keys2={l:0,r:0,f:0};
function build(){for(const p of plats)scene.remove(p.m);for(const s of stars)scene.remove(s.m);if(flag)scene.remove(flag);const c=CFG[lv];LV=genLevel(c[0],c[1],c[2],c[3],c[4]);plats=LV.map((p,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(p.w,.6,p.d),(p.t==='g'?PLATM.g:p.t==='m'?PLATM.m:p.t==='c'?PLATM.c:i%2?PLATM.a:PLATM.b));m.position.set(p.x,p.y-.3,p.z);scene.add(m);return Object.assign(p,{m,fall:0,base:p.y,cs:0})});
  stars=[];plats.forEach((p,i)=>{if(i>0&&i<plats.length-1&&i%2===0){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.4),M(0xffd05a));m.position.set(p.x,p.y+1.6,p.z);scene.add(m);stars.push({m,p,got:false})}});
  const l=plats[plats.length-1];flag=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,4),M(0xffffff));pole.position.y=2;const fl=new THREE.Mesh(new THREE.BoxGeometry(1.4,.9,.05),M(0xe8433f));fl.position.set(.7,3.5,0);flag.add(pole,fl);flag.position.set(l.x,l.y,l.z);scene.add(flag)}
function reset(){build();x=0;y=1;z=0;vx=vy=vz=0;cp=0;falls=0;got=0;frame=0;ground=true;jumps=0;state='play'}
function respawn(){const p=plats[cp];x=p.x;y=p.y+1;z=p.z;vx=vy=vz=0;falls++;tone(150,.3,'sawtooth',.1)}
function jump(){if(state!=='play')return;if(ground||jumps<2){vy=ground?.28:.25;ground=false;jumps++;tone(ground?420:520,.07)}}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='KeyW'&&false)jump()});
for(const [id,k] of[['#bL','l'],['#bR','r'],['#bF','f']]){const b=$(id);if(matchMedia('(pointer:coarse)').matches)b.style.display='block';b.addEventListener('pointerdown',e=>{e.preventDefault();keys2[k]=1});for(const t of['pointerup','pointerleave','pointercancel'])b.addEventListener(t,()=>keys2[k]=0)}
{const b=$('#bJ');if(matchMedia('(pointer:coarse)').matches)b.style.display='block';b.addEventListener('pointerdown',e=>{e.preventDefault();jump()})}
function step(){frame++;
  const dx=((keys.ArrowRight||keys.KeyD||keys2.r)?1:0)-((keys.ArrowLeft||keys.KeyA||keys2.l)?1:0),dz=((keys.ArrowUp||keys.KeyW||keys2.f)?1:0)-((keys.ArrowDown||keys.KeyS)?1:0);
  const sp=ground?.16:.14;vx+=(dx*sp-vx)*.2;vz+=(-dz*sp-vz)*.2;vy-=.012;
  let nx=x+vx,nz=z+vz,ny=y+vy;ground=false;
  for(const p of plats){if(p.fall>20){continue}const hw=p.w/2+.25,hd=p.d/2+.25;const top=p.m.position.y+.3;
    if(Math.abs(nx-p.m.position.x)<hw&&Math.abs(nz-p.m.position.z)<hd){if(y>=top-.15&&ny<=top){ny=top;vy=0;ground=true;jumps=0;if(p.t==='c'&&!p.cs)p.cs=1;if(p.t==='m'){nx+=p.dx||0;nz+=p.dz||0}const i=plats.indexOf(p);if(i>cp&&p.t!=='c')cp=i}}}
  x=nx;z=nz;y=ny;
  for(const p of plats){if(p.t==='m'){const t=frame*.02+p.ph;const ox=p.m.position.x;p.m.position.x=p.ox+Math.sin(t)*3;p.dx=p.m.position.x-ox}if(p.cs>0){p.cs++;p.m.position.y-=.0;if(p.cs>40){p.fall++;p.m.position.y-=.2;p.m.material.color.set(0x8a6a3a)}if(p.fall>60){p.m.visible=false}}}
  for(const s of stars){s.m.rotation.y+=.06;if(!s.got&&Math.hypot(x-s.p.x,z-s.p.z)<1.2&&Math.abs(y-s.p.y-1)<1.6){s.got=true;s.m.visible=false;got++;tone(900,.08)}}
  if(y<-14)respawn();const l=plats[plats.length-1];if(Math.hypot(x-l.x,z-l.z)<2.5&&Math.abs(y-l.y)<2&&state==='play')win();
  pl.position.set(x,y,z);pl.rotation.y=Math.atan2(-vx,-vz)||pl.rotation.y;shadow.position.set(x,(plats.filter(p=>Math.abs(x-p.m.position.x)<p.w/2&&Math.abs(z-p.m.position.z)<p.d/2).map(p=>p.m.position.y+.3).filter(h=>h<=y+.1).sort((a,b)=>b-a)[0]??-20)+.02,z);
  cam.position.set(x*.8,y+6.5,z+11);cam.lookAt(x*.8,y+1,z-6);$('#hud').textContent='⭐ '+got+'/'+stars.length+' · נפילות '+falls+' · נקודת שמירה '+(cp+1)+'/'+plats.length}
function win(){state='won';tone(900,.3);const t=Math.floor(frame/60),sc=Math.max(10,1000-t*5-falls*40)+got*50;saveBest(sc);setTimeout(()=>endGame('הגעת לדגל! 🏁',sc,'כוכבים '+got+' · נפילות '+falls+' · '+t+' שניות',20+got*3-falls+lv*15,lv===2&&falls<5?1:0),700)}
$('#go').onclick=()=>{$('#menu').classList.remove('show');reset()};$('#again').onclick=()=>{$('#end').classList.remove('show');reset()};$('#menu2').onclick=()=>{state='menu';$('#end').classList.remove('show');$('#menu').classList.add('show');$('#hud').textContent=''};
window.__s={reset,step,jump,respawn,get state(){return state},get got(){return got},get pos(){return[x,y,z]},get plats(){return plats},get falls(){return falls},tp(i){const p=plats[i];x=p.x;y=p.y+.5;z=p.z}};
cam.position.set(0,8,12);cam.lookAt(0,0,-10);runLoop(step,()=>state==='play');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
