<meta name="description" content="המשחקים של אלון מידנברג: אוסף משחקים בעברית, כדורסל, שחמט, 4 בשורה, נחש, 2048 ועוד. משחקים בחינם בדפדפן ובטלפון, אפשר גם להתקין כאפליקציה.">
<meta property="og:title" content="המשחקים של אלון מידנברג">
<meta property="og:description" content="אוסף משחקים קצרים וכיפיים לשחק בדפדפן ובטלפון.">

<link rel="icon" type="image/svg+xml" href="assets/hub.svg">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;color:#fff;
  background:radial-gradient(900px 500px at 80% -10%,#4b2fb3 0,transparent 60%),radial-gradient(700px 500px at 0% 110%,#0f6b6b 0,transparent 55%),#140d2e}
main{max-width:860px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 40px}
header{text-align:center;margin-bottom:26px}
header img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
h1{margin:12px 0 4px;font-size:clamp(24px,6.2vw,38px);line-height:1.15}
header p{margin:0;opacity:.8;font-size:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;transition:transform .15s,background .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.14);outline:none;border-color:#ffd23f}
a.card img{width:72px;height:72px;border-radius:16px;flex:none;background:#0003}
.t{font-size:19px;font-weight:800;line-height:1.2}
.d{font-size:13.5px;opacity:.8;margin-top:4px;line-height:1.4}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#1a1238;background:#ffd23f;border-radius:999px;padding:2px 10px}
.empty{text-align:center;opacity:.8;grid-column:1/-1}
footer{text-align:center;margin-top:34px;opacity:.55;font-size:13px}
.wal{display:flex;gap:8px;justify-content:center;margin-top:12px;font-weight:800}
.wal span{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 14px;font-size:16px}
.key{background:none;border:0;color:#fff;opacity:.45;font-size:20px;cursor:pointer;padding:6px 10px}
.mo{position:fixed;inset:0;background:rgba(10,5,30,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.mo.show{display:flex}
.mc{width:100%;max-width:360px;background:linear-gradient(160deg,#2c1b6a,#1a1038);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:20px;text-align:center}
.mc h2{margin:0 0 8px}.mc p{opacity:.85;line-height:1.5;margin:6px 0}
.mc input{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:#150a30;color:#fff;text-align:center;letter-spacing:1px;direction:ltr}
.mb{display:block;width:100%;margin-top:10px;border:0;border-radius:16px;padding:13px;font:inherit;font-size:18px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);cursor:pointer}
.mb.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);font-size:15px;padding:10px}
.err{color:#ff9bb0;min-height:22px}

.tools{max-width:560px;margin:18px auto 6px}
.sr{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;outline:none}
.sr:focus{border-color:#ffd23f}.sr::placeholder{color:#fff;opacity:.55}
#chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 18px}
#chips button{font:inherit;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
#chips button.on{background:#ffd23f;color:#1a1238;border-color:#fff}
.daily{margin-top:12px}#dailyB{font:inherit;font-weight:900;font-size:16px;padding:10px 20px;border-radius:999px;border:0;background:linear-gradient(180deg,#ffe27a,#ffb02e);color:#3a2400;cursor:pointer;box-shadow:0 4px 0 #b57400}
#dailyB:disabled{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;opacity:.7;cursor:default}
.sec{grid-column:1/-1;font-size:18px;font-weight:900;margin:10px 4px 0;opacity:.9}
.cw{position:relative}.cw a.card{height:100%}
.fav{position:absolute;top:8px;left:10px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff;opacity:.35;z-index:2;padding:4px}.fav.on{opacity:1;color:#ffd23f}
.new{position:absolute;top:-6px;right:-4px;background:#ff3d71;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:3px 9px;z-index:2;box-shadow:0 2px 6px #0006}
.stat{opacity:.7;font-size:14px;margin-top:6px}
</style>
<link rel="canonical" href="https://alon-games.netlify.app/">
<meta property="og:title" content="המשחקים של אלון מידנברג">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alon-games.netlify.app/">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"המשחקים של אלון מידנברג","url":"https://alon-games.netlify.app/","inLanguage":"he"}</script>
</head>
<body>
<main>
  <header>
    <img src="assets/hub.svg" alt="" width="84" height="84">
    <h1>המשחקים של אלון מידנברג</h1>
    <p>בחרו משחק ותתחילו לשחק 🎮</p><div class="stat" id="stat"></div>
    <div class="wal"><span>🪙 <b id="wc">0</b></span><span>💎 <b id="wd">0</b></span><button class="key" id="keyB" aria-label="קוד אדמין">🔑</button></div>
  <div class="daily"><button id="dailyB">🎁 מתנה יומית</button> <button id="lbB" style="font:inherit;font-weight:900;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer">🏆 השיאים שלי</button></div>
    <div class="tools"><input class="sr" id="sr" type="search" placeholder="🔍 חיפוש משחק…" autocomplete="off"></div>
    <div id="chips"></div>
  </header>
  <section id="grid" aria-label="רשימת המשחקים"><p class="empty">טוען משחקים…</p></section>
  <noscript><p style="text-align:center"><a style="color:#ffd23f" href="mole/">🐹 תפוס את החפרפרת</a></p></noscript>
  <footer>© 2026 אלון מידנברג · כל הזכויות שמורות · אסור להעתיק בלי רשות</footer>
</main>
<div class="mo" id="lbM"><div class="mc" style="max-height:85vh;overflow:auto"><h2>🏆 השיאים שלי</h2><div id="lbList"></div><button class="mb alt" id="lbX">סגור</button></div></div>
<div class="mo" id="noteM"><div class="mc"><h2 id="noteT"></h2><p id="noteP"></p><button class="mb" id="noteGo">המשך למשחק</button><button class="mb alt" id="noteX">חזרה</button></div></div>
<div class="mo" id="admM"><div class="mc"><h2>🔑 קוד אדמין</h2>
  <div id="admIn"><p>הכניסו את הקוד הסודי</p><input id="admC" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AG-XXXX-XXXX-XXXX"><div class="err" id="admE"></div><button class="mb" id="admOk">אישור</button></div>
  <div id="admPanel" style="display:none"><p>מצב אדמין פעיל ✅<br><small>במשחק הבלוקים יש כפתור ערכת אדמין בתיק.</small></p>
    <button class="mb" id="a1">+10,000 🪙</button><button class="mb" id="a2">+500 💎</button><button class="mb alt" id="a3">אפס ארנק</button><button class="mb alt" id="a4">יציאה ממצב אדמין</button></div>
  <button class="mb alt" id="admX">סגור</button></div></div>
<script src="hub.js"></script>
<script>
var LIST=[],cat='הכל',q='';
var FAV=ld('ag_fav',[]),RECENT=ld('ag_recent',[]);
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function card(x,isNew){
  var w=document.createElement('div');w.className='cw';
  var a=document.createElement('a');a.className='card';a.href=x.url;
  a.addEventListener('click',function(e){RECENT=[x.id].concat(RECENT.filter(function(i){return i!==x.id})).slice(0,4);sv('ag_recent',RECENT);if(x.note){e.preventDefault();showNote(x)}});
  var i=document.createElement('img');i.src=x.icon;i.alt='';i.width=72;i.height=72;i.loading='lazy';
  var b=document.createElement('div');var t=document.createElement('div');t.className='t';t.textContent=x.name;
  var d=document.createElement('div');d.className='d';d.textContent=x.description||'';b.append(t,d);
  if(x.tag){var s=document.createElement('span');s.className='tag';s.textContent=x.tag;b.append(s)}
  a.append(i,b);w.append(a);
  var f=document.createElement('button');f.className='fav'+(FAV.indexOf(x.id)>-1?' on':'');f.textContent='★';f.setAttribute('aria-label','מועדף');
  f.onclick=function(e){e.preventDefault();e.stopPropagation();var k=FAV.indexOf(x.id);if(k>-1)FAV.splice(k,1);else FAV.push(x.id);sv('ag_fav',FAV);render()};w.append(f);
  if(isNew){var n=document.createElement('span');n.className='new';n.textContent='חדש';w.append(n)}
  return w}
function render(){
  var g=$('grid');g.textContent='';
  var newIds=LIST.slice(-6).map(function(x){return x.id});
  var shown=LIST.filter(function(x){return (cat==='הכל'||x.tag===cat||(cat==='⭐ מועדפים'&&FAV.indexOf(x.id)>-1))&&(!q||(x.name+' '+(x.description||'')+' '+(x.tag||'')).toLowerCase().indexOf(q)>-1)});
  if(!shown.length){g.innerHTML='<p class="empty">לא נמצאו משחקים.</p>';return}
  function sec(t){var h=document.createElement('div');h.className='sec';h.textContent=t;g.append(h)}
  if(cat==='הכל'&&!q){
    var rc=RECENT.map(function(id){return LIST.find(function(x){return x.id===id})}).filter(Boolean);
    if(rc.length){sec('▶ המשך לשחק');rc.slice(0,3).forEach(function(x){g.append(card(x,false))})}
    var fv=LIST.filter(function(x){return FAV.indexOf(x.id)>-1});
    if(fv.length){sec('★ המועדפים שלי');fv.forEach(function(x){g.append(card(x,false))})}
    sec('🎮 כל המשחקים')}
  shown.forEach(function(x){g.append(card(x,newIds.indexOf(x.id)>-1))})}
function chips(){
  var c=$('chips');c.textContent='';var tags=['הכל'];LIST.forEach(function(x){if(x.tag&&tags.indexOf(x.tag)<0)tags.push(x.tag)});if(FAV.length)tags.push('⭐ מועדפים');
  tags.forEach(function(t){var b=document.createElement('button');b.textContent=t;if(t===cat)b.className='on';b.onclick=function(){cat=t;chips();render()};c.append(b)})}
$('sr').addEventListener('input',function(){q=this.value.trim().toLowerCase();render()});
fetch('games.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(list){
  LIST=list;$('stat').textContent=list.length+' משחקים · משחקים חדשים מתווספים כל הזמן';chips();render()
}).catch(function(){$('grid').innerHTML='<p class="empty">לא הצלחנו לטעון את הרשימה. <a style="color:#ffd23f" href="mole/">לחצו כאן למשחק החפרפרת</a></p>'});
/* daily gift */
(function(){var K='ag_daily',b=$('dailyB');function today(){return new Date().toISOString().slice(0,10)}
  function st(){return ld(K,{d:'',s:0})}
  function paint(){var o=st();if(o.d===today()){b.disabled=true;b.textContent='🎁 קיבלת היום · רצף '+o.s+' ימים'}else{b.disabled=false;b.textContent='🎁 מתנה יומית'}}
  b.onclick=function(){var o=st(),t=today();if(o.d===t)return;var y=new Date(Date.now()-864e5).toISOString().slice(0,10);var s=o.d===y?o.s+1:1;var c=30+Math.min(s,7)*10,dm=s%7===0?1:0;AG.add(c,dm);sv(K,{d:t,s:s});alert('קיבלת '+c+' 🪙'+(dm?' ו-💎 1':'')+'\nרצף: '+s+' ימים');paint()};
  paint()})();


/* personal bests */
var BK={flappy:'b_best',fallingblocks:'f_best',game2048:'g_best',snake:'s_best'};
function lbOpen(){var L=$('lbList');L.textContent='';var n=0;
  LIST.forEach(function(x){var k=BK[x.id]||(x.id+'_best'),v=null;try{v=localStorage.getItem(k)}catch(e){}if(v===null||v===''||v==='0'||isNaN(+v))return;n++;
    var r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;margin:6px 0;text-align:start';
    var i=document.createElement('img');i.src=x.icon;i.width=40;i.height=40;i.style.borderRadius='10px';var t=document.createElement('div');t.style.flex='1';t.style.fontWeight='800';t.textContent=x.name;var s=document.createElement('div');s.style.cssText='font-weight:900;font-size:20px;color:#ffd23f';s.textContent=(+v).toLocaleString('he-IL');r.append(i,t,s);L.append(r)});
  if(!n){L.innerHTML='<p>עוד אין שיאים. שחקו כמה משחקים וחזרו!</p>'}
  $('lbM').classList.add('show')}
$('lbB').onclick=lbOpen;$('lbX').onclick=function(){$('lbM').classList.remove('show')};
function showNote(x){$('noteT').textContent=x.noteTitle||x.name;$('noteP').textContent=x.note;$('noteM').classList.add('show');$('noteGo').onclick=function(){location.href=x.url};$('noteX').onclick=function(){$('noteM').classList.remove('show')}}
function $(i){return document.getElementById(i)}
function wal(){$('wc').textContent=AG.coins().toLocaleString('he-IL');$('wd').textContent=AG.diamonds().toLocaleString('he-IL')}
wal();AG.onChange(wal);
function admView(){var on=AG.isAdmin();$('admIn').style.display=on?'none':'block';$('admPanel').style.display=on?'block':'none'}
$('keyB').onclick=function(){$('admE').textContent='';$('admC').value='';admView();$('admM').classList.add('show')};
$('admX').onclick=function(){$('admM').classList.remove('show')};
$('admOk').onclick=function(){AG.tryAdmin($('admC').value).then(function(ok){if(ok){admView()}else{$('admE').textContent='הקוד לא נכון'}})};
$('a1').onclick=function(){AG.add(10000,0)};$('a2').onclick=function(){AG.add(0,500)};
$('a3').onclick=function(){if(confirm('לאפס מטבעות ויהלומים?')){AG.spend(AG.coins(),AG.diamonds())}};
$('a4').onclick=function(){AG.adminLogout();admView()};
</script>
</body>
</html>
