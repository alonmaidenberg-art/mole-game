*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;color:#fff;
  background:radial-gradient(900px 520px at 80% -10%,#4fcaff 0,transparent 62%),radial-gradient(700px 500px at 0% 110%,#17c3b0 0,transparent 55%),linear-gradient(180deg,#1590e0,#0a5fae) fixed}
main{max-width:860px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 40px}
header{text-align:center;margin-bottom:26px}
header img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
h1{margin:12px 0 4px;font-size:clamp(24px,6.2vw,38px);line-height:1.15}
header p{margin:0;opacity:.8;font-size:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;transition:transform .15s,background .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.14);outline:none;border-color:#ffd23f}
a.card img{width:72px;height:72px;border-radius:16px;flex:none;background:#0003}
.t{font-size:19px;font-weight:800;line-height:1.2}
.d{font-size:13.5px;opacity:.8;margin-top:4px;line-height:1.4}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#193552;background:#ffd23f;border-radius:999px;padding:2px 10px}
.empty{text-align:center;opacity:.8;grid-column:1/-1}
footer{text-align:center;margin-top:34px;opacity:.55;font-size:13px}
.wal{display:flex;gap:8px;justify-content:center;margin-top:12px;font-weight:800}
.wal span{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 14px;font-size:16px}
.key{background:none;border:0;color:#fff;opacity:.45;font-size:20px;cursor:pointer;padding:6px 10px}
.mo{position:fixed;inset:0;background:rgba(10,5,30,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.mo.show{display:flex}
.mc{width:100%;max-width:360px;background:linear-gradient(160deg,#2e639b,#193552);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:20px;text-align:center}
.mc h2{margin:0 0 8px}.mc p{opacity:.85;line-height:1.5;margin:6px 0}
.mc input{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:#112b46;color:#fff;text-align:center;letter-spacing:1px;direction:ltr}
.mb{display:block;width:100%;margin-top:10px;border:0;border-radius:16px;padding:13px;font:inherit;font-size:18px;font-weight:900;color:#06322b;background:linear-gradient(180deg,#5ff7d6,#1fc9a6);cursor:pointer}
.mb.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);font-size:15px;padding:10px}
.err{color:#ff9bb0;min-height:22px}

.tools{max-width:560px;margin:18px auto 6px}
.sr{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;outline:none}
.sr:focus{border-color:#ffd23f}.sr::placeholder{color:#fff;opacity:.55}
#chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 18px}
#chips button{font:inherit;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
#chips button.on{background:#ffd23f;color:#193552;border-color:#fff}
.daily{margin-top:12px}#dailyB{font:inherit;font-weight:900;font-size:16px;padding:10px 20px;border-radius:999px;border:0;background:linear-gradient(180deg,#ffe27a,#ffb02e);color:#3a2400;cursor:pointer;box-shadow:0 4px 0 #b57400}
#dailyB:disabled{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;opacity:.7;cursor:default}
.sec{grid-column:1/-1;font-size:18px;font-weight:900;margin:10px 4px 0;opacity:.9}
.cw{position:relative}.cw a.card{height:100%}
.fav{position:absolute;top:8px;left:10px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff;opacity:.35;z-index:2;padding:4px}.fav.on{opacity:1;color:#ffd23f}
.new{position:absolute;top:-6px;right:-4px;background:#ff3d71;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:3px 9px;z-index:2;box-shadow:0 2px 6px #0006}
.stat{opacity:.7;font-size:14px;margin-top:6px}

h1{background:linear-gradient(90deg,#ffe27a,#ff9fd6,#7ae0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
a.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(6px)}
a.card:hover{box-shadow:0 8px 26px rgba(255,210,63,.25)}
.bossb{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;margin:6px 0 18px;padding:16px 18px;border-radius:22px;background:linear-gradient(120deg,#5b36d6,#c2307a);border:2px solid rgba(255,255,255,.3);box-shadow:0 8px 28px rgba(194,48,122,.35)}
.bossb .em{font-size:48px}.bossb b{display:block;font-size:20px}.bossb small{opacity:.9;font-size:14px}
.bossb .bar{height:8px;background:rgba(0,0,0,.3);border-radius:4px;margin-top:8px;overflow:hidden}.bossb .bar i{display:block;height:100%;background:#ffd23f;border-radius:4px}
body.cmp #grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
body.cmp a.card{padding:7px 9px;gap:9px;border-radius:16px;border-width:1.5px}
body.cmp a.card img{width:40px;height:40px;border-radius:11px}
body.cmp .t{font-size:14.5px;line-height:1.15}
body.cmp .d{display:none}
body.cmp .tag{margin-top:3px;font-size:10.5px;padding:1px 7px}
body.cmp .fav{top:2px;left:4px;font-size:16px;padding:2px}
body.cmp .sec{margin-top:6px}
body.cmp .new{top:-5px;font-size:9.5px;padding:2px 6px}

<div class="mo" id="noteM"><div class="mc"><h2 id="noteT"></h2><p id="noteP"></p><button class="mb" id="noteGo">המשך למשחק</button><button class="mb alt" id="noteX">חזרה</button></div></div>
<div class="mo" id="admM"><div class="mc"><h2>🔑 קוד אדמין</h2>
  <div id="admIn"><p>הכניסו את הקוד הסודי</p><input id="admC" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AG-XXXX-XXXX-XXXX"><div class="err" id="admE"></div><button class="mb" id="admOk">אישור</button></div>
  <div id="admPanel" style="display:none"><p>מצב אדמין פעיל ✅<br><small>במשחק הבלוקים יש כפתור ערכת אדמין בתיק.</small></p>
    <button class="mb" id="a1">+10,000 🪙</button><button class="mb" id="a2">+500 💎</button><button class="mb alt" id="a3">אפס ארנק</button><button class="mb alt" id="a4">יציאה ממצב אדמין</button></div>
  <button class="mb alt" id="admX">סגור</button></div></div>
<script src="hub.js"></script>
<script>
var LIST=[],cat='הכל',q='';
var FAV=ld('ag_fav',[]),RECENT=ld('ag_recent',[]);
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function card(x,isNew){
  var w=document.createElement('div');w.className='cw';
  var a=document.createElement('a');a.className='card';a.href=x.url;
  a.addEventListener('click',function(e){RECENT=[x.id].concat(RECENT.filter(function(i){return i!==x.id})).slice(0,4);sv('ag_recent',RECENT);if(x.note){e.preventDefault();showNote(x)}});
  var i=document.createElement('img');i.src=x.icon;i.alt='';i.width=72;i.height=72;i.loading='lazy';
  var b=document.createElement('div');var t=document.createElement('div');t.className='t';t.textContent=x.name;
  var d=document.createElement('div');d.className='d';d.textContent=x.description||'';b.append(t,d);
  if(x.tag){var s=document.createElement('span');s.className='tag';s.textContent=x.tag;b.append(s)}
  a.append(i,b);w.append(a);
  var f=document.createElement('button');f.className='fav'+(FAV.indexOf(x.id)>-1?' on':'');f.textContent='★';f.setAttribute('aria-label','מועדף');
  f.onclick=function(e){e.preventDefault();e.stopPropagation();var k=FAV.indexOf(x.id);if(k>-1)FAV.splice(k,1);else FAV.push(x.id);sv('ag_fav',FAV);render()};w.append(f);
  if(isNew){var n=document.createElement('span');n.className='new';n.textContent='חדש';w.append(n)}
  return w}
function render(){
  var g=$('grid');g.textContent='';
  var newIds=LIST.slice(-6).map(function(x){return x.id});
  var shown=LIST.filter(function(x){return (cat==='הכל'||x.tag===cat||(cat==='⭐ מועדפים'&&FAV.indexOf(x.id)>-1))&&(!q||(x.name+' '+(x.description||'')+' '+(x.tag||'')).toLowerCase().indexOf(q)>-1)});
  if(!shown.length){g.innerHTML='<p class="empty">לא נמצאו משחקים.</p>';return}
  function sec(t){var h=document.createElement('div');h.className='sec';h.textContent=t;g.append(h)}
  if(cat==='הכל'&&!q){
    var rc=RECENT.map(function(id){return LIST.find(function(x){return x.id===id})}).filter(Boolean);
    if(rc.length){sec('▶ המשך לשחק');rc.slice(0,3).forEach(function(x){g.append(card(x,false))})}
    var fv=LIST.filter(function(x){return FAV.indexOf(x.id)>-1});
    if(fv.length){sec('★ המועדפים שלי');fv.forEach(function(x){g.append(card(x,false))})}
    sec('🎮 כל המשחקים')}
  shown.forEach(function(x){g.append(card(x,newIds.indexOf(x.id)>-1))})}
function chips(){
  var c=$('chips');c.textContent='';var tags=['הכל'];LIST.forEach(function(x){if(x.tag&&tags.indexOf(x.tag)<0)tags.push(x.tag)});if(FAV.length)tags.push('⭐ מועדפים');
  tags.forEach(function(t){var b=document.createElement('button');b.textContent=t;if(t===cat)b.className='on';b.onclick=function(){cat=t;chips();render()};c.append(b)})}
(function(){var b=$('cmpB'),k='ag_cmp';function ap(){var c=localStorage.getItem(k)!=='0';document.body.classList.toggle('cmp',c);b.textContent=c?'▦':'☰';b.title=c?'תצוגה מורחבת':'תצוגה מצומצמת'}b.onclick=function(){try{localStorage.setItem(k,localStorage.getItem(k)==='0'?'1':'0')}catch(e){}ap()};ap()})();
$('sr').addEventListener('input',function(){q=this.value.trim().toLowerCase();render()});
fetch('games.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(list){if(window.AG_LANG==='en'||localStorage.getItem('ag_lang')==='en')list=list.filter(function(g){return g.id!=='englishbot'});
  LIST=list;$('stat').textContent=list.length+' משחקים · משחקים חדשים מתווספים כל הזמן';chips();render()
}).catch(function(){$('grid').innerHTML='<p class="empty">לא הצלחנו לטעון את הרשימה. <a style="color:#ffd23f" href="mole/">לחצו כאן למשחק החפרפרת</a></p>'});
/* daily gift */
(function(){var K='ag_daily',b=$('dailyB');function today(){return new Date().toISOString().slice(0,10)}
  function st(){return ld(K,{d:'',s:0})}
  function paint(){var o=st();if(o.d===today()){b.disabled=true;b.textContent='🎁 קיבלת היום · רצף '+o.s+' ימים'}else{b.disabled=false;b.textContent='🎁 מתנה יומית'}}
  b.onclick=function(){var o=st(),t=today();if(o.d===t)return;var y=new Date(Date.now()-864e5).toISOString().slice(0,10);var s=o.d===y?o.s+1:1;var c=30+Math.min(s,7)*10,dm=s%7===0?1:0;AG.add(c,dm);sv(K,{d:t,s:s});alert('קיבלת '+c+' 🪙'+(dm?' ו-💎 1':'')+'\nרצף: '+s+' ימים');paint()};
  paint()})();


/* personal bests */
var BK={flappy:'b_best',fallingblocks:'f_best',game2048:'g_best',snake:'s_best'};
function lbOpen(){var L=$('lbList');L.textContent='';var n=0;
  LIST.forEach(function(x){var k=BK[x.id]||(x.id+'_best'),v=null;try{v=localStorage.getItem(k)}catch(e){}if(v===null||v===''||v==='0'||isNaN(+v))return;n++;
    var r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;margin:6px 0;text-align:start';
    var i=document.createElement('img');i.src=x.icon;i.width=40;i.height=40;i.style.borderRadius='10px';var t=document.createElement('div');t.style.flex='1';t.style.fontWeight='800';t.textContent=x.name;var s=document.createElement('div');s.style.cssText='font-weight:900;font-size:20px;color:#ffd23f';s.textContent=(+v).toLocaleString('he-IL');r.append(i,t,s);L.append(r)});
  if(!n){L.innerHTML='<p>עוד אין שיאים. שחקו כמה משחקים וחזרו!</p>'}
  $('lbM').classList.add('show')}
$('lbB').onclick=lbOpen;

/* achievements */
(function(){
  var EN=window.AG_LANG==='en',T=function(h,e){return EN?e:h},K='ag_ach';
  function rd(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function stats(){var bests=0;LIST.forEach(function(x){var k=BK[x.id]||(x.id+'_best'),v=null;try{v=localStorage.getItem(k)}catch(e){}if(v&&+v>0)bests++});
    var t=rd('ag_time',{}),sec=0;for(var k in t)sec+=t[k];var d=rd('ag_daily',{s:0});return{played:AG.played(),bests:bests,min:Math.floor(sec/60),streak:d.s||0}}
  var A=[
    ['p5',T('מתחילים','Getting started'),T('שחקו ב-5 משחקים שונים','Play 5 different games'),'played',5,[30,0]],
    ['p15',T('סקרנים','Curious'),T('שחקו ב-15 משחקים שונים','Play 15 different games'),'played',15,[80,1]],
    ['p30',T('חוקרי משחקים','Game explorer'),T('שחקו ב-30 משחקים שונים','Play 30 different games'),'played',30,[200,3]],
    ['p50',T('אלוף האתר','Site champion'),T('שחקו ב-50 משחקים שונים','Play 50 different games'),'played',50,[500,8]],
    ['b5',T('שוברי שיאים','Record breaker'),T('קבעו שיא ב-5 משחקים','Set a record in 5 games'),'bests',5,[40,0]],
    ['b15',T('אוסף שיאים','Record collector'),T('קבעו שיא ב-15 משחקים','Set a record in 15 games'),'bests',15,[150,2]],
    ['b30',T('מלך השיאים','King of records'),T('קבעו שיא ב-30 משחקים','Set a record in 30 games'),'bests',30,[400,6]],
    ['t10',T('חם על זה','On fire'),T('שחקו 10 דקות','Play for 10 minutes'),'min',10,[30,0]],
    ['t60',T('מכורים','Hooked'),T('שחקו שעה שלמה','Play for a full hour'),'min',60,[200,3]],
    ['s3',T('חוזרים כל יום','Daily visitor'),T('רצף של 3 ימים','3-day streak'),'streak',3,[40,1]],
    ['s7',T('שבוע שלם','A whole week'),T('רצף של 7 ימים','7-day streak'),'streak',7,[150,3]]];
  function open(){var L=$('achList');L.textContent='';var st=stats(),got=rd(K,[]);
    A.forEach(function(a){var have=st[a[3]],ok=have>=a[4],claimed=got.indexOf(a[0])>=0;
      var r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;margin:6px 0;text-align:start';
      var i=document.createElement('div');i.style.fontSize='26px';i.textContent=claimed?'🏅':ok?'🎁':'🔒';
      var m=document.createElement('div');m.style.flex='1';var n=document.createElement('div');n.style.fontWeight='900';n.textContent=a[1];var d=document.createElement('div');d.style.cssText='font-size:13px;opacity:.8';d.textContent=a[2]+' ('+Math.min(have,a[4])+'/'+a[4]+')';m.append(n,d);
      r.append(i,m);
      if(ok&&!claimed){var b=document.createElement('button');b.textContent='+'+a[5][0]+'🪙'+(a[5][1]?' +'+a[5][1]+'💎':'');b.style.cssText='border:0;border-radius:12px;padding:8px 10px;font:900 13px system-ui;background:#ffd23f;color:#222;cursor:pointer';
        b.onclick=function(){var g=rd(K,[]);if(g.indexOf(a[0])<0){g.push(a[0]);localStorage.setItem(K,JSON.stringify(g));AG.add(a[5][0],a[5][1])}open()};r.append(b)}
      L.append(r)});$('achM').classList.add('show')}
  $('achB').onclick=open;$('achX').onclick=function(){$('achM').classList.remove('show')};
})();
/* shared leaderboard */
(function(){
  var EN=window.AG_LANG==='en',T=function(h,e){return EN?e:h};
  var G=null,sel=$('gbSel'),nm=$('gbName');
  function localBests(){var o={};LIST.forEach(function(x){var k=BK[x.id]||(x.id+'_best'),v=null;try{v=localStorage.getItem(k)}catch(e){}if(v!==null&&v!==''&&!isNaN(+v)&&+v>0)o[x.id]=Math.floor(+v)});return o}
  function nameOf(id){for(var i=0;i<LIST.length;i++)if(LIST[i].id===id)return LIST[i].name;return id}
  function overall(){var pts={};Object.keys(G||{}).forEach(function(id){G[id].slice(0,10).forEach(function(e,i){pts[e.n]=(pts[e.n]||0)+(10-i)})});
    return Object.keys(pts).map(function(n){return{n:n,s:pts[n]}}).sort(function(a,b){return b.s-a.s}).slice(0,30)}
  function msg(t){$('gbMsg').textContent=t}
  function row(rank,e,id){var r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:7px 10px;margin:5px 0;text-align:start';
    var medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'.';
    var a=document.createElement('div');a.style.cssText='width:34px;font-weight:900';a.textContent=medal;
    var b=document.createElement('div');b.style.cssText='flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';b.textContent=e.n;
    var c=document.createElement('div');c.style.cssText='font-weight:900;color:#ffd23f';c.textContent=e.s.toLocaleString(EN?'en-US':'he-IL');
    r.append(a,b,c);
    if(AG.isAdmin()){var x=document.createElement('button');x.textContent='✖';x.style.cssText='border:0;background:none;color:#ff7b95;font-size:16px;cursor:pointer';x.onclick=function(){del(e.n)};r.append(x)}
    return r}
  function paint(){var L=$('gbList');L.textContent='';var id=sel.value,arr=id==='_all'?overall():(G&&G[id])||[];
    if(!G){L.textContent=T('טוען…','Loading…');return}
    if(!arr.length){L.textContent=T('עוד אין תוצאות. היו הראשונים!','No scores yet. Be the first!');return}
    arr.slice(0,20).forEach(function(e,i){L.append(row(i+1,e,id))})}
  function fill(){var cur=sel.value;sel.textContent='';
    var o=document.createElement('option');o.value='_all';o.textContent=T('🏅 כללי (נקודות)','🏅 Overall (points)');sel.append(o);
    LIST.forEach(function(x){if(G&&G[x.id]&&G[x.id].length){var p=document.createElement('option');p.value=x.id;p.textContent=x.name;sel.append(p)}});
    if(cur&&[].some.call(sel.options,function(q){return q.value===cur}))sel.value=cur}
  function load(){fetch('/api/scores',{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){G=d.g||{};fill();paint()})
    .catch(function(e){$('gbList').textContent=e===503?T('לוח התוצאות עוד לא הופעל.','The leaderboard is not switched on yet.'):T('אין חיבור לשרת. נסו שוב מאוחר יותר.','No connection. Try again later.')})}
  function send(){var n=nm.value.trim();if(n.length<2){msg(T('כתבו כינוי (לפחות 2 תווים)','Enter a nickname (at least 2 characters)'));return}
    var sc=localBests();if(!Object.keys(sc).length){msg(T('עוד אין לך שיאים. שחקו קודם!','You have no records yet. Play first!'));return}
    try{localStorage.setItem('ag_name',n)}catch(e){}
    msg(T('שולח…','Sending…'));
    fetch('/api/scores',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n,scores:sc})}).then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
      .then(function(o){if(o.s===200){G=o.d.g;fill();paint();msg(o.d.changed?T('נשלח! עודכנו '+o.d.changed+' שיאים 🎉','Sent! '+o.d.changed+' records updated 🎉'):T('הכול כבר מעודכן','Everything is up to date'))}
        else msg(o.d.error==='name'?T('הכינוי לא מתאים, נסו אחר','That nickname is not allowed'):o.d.error==='banned'?T('הכינוי הזה נחסם','This nickname is blocked'):o.d.error==='not-configured'?T('לוח התוצאות עוד לא הופעל','The leaderboard is not switched on yet'):T('משהו השתבש','Something went wrong'))})
      .catch(function(){msg(T('אין חיבור לשרת','No connection'))})}
  function del(name){var code=prompt(T('קוד אדמין:','Admin code:'));if(!code)return;var ban=confirm(T('לחסום את הכינוי גם להמשך?','Also block this nickname from now on?'));
    fetch('/api/scores',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'delete',name:name,ban:ban,code:code})}).then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
      .then(function(o){if(o.s===200){G=o.d.g;fill();paint();msg(T('נמחק','Deleted'))}else msg(T('קוד שגוי','Wrong code'))})}
  $('gbB').onclick=function(){try{nm.value=localStorage.getItem('ag_name')||''}catch(e){}$('gbM').classList.add('show');msg('');G=null;paint();load()};
  $('gbX').onclick=function(){$('gbM').classList.remove('show')};$('gbSend').onclick=send;sel.onchange=paint;
})();
$('lbX').onclick=function(){$('lbM').classList.remove('show')};
(function(){var n=AG.played(),ok=n>=20||AG.isAdmin();$('bossT').textContent=ok?'סיפור: 3 פרקים – הגליץ׳, דינוזאור ענק ודרקון קוסמי':'שחקו ב-20 משחקים שונים כדי לפתוח ('+Math.min(n,20)+'/20)';var sp=0;try{sp=+localStorage.getItem('boss_story')||0}catch(e){}$('bossBar').style.width=Math.min(100,sp/20*100)+'%'})();
function showNote(x){$('noteT').textContent=x.noteTitle||x.name;$('noteP').textContent=x.note;$('noteM').classList.add('show');$('noteGo').onclick=function(){location.href=x.url};$('noteX').onclick=function(){$('noteM').classList.remove('show')}}
function $(i){return document.getElementById(i)}
function wal(){$('wc').textContent=AG.coins().toLocaleString('he-IL');$('wd').textContent=AG.diamonds().toLocaleString('he-IL')}
wal();AG.onChange(wal);
function admView(){var on=AG.isAdmin();$('admIn').style.display=on?'none':'block';$('admPanel').style.display=on?'block':'none'}
$('keyB').onclick=function(){$('admE').textContent='';$('admC').value='';admView();$('admM').classList.add('show')};
$('admX').onclick=function(){$('admM').classList.remove('show')};
$('admOk').onclick=function(){AG.tryAdmin($('admC').value).then(function(ok){if(ok){admView()}else{$('admE').textContent='הקוד לא נכון'}})};
$('a1').onclick=function(){AG.add(10000,0)};$('a2').onclick=function(){AG.add(0,500)};
$('a3').onclick=function(){if(confirm('לאפס מטבעות ויהלומים?')){AG.spend(AG.coins(),AG.diamonds())}};
$('a4').onclick=function(){AG.adminLogout();admView()};
</script>
</body>
